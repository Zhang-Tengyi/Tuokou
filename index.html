/* ---------- 耳机模式 ---------- */
const HF = {st:null};
function handsList(){
  const tn = dnum(today());
  const pool = CAT.cards.filter(c => (c.t === "r" || c.t === "t") && c.zh && c.en);
  const p = c => S.cards[c.id];
  const due = pool.filter(c => p(c) && p(c).due <= tn).sort((a, b) => p(a).due - p(b).due);
  const learning = pool.filter(c => p(c) && p(c).due > tn && p(c).box < K.MASTERED_BOX).sort((a, b) => p(a).due - p(b).due);
  let fresh = pool.filter(c => !p(c));
  if (interviewMode() === "interview") fresh = fresh.filter(c => ["interview","rescue"].includes(c.tag)).concat(fresh.filter(c => !["interview","rescue"].includes(c.tag)));
  const out = [], seen = new Set();
  for (const c of [...due, ...learning, ...K.diversify(fresh)]){ if (out.length >= 40) break; if (!seen.has(c.id)){ seen.add(c.id); out.push(c); } }
  return out;
}

function hfShow(){
  const st = HF.st; if (!st) return; const c = st.list[st.i];
  const zh = $("#hfZh"), en = $("#hfEn"), tr = $("#hfTrack"), cn = $("#hfCount");
  if (zh) zh.textContent = c ? c.zh : "没有可以练的句子";
  if (en) en.textContent = "";
  if (tr) tr.style.width = Math.round(st.i / Math.max(1, st.list.length) * 100) + "%";

}
function hfPhase(t){ const p = $("#hfPhase"); if (p) p.textContent = t; }
const hfAlive = tok => HF.st && HF.st.playing && HF.st.token === tok;
function hfCountdown(ms, tok){
  const ls = $$("#hfLamps i"); ls.forEach(i => i.classList.add("on"));
  const step = ms / ls.length;
  return new Promise(res => { let k = 0; const t = setInterval(() => { if (!hfAlive(tok)){ clearInterval(t); res(); return; } if (k < ls.length){ ls[k].classList.remove("on"); k++; } if (k >= ls.length){ clearInterval(t); res(); } }, step); });
}
async function hfLoop(tok){
  while (hfAlive(tok)){
    const st = HF.st; const c = st.list[st.i]; if (!c){ st.playing = false; break; }
    hfShow(); hfPhase("听中文，自己先说");
    if (TTS.hasZh()) await TTS.speak(c.zh, {lang:"zh"}); else { Snd.go(); await sleep(500); }
    if (!hfAlive(tok)) return;
    hfPhase("说出来");
    await hfCountdown((L.thinkSec || 4) * 1000, tok);
    if (!hfAlive(tok)) return;
    const en = $("#hfEn"); if (en) en.textContent = c.en; hfPhase("听标准说法");
    await TTS.speak(c.en);
    if (!hfAlive(tok)) return;
    hfPhase("跟着说一遍"); await sleep(Math.max(1800, c.en.length * 75));
    if (!hfAlive(tok)) return;
    st.n++; st.i = (st.i + 1) % st.list.length;
  }
}
function hfPlay(on){
  const st = HF.st; if (!st) return;

  const b = $("#hfToggle"); if (b){ b.innerHTML = on ? ICON.pause : ICON.play; b.setAttribute("aria-label", on ? "暂停" : "开始"); }

  else { Wake.off(); Act.stop(); $$("#hfLamps i").forEach(i => i.classList.remove("on")); hfPhase("暂停了"); }
}

/* ---------- 进度 ---------- */
VIEWS.progress = {
  tab:"progress",
  render(){
    const st = K.computeStreak(S.days, today()); const tn = dnum(today());
    let mastered = 0, learning = 0, fresh = 0;
    for (const c of CAT.cards){ const p = S.cards[c.id]; if (!p) fresh++; else if (p.box >= K.MASTERED_BOX) mastered++; else learning++; }
    const totalMin = Math.round(Object.values(S.days).reduce((a, d) => a + (d.sec || 0), 0) / 60);
    const fz = new Set(st.freezes); const dow = new Date().getDay(); const first = tn - dow - 77;
    let heat = "";
    for (let d = first; d <= tn; d++){ const ds = nstr(d); const x = S.days[ds]; const sec = x ? x.sec || 0 : 0; const done = K.dayDone(S.days, ds);
      const lv = !done ? "" : sec >= 600 ? "l3" : sec >= 180 ? "l2" : "l1"; heat += `<i class="${lv} ${fz.has(ds) ? "fz" : ""} ${d === tn ? "today" : ""}" title="${ds}"></i>`; }
    const wk = []; for (let d = tn - 6; d <= tn; d++){ const x = S.days[nstr(d)]; wk.push({d, m: x ? (x.sec || 0) / 60 : 0}); }
    const mx = Math.max(10, ...wk.map(w => w.m)); const WD = "日一二三四五六";
    const week = wk.map(w => `<div><i style="height:${Math.round(w.m / mx * 70) + 2}px"></i>${WD[new Date(w.d * 86400000).getUTCDay()]}</div>`).join("");
    const recent = K.tagAgg(S.tags, today(), 0, 7), earlier = K.tagAgg(S.tags, today(), 7, 35);
    const rows = Object.entries(recent).filter(([t, v]) => v[0] >= 3).map(([t, v]) => ({t, acc:v[1]/v[0], n:v[0], e: earlier[t] && earlier[t][0] >= 5 ? earlier[t][1]/earlier[t][0] : null})).sort((a, b) => a.acc - b.acc);
    const bars = rows.length ? rows.map(r => { const d = r.e == null ? "" : Math.round((r.acc - r.e) * 100); const tr = d === "" ? "" : d > 0 ? `<span class="up">+${d}</span>` : d < 0 ? `<span class="down">${d}</span>` : "";
      return `<div class="bar"><span class="small">${esc((TAGS[r.t]||TAGS.other).label)}</span><div class="t"><i style="width:${Math.round(r.acc*100)}%"></i></div><span class="v">${Math.round(r.acc*100)}% ${tr}</span></div>`; }).join("") : `<p class="small muted">练几天以后，这里会显示每类错误的正确率和变化。</p>`;
    const avgMs = (a, b) => { let s = 0, n = 0; for (let d = tn - b + 1; d <= tn - a; d++){ const x = S.days[nstr(d)]; if (x && x.mn){ s += x.ms; n += x.mn; } } return n ? s / n : 0; };
    const thisW = avgMs(0, 7), lastW = avgMs(7, 14);
    const nW = CONTENT.QUESTIONS.filter(written).length; const calls = S.calls.length;
    const hardN = CAT.cards.filter(c => S.cards[c.id] && (S.cards[c.id].lapses||0) >= 2).length;
    const reps = calls ? (S.calls.reduce((a, c) => a + (c.rep || 0), 0) / calls).toFixed(1) : null;
    return `<div class="wrap"><div class="top"><h2 style="font-size:26px">进度</h2></div>
      <div class="statgrid"><div class="stat"><span class="num">${st.streak}</span><span>连续天数</span></div><div class="stat"><span class="num">${mastered}</span><span>已掌握</span></div><div class="stat"><span class="num">${totalMin}</span><span>总分钟</span></div></div>
      <div class="panel"><h3>开口用时</h3>${thisW ? `<p style="margin-top:6px"><span class="num" style="font-size:30px">${fmt1(thisW)}</span> 秒，这 7 天平均${lastW ? `，前 7 天是 ${fmt1(lastW)} 秒` : ""}</p><p class="small muted">从灯灭到说完一句的时间。越短，说明越接近脱口而出。</p>` : `<p class="small muted" style="margin-top:6px">用麦克风或输入框答几题，这里就会显示你开口有多快。</p>`}</div>
      <div class="panel"><h3>最近 12 周</h3><div class="heat" style="margin-top:10px">${heat}</div><p class="small muted" style="margin-top:6px">颜色越深练得越久；虚线框是自动补签的日子（每周 1 次）。</p></div>
      <div class="panel"><h3>最近 7 天（分钟）</h3><div class="week" style="margin-top:10px">${week}</div></div>
      <div class="panel"><h3>每类正确率</h3><p class="small muted">最近 7 天，后面的数字是和更早相比的变化</p><div class="bars" style="margin-top:6px">${bars}</div></div>
      <div class="panel"><h3>题库</h3><p style="margin-top:6px">已掌握 ${mastered}，学习中 ${learning}，还没练 ${fresh}</p><p class="small muted">连续答对、间隔拉到 15 天以上算已掌握。</p>
        ${hardN ? `<p style="margin-top:10px">顽固错误 ${hardN} 句：错过 2 次以上</p><button class="btn sm" style="margin-top:6px" data-act="free-go" data-v="hard">专门练这些</button>` : ""}</div>
      <div class="panel"><h3>面试</h3><p style="margin-top:6px">写好回答 ${nW}/${CONTENT.QUESTIONS.length}，来电模拟 ${calls} 次${reps != null ? `，平均每通让对方重复 ${reps} 次` : ""}</p></div></div>`;
  }
};

      <div class="panel">${head("英文朗读","en")}<p class="small muted">${TTS.ok ? `找到 ${TTS.list("en").length} 个英文语音` : "这个浏览器不支持朗读"}</p>
        <div class="row-gap" style="margin-top:8px"><button class="btn sm" data-act="dv-say" data-lang="en">试听</button><button class="btn sm" data-act="dv-mark" data-k="en" data-v="ok">听到了</button><button class="btn sm" data-act="dv-mark" data-k="en" data-v="no">没声音</button></div>
        ${d.en === "no" ? `<p class="note">在手机设置里搜“文字转语音”，首选引擎选 Google 的语音服务，再下载“英语（美国）”的语音数据。</p>` : ""}</div>
      <div class="panel">${head("中文朗读（耳机模式用）","zh")}<p class="small muted">${TTS.hasZh() ? `找到 ${TTS.list("zh").length} 个中文语音` : "没找到中文语音"}</p>
        <div class="row-gap" style="margin-top:8px"><button class="btn sm" data-act="dv-say" data-lang="zh">试听</button><button class="btn sm" data-act="dv-mark" data-k="zh" data-v="ok">听到了</button><button class="btn sm" data-act="dv-mark" data-k="zh" data-v="no">没声音</button></div></div>
      <div class="panel">${head("自动语音识别","sr")}
        ${SR.broken ? `<p class="note" style="margin-top:6px">这台手机上，Chrome 借用的 Google 语音识别服务没有响应（错误代码 aborted），所以自动识别用不了。录音不受影响，练习已经自动改成键盘语音输入。</p>
          <p class="small" style="margin-top:8px">可以这样修：</p><ol class="issues small"><li>打开 Play 商店搜“Google”，把 Google 应用更新到最新；如果按钮显示“启用”，就点启用</li><li>设置 → 应用 → 应用管理 → Google → 权限 → 麦克风，改成允许</li><li>重启手机，回来点下面的按钮再试</li></ol>
          <button class="btn sm" style="margin-top:8px" data-act="dv-sr-reset">再试一次自动识别</button>` :
        `<p class="small muted">${SR.ok ? "点测试，然后说：It's a little windy today." : "这个浏览器不支持自动识别，练习时用键盘语音输入就行。"}</p>
        ${SR.ok ? `<button class="btn sm" style="margin-top:8px" data-act="dv-sr">测试</button><div class="heard" id="dvHeard"></div>` : ""}`}<div id="dvLocal" class="small muted"></div></div>
      <div class="panel">${head("录音","rec")}<button class="btn sm" style="margin-top:8px" data-act="dv-rec">录 3 秒试试</button><div id="dvAudio"></div></div>
      <div class="panel"><h3>键盘语音输入（没网时用）</h3><p class="small" style="margin-top:6px">在任意输入框里点键盘上的麦克风就能说。想没网也能用：打开 Gboard 设置，进“语音输入”，打开离线识别并下载“英语（美国）”。不同手机的菜单名字可能略有不同。</p>
        <input type="text" class="en" placeholder="点这里，用键盘的麦克风说一句" style="margin-top:10px" aria-label="试试键盘语音输入"></div>
      <button class="btn primary block big" style="margin-top:14px" data-act="dv-done" data-from="${esc(p.from || "")}">完成</button></div>`;
  },
  mount(){ const el = $("#dvLocal"); if (el && SR.ok) el.innerHTML = `<button class="btn sm ghost" style="margin-top:6px;padding-left:0" data-act="dv-local">检查能不能离线识别</button>`; }
};
ACT["dv-local"] = () => dvLocal();
async function dvLocal(){
  const el = $("#dvLocal"); if (!el) return;
  const r = await SR.checkLocal(); if (!el.isConnected) return;
  if (r === "available") el.innerHTML = "离线识别：已就绪，没网也能自动识别。";
  else if (r === "downloadable") el.innerHTML = `离线识别：可以下载。<button class="btn sm" style="margin-left:6px" data-act="dv-install">下载离线识别</button>`;
  else if (r === "downloading") el.innerHTML = "离线识别：正在下载……";
  else if (r === "unavailable") el.innerHTML = "这台设备不支持离线识别，没网时用键盘语音输入。";
  else el.innerHTML = "";
}
ACT["dv-say"] = el => TTS.speak(el.dataset.lang === "zh" ? "这是中文朗读测试。" : "Hi, this is a speech test. Can you hear me okay?", {lang:el.dataset.lang});
ACT["dv-mark"] = el => { L.device = L.device || {}; L.device[el.dataset.k] = el.dataset.v; saveLocal(); UI.render(); };
ACT["dv-mic-reset"] = () => { MIC.blocked = false; L.device = L.device || {}; L.device.micBlocked = false; saveLocal(); UI.render(); };
ACT["dv-sr"] = async el => {
  const h = $("#dvHeard"); if (MIC.blocked){ if (h) h.textContent = srErrorText("not-allowed"); return; }
  el.disabled = true; if (h) h.textContent = "在听……";
  const r = await SR.listen({onInterim: t => { if (h && h.isConnected) h.textContent = t; }});
  if (!el.isConnected) return; el.disabled = false;
  L.device = L.device || {};
  if (r.text){ L.device.sr = "ok"; if (h) h.textContent = "识别到：" + r.text; }
  else { L.device.sr = r.error === "network" ? "net" : "no"; if (h) h.textContent = srErrorText(r.error || "no-speech"); }
  saveLocal(); if (r.broke) UI.render();
};
ACT["dv-sr-reset"] = () => { SR.broken = false; SR.fails = 0; L.device = L.device || {}; L.device.srBroken = false; delete L.device.sr; saveLocal(); UI.render(); toast("可以再点“测试”了"); };
ACT["dv-install"] = async () => { const el = $("#dvLocal"); if (el) el.textContent = "正在下载……"; const ok = await SR.installLocal(); if (el && el.isConnected) el.textContent = ok ? "离线识别：已就绪。" : "下载没成功，联网后再试。"; };
ACT["dv-rec"] = async el => {
  el.disabled = true; const box = $("#dvAudio");
  try { await Rec.start(null); } catch (e) { el.disabled = false; L.device.rec = "no"; saveLocal(); if (box) box.innerHTML = `<p class="note">${MIC.blocked ? "这个版本不能录音，和手机设置无关；离线版可以。" : e && e.name === "NotAllowedError" ? "麦克风被拒绝了：在 Chrome 的网站设置里给这个页面开麦克风。" : "这台设备不能录音。"}</p>`; UI.render(); return; }
  if (box) box.innerHTML = `<p class="small muted">录音中，说点什么……</p>`;
  await sleep(3000); const r = await Rec.stop(); el.disabled = false;
  L.device = L.device || {}; L.device.rec = r && r.blob && r.blob.size ? "ok" : "no"; saveLocal();
  if (box && box.isConnected) box.innerHTML = r && r.blob && r.blob.size ? `<audio controls src="${URL.createObjectURL(r.blob)}"></audio>` : `<p class="note">没录到声音。</p>`;
};
ACT["dv-done"] = el => { if (el.dataset.from === "ob") UI.tab("home"); else UI.back(); };

/* ---------- 安装、练法 ---------- */
const PWA = {prompt:null};
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); PWA.prompt = e; const t = UI.top(); if (t && (t.name === "home" || t.name === "install")) UI.refresh(); });
window.addEventListener("appinstalled", () => { PWA.prompt = null; toast("装好了，以后从桌面图标打开"); });
ACT["pwa-install"] = async () => { if (!PWA.prompt){ UI.nav("install"); return; } try { PWA.prompt.prompt(); await PWA.prompt.userChoice; } catch (e) {} PWA.prompt = null; UI.refresh(); };
VIEWS.install = {
  tab:"me",
  render(){
    if (BUILD.pwa){
      const inst = isStandalone(); const sw = navigator.serviceWorker && navigator.serviceWorker.controller;
      return `<div class="wrap">${backBtn()}<h2>离线安装</h2>
        <div class="panel" style="margin-top:14px"><p>${inst ? "已经装在桌面上了。" : "还没装到桌面。"}${sw ? "离线缓存已经准备好，没网也能打开。" : "离线缓存还没准备好：联网打开一次，过几秒再刷新。"}</p>
        ${PWA.prompt && !inst ? `<button class="btn primary block" style="margin-top:12px" data-act="pwa-install">安装到桌面</button>` : ""}
        ${!inst ? `<p class="small muted" style="margin-top:10px">没有安装按钮的话：点 Chrome 右上角的菜单，选“安装应用”或“添加到主屏幕”。</p>` : ""}</div>
        <div class="panel"><h3>更新</h3><p class="small" style="margin-top:6px">有新版本时，把新文件传到原来的地方覆盖。app 联网打开时会在后台更新，下次打开就是新版。</p></div></div>`;
    }
    return `<div class="wrap">${backBtn()}<h2>离线版说明</h2>
      <div class="panel" style="margin-top:14px"><p>你现在用的是 claude.ai 版：打开就能用，进度同步到你的 Claude 账号，有 AI 标错，但需要联网。</p>
      <p style="margin-top:10px">离线版是同一套程序，要先放到一个免费网站上，再用 Chrome 装到桌面。安装包和步骤在你和 Claude 的对话里。</p>
      <p style="margin-top:10px">换到离线版之前，先在“备份与恢复”里复制备份，装好后再恢复进去。</p></div></div>`;
  }
};
VIEWS.about = {
  tab:"me",
  render(){
    return `<div class="wrap">${backBtn()}<h2>这个 app 的练法</h2>
      <div class="panel" style="margin-top:14px"><ul class="issues">
        <li><b>先说，再看答案。</b>从记忆里把句子说出来，比看十遍记得牢。所以几乎每道题都要你开口。</li>
        <li><b>灯灭就开口。</b>用时从灯灭算到你说完。用时越短，越接近脱口而出；某句刷新最快纪录时会变成紫色。</li>
        <li><b>三个按钮决定下次什么时候再见。</b>没说出来，明天再练；卡了一下，过几天；秒出，隔得更久。会的越来越少出现，不会的很快回来。</li>
        <li><b>说错了先自己改。</b>差一点时，app 先只给提示，让你再说一次，再给答案。自己改出来的记得更牢。</li>
        <li><b>复习听力时听后复述。</b>新句子先选意思；复习时不看文字整句说出来，练的是把连读的声音听成一个个词。</li>
        <li><b>说错了，说 3 遍再走。</b>这是你报告里验证过的“改错后巩固法”，这一轮结束前还会再考你一次。</li>
        <li><b>按弱项出题。</b>每道题都标了错误类型，哪类正确率低就多出哪类。面试前 3 周会多放面试内容。</li>
        <li><b>内容会长大。</b>和 Claude 练完，让它给你导入码，新句子就进了每天的复习。</li></ul></div>
      <div class="panel"><h3>推荐用法</h3><ul class="issues">
        <li>每天：首页点“开始”，10 分钟。没空就选 3 分钟，保住连续天数。</li>
        <li>面试前：先在“面试”页写好 Q1、Q2、Q6，复制给 Claude 改，再用来电模拟每天打 1 通。</li>
        <li>碎片时间：戴耳机开耳机模式。</li>
        <li>睡前：语音日记 1 分钟，用过去式讲今天。</li>
        <li>每两周备份一次：我的 → 备份与恢复。</li></ul></div></div>`;
  }
};

function micBanner(){
  if (!MIC.blocked || L.micTipSeen) return "";
  return `<div class="banner"><span>这个版本不能直接用麦克风：答题时点输入框，用键盘上的麦克风说，效果一样。要自动识别和录音，用离线版。</span><button class="btn sm" data-act="mic-tip-ok">知道了</button></div>`;
}
ACT["mic-tip-ok"] = () => { L.micTipSeen = true; saveLocal(); UI.refresh(); };
function backupBanner(){
  const practiced = Object.keys(S.cards).length; const now = Date.now();
  if (practiced < 30 || (L.lastBackup && now - L.lastBackup < 14 * 864e5) || (L.bkSnooze && now < L.bkSnooze)) return "";
  return `<div class="banner"><span>${L.lastBackup ? "两周没备份了" : "还没备份过"}。进度只存在这台手机上，花 10 秒备份一下。</span><span class="row-gap" style="flex-wrap:nowrap"><button class="btn sm ghost" data-act="bk-snooze">以后</button><button class="btn sm primary" data-act="nav" data-v="backup">备份</button></span></div>`;
}
ACT["bk-snooze"] = () => { L.bkSnooze = Date.now() + 7 * 864e5; saveLocal(); UI.refresh(); };
document.addEventListener("focusin", e => {
  const t = e.target;
  if (t && /^(INPUT|TEXTAREA)$/.test(t.tagName) && !/^(checkbox|range|date|radio)$/.test(t.type || "")){
    document.body.classList.add("typing");
    setTimeout(() => { try { const r = t.getBoundingClientRect(); const vh = window.visualViewport ? visualViewport.height : innerHeight; if (r.bottom > vh - 8 || r.top < 0) t.scrollIntoView({block:"center", behavior:"smooth"}); } catch (err) {} }, 350);
  }
});
document.addEventListener("focusout", () => { setTimeout(() => { const a = document.activeElement; if (!a || !/^(INPUT|TEXTAREA)$/.test(a.tagName)) document.body.classList.remove("typing"); }, 300); });

/* ---------- 练习计划（如果……就……） ---------- */
const PLAN_OPTS = ["晚饭后坐下的时候","睡前躺到床上的时候","早上起床洗漱完","坐车、走路的时候","午饭后"];
let PLAN_PICK = null;
VIEWS.plan = {
  tab:"me", noRefresh:true,
  render(){
    const cur = S.settings.planWhen || ""; PLAN_PICK = null;
    return `<div class="wrap">${backBtn()}<h2>定一个固定的练习时间</h2>
      <p class="muted small" style="margin:6px 0 14px">写成“如果……就……”的计划，比只说“我要每天练”更容易坚持。选一个你每天一定会碰到的时刻。</p>
      <div class="panel"><div class="small muted">如果……</div><div class="chips" style="margin-top:8px">${PLAN_OPTS.map(o => `<button class="chip ${o === cur ? "k" : ""}" data-act="plan-pick" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div>
        <label class="fld"><span>或者自己写</span><input type="text" id="planText" value="${esc(PLAN_OPTS.includes(cur) ? "" : cur)}" placeholder="比如：洗完澡以后"></label>
        <p style="margin-top:12px">……我就打开脱口，至少练 3 分钟。</p></div>
      <button class="btn primary big block" style="margin-top:14px" data-act="plan-save">保存</button>
      ${cur ? `<button class="btn ghost block" style="margin-top:6px" data-act="plan-clear">不定计划</button>` : ""}</div>`;
  }
};
ACT["plan-pick"] = el => { const t = $("#planText"); if (t) t.value = ""; $$('[data-act="plan-pick"]').forEach(b => b.classList.remove("k")); el.classList.add("k"); PLAN_PICK = el.dataset.v; };
ACT["plan-save"] = () => { const t = (($("#planText")||{}).value || "").trim(); const v = t || PLAN_PICK || S.settings.planWhen; if (!v){ toast("选一个时刻，或者自己写一个"); return; } S.settings.planWhen = v; PLAN_PICK = null; save(); toast("记下了"); UI.back(); };
ACT["plan-clear"] = () => { S.settings.planWhen = ""; save(); UI.back(); };

/* ---------- 首次引导 ---------- */
VIEWS.onboard = {
  full:true,
  render(){
    return `<div class="wrap" style="padding-top:32px"><div class="gantry big" id="obLamps">${lamps()}</div>
      <div class="wordmark" style="margin-top:22px;font-size:60px">脱口</div>
      <p style="font-size:18px;margin-top:10px">把“知道”的英语，练成“脱口而出”。</p>
      <div class="panel" style="margin-top:22px"><h3>每道题这样练</h3><ol class="issues"><li>看中文提示</li><li>灯灭，马上开口说英文</li><li>对答案，给自己打分</li><li>app 按你说得怎么样，安排下次什么时候再练</li></ol></div>
      <label class="fld"><span>电话面试是哪天？可以先空着</span><input type="date" id="obDate" value="${esc(S.settings.interviewDate)}"></label>
      <div class="fld" style="margin-top:12px"><span class="small muted">每天什么时候练？选一个每天都会碰到的时刻</span><div class="chips" style="margin-top:8px">${PLAN_OPTS.map(o => `<button class="chip" data-act="ob-plan" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div></div>
      <button class="btn primary big block" style="margin-top:18px" data-act="ob-go">先测一下手机能不能朗读和识别</button>
      <button class="btn ghost block" style="margin-top:6px" data-act="ob-skip">跳过，直接开始</button></div>`;
  },
  mount(){ setTimeout(() => runLights($("#obLamps"), 260, 500, true), 300); }
};
function obSave(){ const d = $("#obDate"); if (d && d.value) S.settings.interviewDate = d.value; if (PLAN_PICK) S.settings.planWhen = PLAN_PICK; PLAN_PICK = null; S.settings.onboarded = true; save(true); }
ACT["ob-plan"] = el => { $$('[data-act="ob-plan"]').forEach(b => b.classList.remove("k")); el.classList.add("k"); PLAN_PICK = el.dataset.v; };
ACT["ob-go"] = () => { obSave(); UI.stack = [{name:"home", params:{}}]; UI.nav("device", {from:"ob"}); };
ACT["ob-skip"] = () => { obSave(); UI.tab("home"); };

/* ---------- 启动 ---------- */
function boot(){
  UI.root = $("#app");
  applyTheme(); TTS.init(); MIC.init(); if (L.device && L.device.srBroken) SR.broken = true;
  UI.stack = [{name: S.settings.onboarded ? "home" : "onboard", params:{}}];
  try { history.replaceState({d:1}, ""); } catch (e) {}
  UI.render();
  if (L.device && L.device.local === "available") SR.local = true;
  setTimeout(() => { Cloud.init(); AI.init(); }, 0);
  if (BUILD.pwa && "serviceWorker" in navigator && (location.protocol === "https:" || /^(localhost|127\.0\.0\.1)$/.test(location.hostname))) navigator.serviceWorker.register("./sw.js").catch(() => {});
  if (BUILD.pwa && "serviceWorker" in navigator){ let had = !!navigator.serviceWorker.controller; navigator.serviceWorker.addEventListener("controllerchange", () => { if (had) toast("已更新到新版本，下次打开生效"); had = true; }); }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  let day = today();
  setInterval(() => { if (today() !== day){ day = today(); const t = UI.top(); if (t && t.name === "home") UI.refresh(); } }, 60000);
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();

</script>
</body>
</html>
