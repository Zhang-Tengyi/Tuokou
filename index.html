<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#16202B">
<title>脱口</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:ital,wght@0,600;1,600;1,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* 脱口 · 样式。起步灯是唯一的“大动作”，其余保持安静。 */
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#ECEFF3; --surface:#FFFFFF; --surface2:#F4F6F9; --ink:#16202B; --ink2:#36424F; --muted:#5B6774; --line:#D5DBE2;
  --red:#D90F2C; --red-soft:#FBE3E7; --purple:#7A2FDB; --purple-soft:#EEE4FC; --green:#0B8F50; --green-soft:#DCF3E6;
  --amber:#B87800; --amber-soft:#FBEFD3; --cta:#16202B; --cta-ink:#FFFFFF; --focus:#2F6FDE;
  --gantry:#1A222C; --lamp-off:#2E3742; --lamp-on:#FF1F3D;
  --f-ui:system-ui,-apple-system,"Segoe UI","PingFang SC","Noto Sans SC","Noto Sans CJK SC","Microsoft YaHei",Roboto,sans-serif;
  --f-en:"Source Serif 4","Noto Serif",Georgia,"Times New Roman",serif;
  --f-num:"Barlow Semi Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --tabbar-h:64px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1319; --surface:#17202A; --surface2:#1E2834; --ink:#E9EEF3; --ink2:#C3CCD6; --muted:#93A0AE; --line:#2B3746;
    --red:#FF5068; --red-soft:#3A1A22; --purple:#B58AFF; --purple-soft:#2B2140; --green:#3DD68C; --green-soft:#13301F;
    --amber:#FFC24A; --amber-soft:#3A2E12; --cta:#E9EEF3; --cta-ink:#0E1319; --focus:#7FA8FF;
    --gantry:#080B0F; --lamp-off:#232C37; --lamp-on:#FF2D4B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1319; --surface:#17202A; --surface2:#1E2834; --ink:#E9EEF3; --ink2:#C3CCD6; --muted:#93A0AE; --line:#2B3746;
  --red:#FF5068; --red-soft:#3A1A22; --purple:#B58AFF; --purple-soft:#2B2140; --green:#3DD68C; --green-soft:#13301F;
  --amber:#FFC24A; --amber-soft:#3A2E12; --cta:#E9EEF3; --cta-ink:#0E1319; --focus:#7FA8FF;
  --gantry:#080B0F; --lamp-off:#232C37; --lamp-on:#FF2D4B;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.55;
  -webkit-tap-highlight-color:transparent;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
img,svg{max-width:100%}
.hide{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:16px 18px calc(var(--tabbar-h) + 24px)}
.full .wrap{padding-bottom:28px}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.center{text-align:center}
.stack>*+*{margin-top:12px}
.row-gap{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{height:16px}
h1,h2,h3{margin:0;line-height:1.25}
h2{font-size:21px;font-weight:700;letter-spacing:-.01em}
h3{font-size:16px;font-weight:700}
p{margin:0}
a{color:var(--focus)}

/* 数字：计时牌字体 */
.num{font-family:var(--f-num);font-style:italic;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.01em}

/* 顶部 */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 18px}
.wordmark{font-size:40px;font-weight:900;letter-spacing:-.04em;line-height:1}
.streak{display:flex;align-items:baseline;gap:6px;text-align:right}
.streak .num{font-size:34px;line-height:1}
.streak .lbl{font-size:13px;color:var(--muted);line-height:1.2}
.subhead{display:flex;align-items:center;gap:10px;margin:2px 0 16px}
.back{border:0;background:none;padding:6px 8px 6px 0;font-size:15px;color:var(--muted);display:flex;align-items:center;gap:4px}

/* 起步灯 */
.gantry{display:inline-flex;gap:10px;padding:10px 14px;border-radius:999px;background:var(--gantry)}
.gantry i{width:18px;height:18px;border-radius:50%;background:var(--lamp-off);box-shadow:inset 0 -2px 0 rgba(0,0,0,.35);transition:background .08s}
.gantry i.on{background:var(--lamp-on);box-shadow:0 0 10px var(--lamp-on),inset 0 -2px 0 rgba(0,0,0,.2)}
.gantry.big i{width:26px;height:26px}
.gantry.small{gap:7px;padding:7px 10px}
.gantry.small i{width:12px;height:12px}

/* 首页主区 */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:20px 18px 18px;margin-bottom:22px}
.hero .gantry{margin-bottom:16px}
.hero h2{font-size:24px}
.hero .meta{margin-top:6px;color:var(--muted);font-size:14px}
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px;margin:14px 0 12px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 4px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 0 var(--line)}
.countdown{display:flex;align-items:baseline;gap:8px;margin:-6px 0 22px;padding:0 4px}
.countdown .num{font-size:30px;color:var(--amber)}

/* 按钮 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 16px;border-radius:14px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:15.5px;font-weight:600;text-decoration:none;user-select:none}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--cta);color:var(--cta-ink);border-color:var(--cta)}
.btn.block{display:flex;width:100%}
.btn.big{min-height:56px;font-size:17px;border-radius:16px}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:11px}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn svg{width:20px;height:20px;flex:none}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;padding:0}
.icon-btn svg{width:22px;height:22px}

/* 模块列表 */
.feature{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:18px;border-radius:20px;border:0;
  background:var(--gantry);color:#F2F5F8;margin-bottom:12px}
.feature svg{width:30px;height:30px;flex:none}
.feature b{display:block;font-size:17px}
.feature span{display:block;font-size:13.5px;color:#AEB8C3}
.mods{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mod{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);text-align:left}
.mod svg{width:24px;height:24px;color:var(--ink2)}
.mod b{font-size:15.5px}
.mod span{font-size:12.5px;color:var(--muted);line-height:1.35}
.tip{margin:22px 4px 0;padding-left:12px;border-left:3px solid var(--lamp-on);color:var(--ink2);font-size:14.5px}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:14px;background:var(--surface2);border:1px dashed var(--line);margin-bottom:16px;font-size:14px}

/* 通用面板与表单 */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.panel+.panel{margin-top:12px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border:0;border-top:1px solid var(--line);background:none;text-align:left}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .grow b{display:block;font-weight:600}
.li .grow span{display:block;font-size:13px;color:var(--muted)}
.li .end{font-size:13px;color:var(--muted);white-space:nowrap}
.sec-title{font-size:13.5px;color:var(--muted);margin:22px 4px 8px;font-weight:600}
label.fld{display:block;margin-top:12px}
label.fld>span{display:block;font-size:13.5px;color:var(--muted);margin-bottom:6px}
input[type=text],input[type=date],input[type=number],textarea,select{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font-size:16px}
textarea{min-height:110px;resize:vertical;line-height:1.5}
textarea.en,input.en{font-family:var(--f-en);font-size:17px}
input[type=range]{width:100%}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.switch:first-child{border-top:0}
.switch input{width:22px;height:22px}

/* 标签 */
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:12.5px;background:var(--surface2);border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.chip.k{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chips{display:flex;gap:6px;flex-wrap:wrap}

/* 练习页 */
.runbar{display:flex;align-items:center;gap:12px;margin:2px 0 18px}
.runbar .track{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.runbar .track i{display:block;height:100%;background:var(--ink);border-radius:99px;transition:width .25s}
.runbar .num{font-size:15px;color:var(--muted);font-style:normal}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:20px 18px;min-height:220px}
.card .kind{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.zh{font-size:24px;font-weight:600;line-height:1.4;letter-spacing:.01em}
.en{font-family:var(--f-en);font-size:24px;line-height:1.38;font-weight:400}
.en.sm{font-size:19px}
.wrong{font-family:var(--f-en);font-size:22px;line-height:1.4;text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2px}
.verb{font-family:var(--f-en);font-size:34px;line-height:1.1;margin-bottom:12px}
.parts{display:flex;gap:8px;flex-wrap:wrap}
.parts .chip{font-size:15px;padding:6px 12px}
.parts .chip.cue{background:var(--amber-soft);border-color:transparent;color:var(--ink)}
.go-row{display:flex;align-items:center;gap:12px;margin:18px 0 6px}
.go-row .num{font-size:20px;color:var(--muted)}
.answer-zone{margin-top:16px}
.mic{width:84px;height:84px;border-radius:50%;border:0;background:var(--cta);color:var(--cta-ink);display:flex;align-items:center;justify-content:center;margin:6px auto 4px;position:relative}
.mic svg{width:34px;height:34px}
.mic.live::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:3px solid var(--lamp-on);animation:pulse 1.1s ease-out infinite}
@keyframes pulse{from{transform:scale(.92);opacity:1}to{transform:scale(1.18);opacity:0}}
.heard{min-height:26px;text-align:center;font-family:var(--f-en);font-size:18px;color:var(--ink2);margin:6px 0 10px}
.or{display:flex;gap:8px;margin-top:8px}
.or input{flex:1}
.reveal{margin-top:16px;border-top:1px solid var(--line);padding-top:16px}
.say-line{display:flex;align-items:flex-start;gap:10px}
.say-line .en{flex:1}
.alts{margin-top:8px;font-size:14px;color:var(--muted)}
.alts .en{font-size:16px}
.note{margin-top:10px;font-size:14.5px;color:var(--ink2)}
.verdict{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-weight:700}
.verdict.exact{color:var(--green)}
.verdict.close{color:var(--amber)}
.verdict.off{color:var(--red)}
.time-chip{margin-left:auto;font-size:17px;color:var(--muted)}
.time-chip.pb{color:var(--purple);animation:pbflash .6s ease-out 2}
@keyframes pbflash{50%{transform:scale(1.15)}}
.diff{font-family:var(--f-en);font-size:17px;line-height:1.9;background:var(--surface2);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.diff .x{text-decoration:line-through;color:var(--red)}
.diff .m{color:var(--green);border-bottom:2px solid var(--green);padding:0 2px}
.diff .s{color:var(--amber);border-bottom:2px dotted var(--amber)}
.diff .s small{font-family:var(--f-ui);font-size:12px;color:var(--muted)}
.fb{margin:0 0 10px;padding-left:18px;font-size:14.5px;color:var(--ink2)}
.rate{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:16px}
.rate button{min-height:58px;border-radius:14px;border:2px solid transparent;font-weight:700;font-size:15px;line-height:1.2}
.rate small{display:block;font-weight:400;font-size:11.5px;opacity:.8;margin-top:2px}
.rate .again{background:var(--red-soft);color:var(--red)}
.rate .hard{background:var(--amber-soft);color:var(--amber)}
.rate .good{background:var(--purple-soft);color:var(--purple)}
.rate .sug{border-color:currentColor}
.dots{display:flex;gap:12px;justify-content:center;margin:16px 0}
.dots i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line)}
.dots i.on{background:var(--green);border-color:var(--green)}
.blur{filter:blur(7px);transition:filter .2s;user-select:none}
.blur.peek{filter:none}
.step-done{font-family:var(--f-en);font-size:16px;color:var(--muted);margin-top:4px}
.options{display:grid;gap:8px;margin-top:14px}
.options button{text-align:left;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.options button.right{border-color:var(--green);background:var(--green-soft)}
.options button.wrongpick{border-color:var(--red);background:var(--red-soft)}
.listen-hero{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0 4px}
.play{width:92px;height:92px;border-radius:50%;border:0;background:var(--cta);color:var(--cta-ink);display:flex;align-items:center;justify-content:center}
.play svg{width:38px;height:38px}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.check:first-child{border-top:0}
.check input{width:20px;height:20px;margin-top:2px;flex:none}
.timer{font-size:46px;line-height:1;text-align:center;margin:10px 0}
.timer.over{color:var(--red)}
.level{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0}
.level i{display:block;height:100%;width:calc(var(--lvl,0)*100%);background:var(--green);transition:width .08s}
audio{width:100%;margin-top:8px}

/* 总结 */
.summary .big{font-size:56px;line-height:1}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat .num{display:block;font-size:28px;line-height:1.1}
.stat span{font-size:12.5px;color:var(--muted)}

/* 来电模拟（始终是深色） */
.call{position:fixed;inset:0;z-index:50;background:radial-gradient(120% 80% at 50% 0%,#24313F 0%,#0B1016 70%);color:#EEF2F6;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 28px) 22px calc(env(safe-area-inset-bottom,0px) + 28px);overflow-y:auto}
.call .who{text-align:center;margin-top:24px}
.call .avatar{width:96px;height:96px;border-radius:50%;margin:0 auto 14px;background:#2C3A49;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:700}
.call.ringing .avatar{animation:ring 1.4s ease-in-out infinite}
@keyframes ring{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.25)}50%{box-shadow:0 0 0 18px rgba(255,255,255,0)}}
.call .name{font-size:26px;font-weight:700}
.call .status{color:#9FB0C1;margin-top:4px}
.call .clock{font-size:20px;color:#9FB0C1;margin-top:4px}
.call .say{margin:26px auto 0;max-width:420px;text-align:center;min-height:90px}
.call .say .en{font-size:21px;color:#F4F7FA}
.call .say .zh{font-size:15px;color:#9FB0C1;font-weight:400;margin-top:6px}
.call .cheat{margin:14px auto 0;max-width:420px;background:rgba(255,255,255,.07);border-radius:14px;padding:12px 14px;font-size:14.5px;color:#D6DEE6}
.call .controls{margin-top:auto;display:grid;gap:10px;max-width:420px;width:100%;margin-left:auto;margin-right:auto;padding-top:24px}
.call .btn{background:rgba(255,255,255,.1);border-color:transparent;color:#EEF2F6}
.call .btn.primary{background:#EEF2F6;color:#0B1016}
.call .accept-row{display:flex;justify-content:space-around;margin-top:auto;padding-top:40px}
.round{width:76px;height:76px;border-radius:50%;border:0;display:flex;align-items:center;justify-content:center;color:#fff}
.round svg{width:34px;height:34px}
.round.green{background:#19B868}
.round.red{background:#E5304A}
.round-lbl{text-align:center;font-size:13px;color:#9FB0C1;margin-top:8px}
.call .level{background:rgba(255,255,255,.12)}
.call .muted{color:#9FB0C1}

/* 耳机模式 */
.hands-zh{font-size:30px;font-weight:600;line-height:1.35;text-align:center;margin:28px 0 18px;min-height:84px}
.hands-en{font-family:var(--f-en);font-size:26px;text-align:center;min-height:72px;color:var(--ink2)}
.hands-phase{text-align:center;margin-top:10px}

/* 进度 */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px;overflow-x:auto;padding-bottom:4px}
.heat i{width:16px;height:16px;border-radius:4px;background:var(--surface2);border:1px solid var(--line)}
.heat i.l1{background:var(--green-soft);border-color:var(--green-soft)}
.heat i.l2{background:color-mix(in srgb,var(--green) 55%,var(--surface));border-color:transparent}
.heat i.l3{background:var(--green);border-color:var(--green)}
.heat i.fz{border:1.5px dashed var(--amber)}
.heat i.today{outline:2px solid var(--ink);outline-offset:1px}
.bars .bar{display:grid;grid-template-columns:86px 1fr 64px;gap:10px;align-items:center;padding:7px 0}
.bars .bar .t{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bars .bar .t i{display:block;height:100%;background:var(--ink)}
.bars .bar .v{text-align:right;font-size:13.5px}
.up{color:var(--green)} .down{color:var(--red)}
.week{display:flex;align-items:flex-end;gap:8px;height:90px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;color:var(--muted)}
.week div i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:var(--ink);min-height:2px}

/* 写作自查 */
.marked{font-family:var(--f-en);font-size:17px;line-height:1.8;white-space:pre-wrap;background:var(--surface2);border-radius:12px;padding:12px}
.marked mark{background:var(--amber-soft);color:inherit;border-bottom:2px solid var(--amber);padding:0 1px}
.marked mark sup{font-family:var(--f-ui);font-size:10.5px;color:var(--amber);margin-left:1px}
.issues{margin:10px 0 0;padding-left:20px}
.issues li{margin:6px 0;font-size:14.5px}
.ai-out{margin-top:12px}
.ai-out .better{font-family:var(--f-en);font-size:17px;line-height:1.6;margin-top:8px}

/* 底部导航 */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);display:flex;justify-content:space-around}
.tabbar button{flex:1;max-width:140px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 9px;font-size:12px;color:var(--muted);position:relative}
.tabbar svg{width:24px;height:24px}

/* ---------- 练完结算对战（名字都加 bt- 前缀，避免和 app 原有的样式、颜色变量重名） ---------- */
:root{--bt-energy:#11A4B8;--bt-energy-glow:rgba(17,164,184,.5);--bt-hp-ghost:#8A86A8;--bt-ghost-filter:grayscale(.75) sepia(.35) hue-rotate(185deg) saturate(1.5) brightness(.95)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bt-energy:#5FE3F0;--bt-energy-glow:rgba(95,227,240,.45);--bt-hp-ghost:#9C98C6;--bt-ghost-filter:grayscale(.75) sepia(.35) hue-rotate(185deg) saturate(1.5) brightness(.85)}}
:root[data-theme="dark"]{--bt-energy:#5FE3F0;--bt-energy-glow:rgba(95,227,240,.45);--bt-hp-ghost:#9C98C6;--bt-ghost-filter:grayscale(.75) sepia(.35) hue-rotate(185deg) saturate(1.5) brightness(.85)}
.bt-wrap{margin:0 0 16px;text-align:left}
.bt-stage{position:relative;aspect-ratio:3/2;border-radius:14px;overflow:hidden;background:#9CC8EC;border:1px solid var(--line,#C0C9D4);width:100%}
.bt-stage.night{background:#101836}
.bt-stage.calibrating{cursor:crosshair}
.bt-scene{position:absolute;left:0;bottom:0;width:100%;height:100%;max-width:none;display:block;user-select:none;pointer-events:none}
.bt-hud{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;gap:16px;z-index:3}
.bt-hp{width:44%}
.bt-hp .bt-name{font-size:.8rem;line-height:1.3;margin-bottom:4px;color:#16202E;text-shadow:0 1px 0 rgba(255,255,255,.65)}
.bt-stage.night .bt-hp .bt-name,.bt-stage.night .bt-score,.bt-stage.night .bt-shields{color:#EEF2FA;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.bt-hp.right{text-align:right}
.bt-score{font-size:.95rem;font-weight:800;color:#16202E;text-shadow:0 1px 0 rgba(255,255,255,.65);font-variant-numeric:tabular-nums}
.bt-shields{font-size:.75rem;margin-top:3px;color:#16202E;font-weight:700;min-height:1em}
.bt-bar{position:relative;height:8px;border-radius:4px;background:rgba(10,16,30,.22);overflow:hidden}
.bt-stage.night .bt-bar{background:rgba(255,255,255,.18)}
.bt-trail{position:absolute;top:0;bottom:0;left:0;width:100%;background:rgba(255,236,160,.95);transition:width .7s ease .45s}
.bt-fill{position:relative;height:100%;width:100%;background:var(--bt-hp-ghost);transition:width .22s ease}
.bt-bar .now{transition:none!important}
.bt-fighter{position:absolute;bottom:var(--bt-stand,12%);height:var(--bt-size,48%);transform-origin:50% 100%;z-index:2}
.bt-fighter.rigged{height:calc(var(--bt-size,48%) / 0.8);bottom:calc(var(--bt-stand,12%) - 1.5%)}
.bt-shadows{position:absolute;inset:0;pointer-events:none;z-index:1}
.bt-shadows div{position:absolute;left:0;top:0;border-radius:50%;transform-origin:50% 50%;opacity:0}
.bt-shadows .body{background:radial-gradient(ellipse at center,rgba(0,0,0,.26),rgba(0,0,0,.1) 50%,transparent 72%)}
.bt-shadows .foot{background:radial-gradient(ellipse at center,rgba(0,0,0,.55),rgba(0,0,0,.22) 48%,transparent 72%)}
.bt-stage.night .bt-shadows .body{background:radial-gradient(ellipse at center,rgba(0,0,0,.34),rgba(0,0,0,.14) 50%,transparent 72%)}
.bt-stage.night .bt-shadows .foot{background:radial-gradient(ellipse at center,rgba(0,0,0,.66),rgba(0,0,0,.28) 48%,transparent 72%)}
.bt-dmg{position:absolute;font-weight:800;font-size:1.05rem;line-height:1;color:#FFFFFF;pointer-events:none;text-shadow:0 0 3px #1A2B6B,0 2px 0 #1A2B6B;font-variant-numeric:tabular-nums;z-index:5}
/* 待机呼吸：只用 scaleY，原点在脚底；不能用 translateY，不然脚会离地 */
.bt-breath{height:100%;transform-origin:50% 100%;animation:bt-breathe 2.6s ease-in-out infinite}
.bt-ghost .bt-breath{animation-delay:-1.3s}
.bt-fighter.still .bt-breath{animation:none}
.bt-face{height:100%}
.bt-ghost .bt-face{transform:scaleX(-1);filter:var(--bt-ghost-filter)}
.bt-sprite{height:100%;width:auto;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
svg.bt-sprite{aspect-ratio:220/300;overflow:visible}
.bt-face.posed{position:relative}
.bt-face.posed img{position:absolute;bottom:0;width:auto;max-width:none;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
.bt-face.posed img[hidden]{display:none}
.bt-rig rect,.bt-rig path,.bt-rig ellipse,.bt-rig circle{stroke:#0E2B31;stroke-width:1.3;stroke-linejoin:round}
@keyframes bt-breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.014)}}
.bt-fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:4}
.bt-slash{fill:none;stroke:#fff;stroke-width:7;stroke-linecap:round;stroke-dasharray:100;filter:drop-shadow(0 0 5px var(--bt-energy))}
.bt-burst{position:absolute;border-radius:50%;background:radial-gradient(circle,#fff 0 18%,var(--bt-energy-glow) 42%,transparent 70%)}
.bt-mote{position:absolute;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--bt-energy);box-shadow:0 0 8px var(--bt-energy)}
.bt-beam{position:absolute;height:14px;margin-top:-7px;transform-origin:0 50%;border-radius:7px;background:linear-gradient(180deg,transparent 0%,var(--bt-energy) 22%,#fff 50%,var(--bt-energy) 78%,transparent 100%);box-shadow:0 0 18px var(--bt-energy-glow)}
.bt-spark{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;background:#FFD45A;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
.bt-shard{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;background:rgba(180,230,255,.95);clip-path:polygon(50% 0,100% 40%,70% 100%,0 70%);box-shadow:0 0 6px rgba(120,200,255,.9)}
.bt-bubble{position:absolute;left:-12%;right:-12%;top:-6%;bottom:-2%;border-radius:50% 50% 46% 46%;border:2px solid rgba(150,215,255,.85);background:radial-gradient(ellipse at 50% 40%,rgba(160,220,255,.08),rgba(120,190,255,.22) 70%,rgba(160,220,255,.35));box-shadow:0 0 14px rgba(120,200,255,.6),inset 0 0 18px rgba(160,220,255,.5);pointer-events:none;transition:opacity .3s}
.bt-beam2{position:absolute;transform-origin:100% 50%;pointer-events:none}
.bt-beam2>div{position:absolute}
.bt-beam2 .b-outer{left:-2%;right:-3%;top:-55%;bottom:-55%;border-radius:50%;background:linear-gradient(180deg,transparent 0%,rgba(52,92,196,.5) 24%,rgba(140,123,217,.55) 50%,rgba(52,92,196,.5) 76%,transparent 100%);filter:url(#bt-wisp) blur(7px)}
.bt-beam2 .b-mid{left:0;right:0;top:6%;bottom:6%;border-radius:50%;background:linear-gradient(270deg,rgba(255,255,255,.97) 0%,rgba(150,224,238,.92) 30%,rgba(120,170,235,.88) 62%,rgba(190,170,238,.85) 100%);-webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 26%,#000 74%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0%,#000 26%,#000 74%,transparent 100%);filter:url(#bt-wisp) blur(3px)}
.bt-beam2 .b-core{left:1%;right:0;top:33%;bottom:33%;border-radius:999px;background:linear-gradient(270deg,#FFFFFF 0%,#F5FCFF 55%,rgba(255,255,255,.8) 100%);box-shadow:0 0 24px rgba(255,255,255,.85),0 0 48px rgba(150,224,238,.6);filter:blur(1.5px)}
.bt-flare{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle,#fff 0 16%,rgba(150,224,238,.9) 34%,rgba(140,123,217,.5) 54%,transparent 70%)}
.bt-marker{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;border:3px solid #FFD45A;box-shadow:0 0 0 2px rgba(0,0,0,.35);pointer-events:none}
.bt-below{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}
.bt-below p{margin:0;min-height:1.4em}
.bt-acts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.bt-acts .btn{padding-left:4px;padding-right:4px}
.bt-sp{margin-top:10px}
.bt-zh{font-size:1.15rem;font-weight:700;margin-top:8px}
.bt-en{font-size:1.05rem;margin-top:6px}
.bt-note{margin-top:6px}
.bt-result{margin-top:10px}
.bt-result.won b{color:var(--purple,#7b4dd6)}
@media (prefers-reduced-motion: reduce){.bt-breath{animation:none}}

/* 往下拉不要刷新页面：正在转写、正在下载模型时，一刷新就前功尽弃 */
html,body{overscroll-behavior-y:contain}
.asr-bar .asr-go{color:#9fd8ff;font-weight:700;margin-left:6px}

/* ---------- 游戏模式 ---------- */
.start-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.start-row .btn{width:100%}
.game-start{background:linear-gradient(135deg,#1B2333,#3B2E66);color:#fff;border-color:transparent}
.g-top{margin:6px 0 10px}
.g-top .bt-stage{aspect-ratio:2/1}
.g-line{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;margin-top:5px;min-height:1.3em;color:var(--ink,#16202E)}
.g-weak{color:var(--muted,#566274)}
.bt-ghost.monster .bt-face{transform:none;filter:none}
.bt-mon{overflow:visible}
.bt-pop{position:absolute;font-weight:800;font-size:.95rem;white-space:nowrap;pointer-events:none;z-index:6;color:#fff;text-shadow:0 0 3px #1A2B6B,0 2px 0 #1A2B6B}
.bt-pop.combo{color:#FFE08A}
.bt-pop.weak{color:#FF9FC2}

.bt-fighter{bottom:calc(var(--bt-stand,12%) - 1.2%)}
.bt-fighter.rigged{bottom:calc(var(--bt-stand,12%) - 2.7%)}
.g-say{font-size:13px;font-weight:700;min-height:1.4em;margin-top:2px;color:var(--ink,#16202E)}
.g-tip{margin-top:8px}
.bt-pop.crit{color:#FFD45A}
.bt-pop.shield{color:#9FE3FF}

/* ---------- 1.22：画面更大、人形小怪、能量、回放、多个角色 ---------- */
.g-top .bt-stage{aspect-ratio:4/3}
.bt-ghost.monster.rigmon .bt-face{transform:scaleX(-1);filter:none}
.bt-hpnum{font-size:.72rem;font-weight:800;color:#16202E;text-shadow:0 1px 0 rgba(255,255,255,.65);margin:-2px 0 2px;font-variant-numeric:tabular-nums;min-height:1em}
.bt-stage.night .bt-hpnum{color:#EEF2FA;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.g-line2{display:flex;align-items:center;justify-content:space-between;gap:8px}
.g-replay{flex:none;font-size:12.5px}
.g-wave{color:var(--muted,#566274);font-size:12px}
.g-energy{display:inline-flex;gap:3px;vertical-align:middle}
.g-energy i{width:9px;height:9px;border-radius:2px;background:rgba(120,130,150,.35);display:inline-block}
.g-energy i.on{background:#FFC83D;box-shadow:0 0 5px rgba(255,200,61,.8)}
.g-sp-banner{margin:0 0 10px;padding:9px 12px;border-radius:12px;background:linear-gradient(135deg,#3B2E66,#1B2333);color:#FFE08A;font-weight:800;font-size:14px}
.bt-chars{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.bt-char{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--line,#e2e2e2);border-radius:12px}
.bt-char.on{border-color:var(--purple,#7b4dd6);box-shadow:0 0 0 1px var(--purple,#7b4dd6) inset}
.bt-char img,.bt-thumb-rig{width:44px;height:44px;object-fit:contain;flex:none;border-radius:8px;background:rgba(127,127,127,.08)}
.bt-thumb-rig{background:radial-gradient(circle at 50% 30%,#1E6F7A 0 18%,transparent 19%),linear-gradient(#1E6F7A,#1E6F7A) 50% 75%/22% 45% no-repeat,rgba(127,127,127,.08)}
.bt-cname{flex:1;font-weight:700;font-size:14px}
.bt-cbtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.bt-cbtns em{font-style:normal;font-size:12px;color:var(--purple,#7b4dd6);font-weight:700}

/* ---------- 1.23：麦克风两种状态、跟读时收起舞台、敌人图鉴 ---------- */
/* 识别：圈一直转 */
.mic.busy::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:3px solid transparent;border-top-color:var(--lamp-on,#7b4dd6);border-right-color:var(--lamp-on,#7b4dd6);animation:mic-spin .9s linear infinite}
@keyframes mic-spin{to{transform:rotate(360deg)}}
.btn.busy{opacity:.75}
@media (prefers-reduced-motion: reduce){.mic.busy::after{animation-duration:2.4s}}
body.g-drill .g-top .bt-stage,body.g-drill .g-top .g-line2{display:none}
body.g-drill .g-top::after{content:"跟读中，对战先收起来";display:block;font-size:12.5px;color:var(--muted,#566274);margin-top:2px}
.bt-gal{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.bt-gal-i{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;font-size:12px}
.bt-gal-i b{font-size:12.5px}
.bt-gal-i span{color:var(--muted,#566274);font-size:11px}
.bt-gal-pic{width:100%;aspect-ratio:1/1;display:flex;align-items:flex-end;justify-content:center;border-radius:10px;background:rgba(127,127,127,.08);overflow:hidden}
.bt-gal-pic svg{height:86%;width:auto;max-width:100%}
.bt-gal-pic.mob svg{transform:scaleX(-1)}
.bt-gal-pic.boss svg{height:94%}

/* ---------- 1.24：每个人按自己的身高画、悬浮、落地、新招式的特效 ---------- */
.bt-fighter{height:calc(var(--bt-size,48%) * var(--kh,1))}
.bt-fighter.rigged{height:calc(var(--bt-size,48%) / 0.8 * var(--kh,1))}
.bt-fighter.hover .bt-breath{animation:bt-hover 2.4s ease-in-out infinite}
.bt-ghost.hover .bt-breath{animation-delay:-1.2s}
.bt-fighter.hover.landed .bt-breath{animation:none}

const pad = n => String(n).padStart(2,"0");

function splitAlts(s){ return String(s||"").split(/\s*\/\/\s*/).map(x=>x.trim()).filter(Boolean); }
function shuffle(a, rnd){ rnd = rnd || Math.random; a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function hash(s){ let h=2166136261>>>0; for (let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619)>>>0; } return h.toString(36); }

/* ---------- 题库 ---------- */
function buildCatalog(C, custom, myAlts){
  const cards = [];
  for (const [id,tag,zh,en,note] of C.R_CARDS){ const a=splitAlts(en); cards.push({id,t:"r",tag,zh,en:a[0],alt:a.slice(1),note}); }
  for (const [id,verb,subj,obj,cue,k,zh,en] of C.T_CARDS){ const a=splitAlts(en); cards.push({id,t:"t",tag:"tense",verb,subj,obj,cue,k,zh,en:a[0],alt:a.slice(1),note:TENSE_NOTE[k]||""}); }
  for (const [id,tag,wrong,en,note] of C.F_CARDS){ const a=splitAlts(en); cards.push({id,t:"f",tag,wrong,en:a[0],alt:a.slice(1),note}); }
  for (const e of C.E_CARDS){
    const steps = e.steps.map(([add,hint,en])=>{ const a=splitAlts(en); return {add,hint,en:a[0],alt:a.slice(1)}; });
    cards.push({id:e.id,t:"e",tag:e.tag,base:e.base,steps,en:steps[steps.length-1].en,alt:steps[steps.length-1].alt,note:"先说“I + 动词”，细节一块一块往后加。"});
  }
  for (const [id,grp,en,zh] of C.L_CARDS) cards.push({id,t:"l",tag:"listen",grp,en,zh});
  for (const c of cards) c.deck = "core";
  for (const [id,tag,zh,en,note] of (C.D_CARDS||[])){ const a=splitAlts(en); cards.push({id,t:"r",tag,zh,en:a[0],alt:a.slice(1),note,deck:"daily"}); }
  for (const [id,grp,en,zh] of (C.DL_CARDS||[])) cards.push({id,t:"l",tag:"listen",grp,en,zh,deck:"daily"});
  for (const c of (custom||[])) cards.push(Object.assign({}, c, {custom:true, deck:c.deck || "我的卡片"}));
  /* 其他正确说法：内置补充 + 你自己点“我的说法也对”加的 */
  const extra = C.ALT_EXTRA || {}; myAlts = myAlts || {};
  for (const c of cards){
    const add = splitAlts(extra[c.id] || "").concat(myAlts[c.id] || []);
    if (!add.length) continue;
    const seen = new Set([c.en].concat(c.alt || []).map(x => tokens(x).join(" ")));
    const fresh = add.filter(x => { const k = tokens(x).join(" "); if (!k || seen.has(k)) return false; seen.add(k); return true; });
    c.alt = (c.alt || []).concat(fresh);
    if (c.t === "e" && c.steps){ const last = c.steps[c.steps.length-1]; last.alt = (last.alt || []).concat(fresh); }
  }
  const byId = {}; for (const c of cards) byId[c.id] = c;
  return {cards, byId};
}

/* ---------- 间隔重复（分盒法） ---------- */
const INTERVALS = [0,1,2,4,7,15,30,60,120];
const MASTERED_BOX = 5;
function srsRate(p, r, tn){
  p = p ? Object.assign({}, p) : {box:0,due:tn,n:0,ok:0,lapses:0};
  if (r === "again"){ p.box = 1; p.due = tn+1; p.lapses = (p.lapses||0)+1; }
  else if (r === "hard"){ p.box = Math.max(1,p.box); p.due = tn + Math.max(1, Math.ceil(INTERVALS[p.box]/2)); }
  else { p.box = p.box===0 ? 2 : Math.min(8, p.box+1); p.due = tn + INTERVALS[p.box]; }
  p.n = (p.n||0)+1; if (r !== "again") p.ok = (p.ok||0)+1; p.last = tn;
  return p;
}

/* 按意群断句（研究：停在从句边界，听的人更好懂；停在从句中间反而更难懂）：

   一个意群里面不断，只有 10 个词以上的长句，才在 because / when / if、新句子开头的 and / but / so 前面断开 */

    /* 逗号后面是新句子（and the team values… / and I fixed…）：前面列举的短项不往后并 */
    const newClause = i => { const w = tgWords(pieces[i]).map(tgBare); if (!/^(and|but|so|or)$/.test(w[0] || "") || w.length < 4) return false;

/* 每句挑一条最相关的发音提示（重音、语调、断句、词尾辅音、难发的音） */

/* 只给提示、不给答案：让你自己改一次（研究里叫 prompt，比直接给正确答案更能促进学习） */
function hintNotes(ops){
  const out = []; let prev = "", prev2 = "";
  for (const o of ops){
    if (o.op === "eq"){ prev2 = prev; prev = o.b; continue; }
    if (o.op === "sub"){
      const k = classifySub(o.a, o.b);
      out.push(k === "past" ? pastRule(o.a, o.b, prev, prev2).hint : k === "s" ? sRule(o.a, o.b, prev, prev2).hint : k === "be" ? `be 动词 ${o.b} 用得不对` :

/* 顽固句分块练：按标点或连接词切成 2–3 块，一块一块加长 */
const BOUND = new Set(["and","but","so","because","that","to","with","at","in","on","for","when","where","during","about","from","by","since","as","after","before"]);
function chunkSentence(en){
  en = String(en || "").trim();
  const parts = en.split(/(?<=[,.;?!])\s+/).filter(Boolean);
  for (let i = 0; i < parts.length - 1; i++){ if (parts[i].split(/\s+/).length < 2){ parts.splice(i, 2, parts[i] + " " + parts[i+1]); i--; } }
  if (parts.length >= 2){ while (parts.length > 3){ const i = parts.length - 2; parts.splice(i, 2, parts[i] + " " + parts[i+1]); } return parts; }
  const w = en.split(/\s+/);
  if (w.length <= 6) return [en];
  const mid = Math.floor(w.length / 2); let best = mid, bd = 99;
  for (let i = 2; i < w.length - 2; i++){ if (BOUND.has(w[i].toLowerCase().replace(/[^a-z']/g, "")) && Math.abs(i - mid) < bd){ bd = Math.abs(i - mid); best = i; } }
  return [w.slice(0, best).join(" "), w.slice(best).join(" ")];
}

/* ---------- 导入码 ---------- */
function parseImport(text){
  const res = {cards:[], answers:[], keys:[], questions:[], follow:[], alts:[], plan:[], meta:{date:"", who:[], replace:[]}, bad:[]};
  const ROLE = {"开场":"first","核心":"core","初筛":"screen","提问":"ask","基本":"core","行为":"core","电话":"screen","技术":"tech","概念":"concept","first":"first","core":"core","screen":"screen","ask":"ask","tech":"tech","concept":"concept"};
  let deck = "我的卡片";
  String(text||"").split(/\r?\n/).forEach((line, i) => {
    const s = line.trim();
    if (!s || s.startsWith("#")) return;
    const p = s.split(/\s*[|｜]\s*/);
    const kind = p[0];
    if ((kind==="题库"||kind==="组"||kind==="DECK") && p[1]){ deck = p[1].slice(0, 40); if (/^(日常生活|daily)$/i.test(deck.trim())) deck = "daily"; else if (/^(通用|通用（诊断报告）|core)$/i.test(deck.trim())) deck = "core"; if (p[2] && /替换|replace/i.test(p[2]) && !res.meta.replace.includes(deck)) res.meta.replace.push(deck); return; }
    if (kind==="面试日期" && /^\d{4}-\d{2}-\d{2}$/.test(p[1]||"")){ res.meta.date = p[1]; return; }
    if (kind==="面试官" && p[1]){ res.meta.who.push({deck, name:p[1], company:p[2]||""}); return; }
    if ((kind==="卡"||kind==="R") && p[1] && p[2]){ const a = splitAlts(p[2]); res.cards.push({t:"r", zh:p[1], en:a[0], alt:a.slice(1), tag:tagKey(p[3]), note:p[4]||"", deck}); }
    else if ((kind==="词"||kind==="W") && p[1] && p[2] && p[3]){ const a = splitAlts(p[3]); res.cards.push({t:"w", word:p[1].trim(), mean:p[2].trim(), en:a[0], alt:a.slice(1), zh:(p[4]||"").trim(), tag:"vocab", note:p[5]||"", deck}); }
    else if ((kind==="改"||kind==="F") && p[1] && p[2]){ const a = splitAlts(p[2]); res.cards.push({t:"f", wrong:p[1], en:a[0], alt:a.slice(1), tag:tagKey(p[3]), note:p[4]||"", deck}); }
    else if ((kind==="听"||kind==="L") && p[1] && p[2]){ res.cards.push({t:"l", grp:"cs", en:p[1], zh:p[2], tag:"listen", deck}); }
    else if ((kind==="问"||kind==="Q") && p[1] && p[2]){
      const id = p[1].toUpperCase().replace(/[^A-Z0-9_-]/g, "");
      if (!id || /^Q\d+$/.test(id)){ res.bad.push(i+1); return; }
      res.questions.push({id, deck, v:splitAlts(p[2]), zh:p[3]||"", sec:Math.max(10, Math.min(180, parseInt(p[4],10) || 60)), role:ROLE[(p[5]||"").trim()] || "core", tip:p.slice(6).join(" | ")});
    }
    else if ((kind==="追问"||kind==="FU") && p[1] && p[2]){ res.follow.push({qid:p[1].toUpperCase(), text:p[2].trim(), ans:p.slice(3).join(" | ").trim()}); }
    else if ((kind==="计划"||kind==="PLAN") && /^(替换|replace)$/i.test(String(p[1] || "").trim())){ res.planReplace = true; }
    else if ((kind==="计划"||kind==="PLAN") && p[1] && p[3]){ if (/^\d{4}-\d{2}-\d{2}$/.test(p[1].trim())) res.plan.push({date:p[1].trim(), cue:(p[2]||"").trim(), text:p[3].trim(), act:(p[4]||"").trim()}); else res.bad.push(line); }
    else if ((kind==="也对"||kind==="OK") && p[1] && p[2]){ res.alts.push({id:p[1].trim(), text:p.slice(2).join(" | ")}); }
    else if ((kind==="答"||kind==="A") && p[1] && p[2]){ res.answers.push({qid:p[1].toUpperCase(), text:p.slice(2).join(" | ")}); }
    else if ((kind==="要点"||kind==="K") && p[1] && p[2]){ res.keys.push({qid:p[1].toUpperCase(), keys:p.slice(2).join("；").split(/[；;、\n]/).map(x=>x.trim()).filter(Boolean)}); }
    else res.bad.push(i+1);
  });
  for (const c of res.cards) c.id = "c" + hash(c.t + "|" + tokens(c.en).join(" "));
  return res;

function checkWriting(text){
  text = String(text||"");
  const issues = [];
  for (const r of W_RULES){
    r.re.lastIndex = 0; let m;
    while ((m = r.re.exec(text))){
      const g = r.g ? m[r.g] : m[0];
      if (g == null) { if (m[0]==="") r.re.lastIndex++; continue; }
      const start = m.index + m[0].indexOf(g);
      issues.push({start, end:start+g.length, text:g, tag:r.tag, msg:r.msg(g)});
      if (m[0]==="") r.re.lastIndex++;
    }
  }
  for (const w of text.matchAll(/[A-Za-z]+/g)){
    const fix = MISSPELL[w[0].toLowerCase()];
    if (fix) issues.push({start:w.index, end:w.index+w[0].length, text:w[0], tag:"拼写", msg:`拼写：${w[0]} → ${fix}`});
  }
  const sentRe = /[^.!?。！？\n]+[.!?。！？]*/g; let s;
  while ((s = sentRe.exec(text))){
    const seg = s[0], off = s.index;
    /* 只看 although / because 后面的 but / so（中文“虽然……但是”“因为……所以”的顺序），前面出现的不算 */
    const al = /\b(although|even though)\b/i.exec(seg) || /^\s*(though)\b/i.exec(seg);
    if (al){
      const at = al.index + al[0].length; const b = /\bbut\b/i.exec(seg.slice(at));
      if (b) issues.push({start:off+at+b.index, end:off+at+b.index+3, text:b[0], tag:"成对词", msg:"although 和 but 只留一个"});
    }
    const bc = /\bbecause\b/i.exec(seg);
    if (bc){
      const at = bc.index + 7; const rest = seg.slice(at);
      const so = /,\s*(so)\b/i.exec(rest) || /\b(so)\s+(?:i|we|you|he|she|they|it|my|the|that|this|there|usually)\b/i.exec(rest);
      if (so){ const st = off + at + so.index + so[0].toLowerCase().indexOf("so"); issues.push({start:st, end:st+2, text:"so", tag:"成对词", msg:"because 和 so 只留一个"}); }
    }
  }
  issues.sort((a,b)=>a.start-b.start || b.end-a.end);
  const seen = new Set(); const out = [];
  for (const it of issues){ const k = it.start+":"+it.msg; if (seen.has(k)) continue; seen.add(k); out.push(it); }
  return out;
}

/* ---------- 日记：讲过去的事有没有用过去式 ---------- */
const STATIVE = new Set(["think","know","want","like","love","need","hope","guess","mean","feel","believe","understand","have","wish","prefer","remember","forget","agree"]);
const BASE_VERBS = new Set(Object.keys(IRR).concat(["play","watch","walk","talk","work","study","try","start","finish","cook","clean","call",
  "visit","apply","practice","use","help","open","stay","wait","ask","look","listen","plan","test","design","learn","decide","enjoy",
  "move","text","chat","check","join","miss","order","pick","prepare","relax","rest","search","send","show","travel","turn","wash",
  "hang","download","upload","post","fix","drive","shop","drop","stop","finish","arrive","return","rain","snow"]));
function checkPast(text){
  text = String(text||""); const out = [];
  const sentRe = /[^.!?。！？\n]+[.!?。！？]*/g; let s;
  while ((s = sentRe.exec(text))){
    const seg = s[0], off = s.index;
    if (/\b(tomorrow|usually|always|often|every\s+(?:day|week|morning|night|weekend)|will|going to|gonna|plan to|sometimes|never|next)\b/i.test(seg)) continue;
    const re = /\b(I|we|he|she|they|it|my\s+(?:friend|friends|dad|mom|roommate|brother|sister))\s+((?:just|also|then|really|finally|first|still|only|even)\s+)?([a-z]+)\b/gi;
    let m;
    while ((m = re.exec(seg))){
      let v = m[3].toLowerCase(); let base = v;
      if (!BASE_VERBS.has(v) && /s$/.test(v)){ const b1=v.replace(/ies$/,"y"), b2=v.replace(/es$/,""), b3=v.replace(/s$/,""); base = [b1,b2,b3].find(x=>BASE_VERBS.has(x)) || v; }
      if (!BASE_VERBS.has(base) || STATIVE.has(base)) continue;
      const st = off + m.index + m[0].length - m[3].length;
      out.push({start:st, end:st+m[3].length, text:m[3], tag:"时态", msg:`讲今天的事用过去式：${m[3]} → ${pastOf(base)}（说的是习惯或现在就忽略）`});
    }
  }
  return out;
}

/* ---------- 打卡、统计 ---------- */
function dayDone(days, d){ const x = days[d]; return !!x && ((x.sec||0) >= 60 || (x.cards||0) >= 3); }
function computeStreak(days, todayS){
  const n = dnum(todayS); const todayDone = dayDone(days, todayS);
  let cur = todayDone ? n : n-1, streak = 0, lastFreeze = null; const freezes = [];
  for (let guard=0; guard<3000; guard++){
    const ds = nstr(cur);
    if (dayDone(days, ds)) { streak++; cur--; continue; }
    if (dayDone(days, nstr(cur-1)) && (lastFreeze===null || lastFreeze-cur >= 7)) { freezes.push(ds); lastFreeze = cur; cur--; continue; }
    break;
  }
  return {streak, freezes, todayDone};
}
function tagAgg(tags, todayS, fromBack, toBack){
  const n = dnum(todayS), agg = {};
  for (const [d, m] of Object.entries(tags||{})){
    const back = n - dnum(d);
    if (back >= fromBack && back < toBack) for (const [t,v] of Object.entries(m)){ agg[t] = agg[t] || [0,0]; agg[t][0]+=v[0]; agg[t][1]+=v[1]; }
  }
  return agg;
}

      if (!Rec.loudAt && now - t0 > 8000) return res();             /* 8 秒都没出声 */

没有错误时 issues 为空数组。issues 最多 8 个，按重要程度排序。`;
  },
  async review(kind, text, extra, out){
    if (!this.fn || this.off){ toast("这个版本用不了 AI 批改，可以复制给 Claude"); return; }
    text = String(text||"").trim();
    if (text.length < 8){ toast("先写几句英文"); return; }
    if (this.ctl) try { this.ctl.abort(); } catch (e) {}
    const ctl = this.ctl = new AbortController();
    out.innerHTML = `<div class="panel ai-out"><p class="muted">Claude 正在看，通常 10–40 秒……</p><button class="btn sm" data-act="ai-stop">停止</button></div>`;
    try {
      const res = await this.fn.json(this.prompt(kind, text, extra), {modelTier:"default", signal:ctl.signal});
      if (!out.isConnected) return;
      out.innerHTML = renderAI(text, res);
    } catch (e) {
      if (!out.isConnected) return;
      const code = e && e.code;
      if (code === "cancelled"){ out.innerHTML = ""; return; }
      if (["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(code)){
        this.off = true; document.documentElement.classList.remove("has-ai");
        out.innerHTML = `<div class="panel small">AI 批改没有开启。可以点“复制给 Claude”，粘贴到和 Claude 的对话里。</div>`; return;
      }
      const msg = code === "rate_limited" ? "用得太频繁了，过一会儿再试" : code === "invalid_json" ? "这次结果没读出来，再点一次试试" : "这次没成功，检查网络后再试";
      out.innerHTML = `<div class="panel small">${msg}</div>`;
    } finally { if (this.ctl === ctl) this.ctl = null; }
  },
  stop(){ if (this.ctl) try { this.ctl.abort(); } catch (e) {} }
};
function renderAI(text, res){
  const issues = Array.isArray(res && res.issues) ? res.issues.slice(0, 8) : [];
  const marks = [];
  const low = text.toLowerCase();
  issues.forEach((it, i) => { const q = String(it.quote||"").trim(); if (!q) return; const at = low.indexOf(q.toLowerCase()); if (at >= 0) marks.push({start:at, end:at+q.length, n:i+1}); });
  let html = "";
  if (issues.length){
    html += `<div class="marked">${markText(text, marks)}</div><ol class="issues">${issues.map(it => `<li><b>${esc(it.type||"")}</b>　${esc(it.hint||"")}</li>`).join("")}</ol>`;
  } else html += `<p class="verdict exact">没发现明显的错误</p>`;
  if (res && res.good) html += `<p class="note">做得好：${esc(res.good)}</p>`;
  if (res && res.tip) html += `<p class="note">下次注意：${esc(res.tip)}</p>`;
  if (res && res.better) html += `<details style="margin-top:10px"><summary>自己改完再看：参考改法</summary><div class="better">${esc(res.better)}</div></details>`;
  return `<div class="panel ai-out">${html}</div>`;
}
function markText(text, marks){
  marks = marks.slice().sort((a,b) => a.start - b.start);
  let out = "", pos = 0;
  for (const m of marks){ if (m.start < pos) continue; out += esc(text.slice(pos, m.start)) + `<mark>${esc(text.slice(m.start, m.end))}<sup>${m.n}</sup></mark>`; pos = m.end; }
  return out + esc(text.slice(pos));
}

"use strict";

const UI = {
  stack: [],
  root: null,
  top(){ return this.stack[this.stack.length-1]; },
  leave(){
    const e = this.top(); const v = e && VIEWS[e.name];
    if (v && v.leave) try { v.leave(e.params); } catch (err) { console.warn(err); }
    TTS.cancel(); SR.abort(); Rec.cancel(); Wake.off(); Act.stop(); AI.stop(); Player.stop();
  },
  render(){
    const e = this.top(); const v = VIEWS[e.name] || VIEWS.home;
    document.body.classList.toggle("full", !!v.full);
    this.root.innerHTML = v.render(e.params || {});
    $$(".tabbar button").forEach(b => b.setAttribute("aria-current", b.dataset.v === v.tab ? "page" : "false"));
    window.scrollTo(0, 0);
    if (v.mount) try { v.mount(e.params || {}); } catch (err) { console.error(err); }
  },
  refresh(){ const e = this.top(); const v = e && VIEWS[e.name]; if (v && !v.noRefresh) this.render(); },
  histLen: 1, ignoreUntil: 0,
  syncHist(){
    const want = this.stack.length;
    try {
      if (want > this.histLen){ for (let i = this.histLen; i < want; i++) history.pushState({d:i+1}, ""); }
      else if (want < this.histLen){ this.ignoreUntil = Date.now() + 800; history.go(want - this.histLen); }
    } catch (e) {}
    this.histLen = want;
  },
  nav(name, params){ this.leave(); this.stack.push({name, params:params||{}}); this.syncHist(); this.render(); },
  replace(name, params){ this.leave(); this.stack[this.stack.length-1] = {name, params:params||{}}; this.render(); },
  tab(name){
    this.leave();
    this.stack = name === "home" ? [{name:"home", params:{}}] : [{name:"home", params:{}}, {name, params:{}}];
    this.syncHist(); this.render();
  },
  back(){ if (this.stack.length > 1) history.back(); else this.tab("home"); },
  onPop(){
    if (this.ignoreUntil && Date.now() < this.ignoreUntil){ this.ignoreUntil = 0; return; }
    if (this.stack.length > 1){ this.leave(); this.stack.pop(); this.histLen = Math.max(1, this.histLen - 1); this.render(); }
  }
};

  for (const i of all){ if (i.start < pos) continue; html += esc(said.slice(pos, i.start)) + `<mark class="${GRAM_OPT.has(i.tag) ? "opt" : "must"}">${esc(said.slice(i.start, i.end))}</mark>`; pos = i.end; }

  const s = RUN.stage; if (!(s instanceof CardStage)) return;
  if (s.drillLive){ if (Date.now() - s.drillT > 600) stopAny(); return; }
  s.drillLive = true; s.drillT = Date.now();
  const heard = $("#heard"); el.classList.add("live"); if (heard) heard.textContent = "在听……说完再点一下，或者停一下就好";
  const r = await listenAny({heard, btn:el, onInterim: t => { if (heard && heard.isConnected) heard.textContent = t; }});

  if (!r.text){ if (heard) heard.textContent = r.error ? srErrorText(r.error) : "没听清，再来"; return; }
  const steps = s.drillSteps(); const cur = steps[Math.min(s.drill, steps.length - 1)];

   模拟面试的复盘打分和单题彩排的打分都算。依据：分开几次各想起来一次，比一次连说几遍记得牢（successive relearning）。 */

    for (const e of ((S.soloRate || {})[q.id] || [])) ev.push(e);

function scTop(days){
  const since = Date.now() - days * 864e5, cnt = {};
  for (const c of (S.calls || [])) if (c.ts >= since && c.issues) for (const ks of Object.values(c.issues)) for (const k of ks) cnt[k] = (cnt[k] || 0) + 1;
  for (const v of Object.values(S.soloIssues || {})) if (v.ts >= since) for (const k of v.k) cnt[k] = (cnt[k] || 0) + 1;
  return Object.entries(cnt).sort((a, b) => b[1] - a[1]);

const HF = {st:null};
/* 耳机模式听哪些：跟首页题库一样 / 今天练过的 / 学过的单词 / 某一个题库 */
function hfSources(){
  const out = [["deck", "跟首页选的题库一样"], ["today", "今天练过的（没说出来的先放）"]];
  if (CAT.cards.some(c => c.t === "w" && S.cards[c.id])) out.push(["w", "只听学过的单词"]);
  for (const d of deckList()) if (d.id !== "all") out.push(["d:" + d.id, "只听：" + d.label]);
  return out;
}
function handsList(src){
  src = src || L.hfSrc || "deck";
  if (!hfSources().some(x => x[0] === src)) src = "deck";
  const ok = c => (c.t === "r" || c.t === "t" || c.t === "w") && c.zh && c.en;
  if (src === "today"){
    const h = (S.hist || {})[today()] || []; const rank = {again:2, hard:1, good:0}; const worst = {};
    for (const e of h) if (!worst[e.id] || rank[e.r] > rank[worst[e.id]]) worst[e.id] = e.r;
    return Object.keys(worst).map(id => CAT.byId[id]).filter(c => c && ok(c)).sort((a, b) => rank[worst[b.id]] - rank[worst[a.id]]).slice(0, 40);
  }
  const tn = dnum(today());
  const dp = src === "w" ? (c => c.t === "w" && !!S.cards[c.id]) : src.startsWith("d:") ? deckPred(src.slice(2)) : deckPred(curDeck());
  const pool = CAT.cards.filter(c => ok(c) && dp(c));
  const p = c => S.cards[c.id];
  /* 优先放该复习的；其余按“耳机里多久没听过”排，不会每次都是同一批 */
  const seenAt = c => ((L.hfSeen || {})[c.id] || 0);
  const due = pool.filter(c => p(c) && p(c).due <= tn).sort((a, b) => p(a).due - p(b).due || seenAt(a) - seenAt(b));
  const learning = pool.filter(c => p(c) && p(c).due > tn && p(c).box < K.MASTERED_BOX).sort((a, b) => seenAt(a) - seenAt(b) || p(a).due - p(b).due);
  let fresh = pool.filter(c => !p(c) && c.t !== "w").sort((a, b) => seenAt(a) - seenAt(b));
  if (interviewMode() === "interview") fresh = fresh.filter(c => ["interview","rescue"].includes(c.tag)).concat(fresh.filter(c => !["interview","rescue"].includes(c.tag)));
  const out = [], seen = new Set();
  for (const c of [...due, ...learning, ...K.diversify(fresh)]){ if (out.length >= 40) break; if (!seen.has(c.id)){ seen.add(c.id); out.push(c); } }
  return out;
}

const SH = {
  on:false, tok:0,
  async start(text){
    const sents = (text.match(/[^.!?]+[.!?]*/g) || []).map(x => x.trim()).filter(x => x.split(/\s+/).length >= 2);
    if (!sents.length){ toast("回答太短了，先多写几句"); return; }
    this.on = true; const tok = ++this.tok; Wake.on(); Act.start(true);
    const b = $('[data-act="ive-shadow"]'); if (b) b.textContent = "停止跟读";
    const box = $("#shadowBox"); if (box) box.classList.remove("hide");
    for (let i = 0; i < sents.length; i++){
      if (!this.on || tok !== this.tok) return;
      if (box && box.isConnected) box.innerHTML = `<div class="small muted">${i+1}/${sents.length}　先听，再跟着说一遍</div><div class="en sm" style="margin-top:4px">${esc(sents[i])}</div>`;
      await TTS.speak(sents[i], {rate:0.92});
      if (!this.on || tok !== this.tok) return;

    if (tok === this.tok){ this.stop(); const bx = $("#shadowBox"); if (bx){ bx.classList.remove("hide"); bx.innerHTML = `<p class="small">跟读完了。再来一遍会更顺；顺了就去“单题彩排”，不看稿说一遍。</p>`; } }
  },
  stop(){ const was = this.on; this.on = false; this.tok++; if (was){ TTS.cancel(); Wake.off(); Act.stop(); } const b = $('[data-act="ive-shadow"]'); if (b) b.textContent = "跟读我的回答"; const box = $("#shadowBox"); if (box) box.classList.add("hide"); }
};

  if (finished){ $$(".rd-s").forEach(e => e.classList.remove("cur")); const st = $("#rdStatus"); if (st) st.textContent = L.rdMode === "flow" ? "跟完了。顺了就去“单题彩排”，不看稿用自己的话说一遍。" : "跟完了。熟了就换“连贯跟读”，跟着节奏和连读一起说。"; }
}
async function rdPlay(from){
  if (!TTS.ok){ toast("这台设备不能朗读"); return; }
  const tok = ++RD.tok; RD.on = true; Wake.on(); Act.start(true); rdUI();
  for (let i = from || 0; i < RD.sents.length; i++){
    if (tok !== RD.tok) return; RD.i = i; rdMark(i, "say");
    await TTS.speak(RD.sents[i], {rate: L.rdSlow ? 0.75 : 0.95});
    if (tok !== RD.tok) return;
    if ((L.rdMode || "line") === "line"){ rdMark(i, "you"); const w = RD.sents[i].split(/\s+/).length; await sleep(Math.max(1800, w * (L.rdSlow ? 620 : 500) + 700)); }

}
function rdStop(){ const was = RD.on; RD.on = false; RD.tok++; TTS.cancel(); if (was){ Wake.off(); Act.stop(); } rdUI(); }

VIEWS.progress = {
  tab:"progress",
  render(){
    const st = K.computeStreak(S.days, today()); const tn = dnum(today());
    let mastered = 0, learning = 0, fresh = 0;
    for (const c of CAT.cards){ const p = S.cards[c.id]; if (!p) fresh++; else if (p.box >= K.MASTERED_BOX) mastered++; else learning++; }
    const totalMin = Math.round(Object.values(S.days).reduce((a, d) => a + (d.sec || 0), 0) / 60);
    const fz = new Set(st.freezes); const dow = new Date().getDay(); const first = tn - dow - 77;
    let heat = "";
    for (let d = first; d <= tn; d++){ const ds = nstr(d); const x = S.days[ds]; const sec = x ? x.sec || 0 : 0; const done = K.dayDone(S.days, ds);
      const lv = !done ? "" : sec >= 600 ? "l3" : sec >= 180 ? "l2" : "l1"; heat += `<i class="${lv} ${fz.has(ds) ? "fz" : ""} ${d === tn ? "today" : ""}" title="${ds}"></i>`; }
    const wk = []; for (let d = tn - 6; d <= tn; d++){ const x = S.days[nstr(d)]; wk.push({d, m: x ? (x.sec || 0) / 60 : 0}); }
    const mx = Math.max(10, ...wk.map(w => w.m)); const WD = "日一二三四五六";
    const week = wk.map(w => `<div><i style="height:${Math.round(w.m / mx * 70) + 2}px"></i>${WD[new Date(w.d * 86400000).getUTCDay()]}</div>`).join("");
    const recent = K.tagAgg(S.tags, today(), 0, 7), earlier = K.tagAgg(S.tags, today(), 7, 35);
    const rows = Object.entries(recent).filter(([t, v]) => v[0] >= 3).map(([t, v]) => ({t, acc:v[1]/v[0], n:v[0], e: earlier[t] && earlier[t][0] >= 5 ? earlier[t][1]/earlier[t][0] : null})).sort((a, b) => a.acc - b.acc);
    const bars = rows.length ? rows.map(r => { const d = r.e == null ? "" : Math.round((r.acc - r.e) * 100); const tr = d === "" ? "" : d > 0 ? `<span class="up">+${d}</span>` : d < 0 ? `<span class="down">${d}</span>` : "";
      return `<div class="bar"><span class="small">${esc((TAGS[r.t]||TAGS.other).label)}</span><div class="t"><i style="width:${Math.round(r.acc*100)}%"></i></div><span class="v">${Math.round(r.acc*100)}% ${tr}</span></div>`; }).join("") : `<p class="small muted">练几天以后，这里会显示每类错误的正确率和变化。</p>`;
    const avgMs = (a, b) => { let s = 0, n = 0; for (let d = tn - b + 1; d <= tn - a; d++){ const x = S.days[nstr(d)]; if (x && x.mn){ s += x.ms; n += x.mn; } } return n ? s / n : 0; };
    const thisW = avgMs(0, 7), lastW = avgMs(7, 14);
    const nW = allQuestions().filter(written).length; const calls = S.calls.length;
    const hardN = CAT.cards.filter(c => S.cards[c.id] && (S.cards[c.id].lapses||0) >= 2).length;
    const reps = calls ? (S.calls.reduce((a, c) => a + (c.rep || 0), 0) / calls).toFixed(1) : null;
    return `<div class="wrap"><div class="top"><h2 style="font-size:26px">进度</h2></div>
      <div class="statgrid"><div class="stat"><span class="num">${st.streak}</span><span>连续天数</span></div><div class="stat"><span class="num">${mastered}</span><span>已掌握</span></div><div class="stat"><span class="num">${totalMin}</span><span>总分钟</span></div></div>
      <button class="btn block" style="margin-bottom:12px" data-act="nav" data-v="today">今天练过的句子</button>
      <div class="panel"><h3>开口用时</h3>${thisW ? `<p style="margin-top:6px"><span class="num" style="font-size:30px">${fmt1(thisW)}</span> 秒，这 7 天平均${lastW ? `，前 7 天是 ${fmt1(lastW)} 秒` : ""}</p><p class="small muted">从灯灭到说完一句的时间。越短，说明越接近脱口而出。</p>` : `<p class="small muted" style="margin-top:6px">用麦克风或输入框答几题，这里就会显示你开口有多快。</p>`}</div>
      <div class="panel"><h3>最近 12 周</h3><div class="heat" style="margin-top:10px">${heat}</div><p class="small muted" style="margin-top:6px">颜色越深练得越久；虚线框是自动补签的日子（每周 1 次）。</p></div>
      <div class="panel"><h3>最近 7 天（分钟）</h3><div class="week" style="margin-top:10px">${week}</div></div>
      <div class="panel"><h3>每类正确率</h3><p class="small muted">最近 7 天，后面的数字是和更早相比的变化</p><div class="bars" style="margin-top:6px">${bars}</div></div>
      <div class="panel"><h3>题库</h3><p style="margin-top:6px">已掌握 ${mastered}，学习中 ${learning}，还没练 ${fresh}</p><p class="small muted">连续答对、间隔拉到 15 天以上算已掌握。</p>
        ${hardN ? `<p style="margin-top:10px">顽固错误 ${hardN} 句：错过 2 次以上</p><button class="btn sm" style="margin-top:6px" data-act="free-go" data-v="hard">专门练这些</button>` : ""}</div>
      <div class="panel"><h3>面试</h3><p style="margin-top:6px">写好回答 ${nW}/${allQuestions().length}，来电模拟 ${calls} 次${reps != null ? `，平均每通让对方重复 ${reps} 次` : ""}</p></div></div>`;
  }
};

ACT["imp-apply"] = () => {
  const r = IMP; if (!r) return;
  for (const d of (r.meta.replace || [])){
    const keepC = new Set(r.cards.filter(c => c.deck === d).map(c => c.id)), keepQ = new Set(r.questions.filter(q => q.deck === d).map(q => q.id));
    for (const c of S.custom) if (c.deck === d && !keepC.has(c.id)){ delete S.cards[c.id]; delete S.best[c.id]; }
    S.custom = S.custom.filter(c => c.deck !== d || keepC.has(c.id));
    S.customQ = (S.customQ || []).filter(q => q.deck !== d || keepQ.has(q.id));
  }
  for (const c of r.cards){ const i = S.custom.findIndex(x => x.id === c.id); const clean = {id:c.id, t:c.t, tag:c.tag, en:c.en, alt:c.alt || [], note:c.note || "", zh:c.zh || "", wrong:c.wrong || "", grp:c.grp || "", word:c.word || "", mean:c.mean || "", deck:c.deck || "我的卡片"}; if (i >= 0) S.custom[i] = clean; else S.custom.push(clean); }
  S.customQ = S.customQ || [];
  for (const q of r.questions){ const i = S.customQ.findIndex(x => x.id === q.id); const clean = {id:q.id, deck:q.deck, grp:"custom", role:q.role, v:q.v, zh:q.zh, sec:q.sec, tip:q.tip, tpl:"", follow: i >= 0 ? (S.customQ[i].follow || []) : []}; if (i >= 0) S.customQ[i] = clean; else S.customQ.push(clean); }
  rebuildQ();
  S.followAns = S.followAns || {};
  for (const f of r.follow){ const q = S.customQ.find(x => x.id === f.qid); if (q && !q.follow.includes(f.text)) q.follow.push(f.text); if (f.ans) S.followAns[f.qid + "|" + f.text] = f.ans; }
  S.refAns = S.refAns || {};
  for (const a of r.answers){ const prev = (S.refAns[a.qid] || "").trim(); S.refAns[a.qid] = a.text; const x = ans(a.qid); const mine = (x.text || "").trim();
    if (!mine || mine === prev || x.fromRef){ x.text = a.text; x.fromRef = true; x.updated = Date.now(); } }
  for (const k of r.keys){ const x = ans(k.qid); x.keys = k.keys; }
  S.plan = S.plan || []; if (r.planReplace) S.plan = S.plan.filter(x => x.done);
  for (const x of r.plan){ if (!S.plan.some(y => y.date === x.date && y.text === x.text)) S.plan.push({id:"p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), date:x.date, cue:x.cue, text:x.text, act:x.act, done:false, ts:Date.now()}); }
  if ((S.wantWords || []).length){
    /* 导入的单词卡和“要学的词”对上了（一样，或者一个是另一个的一部分，比如 stepped 和 stepped boss），就从列表里去掉 */
    const tk = x => String(x).toLowerCase().split(/\s+/).filter(Boolean);
    const have = r.cards.filter(c => c.t === "w" && c.word).map(c => tk(c.word));
    S.wantWords = S.wantWords.filter(x => { const a = tk(x.w); return !have.some(b => a.every(t => b.includes(t)) || b.every(t => a.includes(t))); });
  }
  S.myAlts = S.myAlts || {}; for (const a of r.alts){ S.myAlts[a.id] = Array.from(new Set([...(S.myAlts[a.id] || []), a.text])).slice(-6); }
  if (r.alts.length && S.pending && S.pending.length){ const ok = new Set(r.alts.map(a => a.id + "|" + K.tokens(a.text).join(" "))); S.pending = S.pending.filter(p => !ok.has(p.cid + "|" + K.tokens(p.said).join(" "))); }
  if (r.meta.date){ S.interviews = S.interviews || []; if (!S.interviews.some(x => x.date === r.meta.date)){ const dk = (r.questions[0] || r.cards[0] || {}).deck || ""; const nm = dk && dk !== "core" && dk !== "daily" ? (/面试/.test(dk) ? dk : dk + " 面试") : "面试"; S.interviews.push({id:"i" + Date.now().toString(36), name:nm, date:r.meta.date, time:"", deck: dk && dk !== "core" && dk !== "daily" ? "u:" + dk : ""}); } syncInterviewDate(); }
  S.deckMeta = S.deckMeta || {}; for (const w of r.meta.who) S.deckMeta[w.deck] = {name:w.name, company:w.company};
  if (r.questions.length) S.settings.callDeck = "u:" + r.questions[0].deck;
  rebuildCatalog(); save(true); IMP = null;
  const dk = Array.from(new Set(r.cards.map(c => c.deck).concat(r.questions.map(q => q.deck))))[0];
  toast(`导入好了：卡片 ${r.cards.length}，面试题 ${r.questions.length}` + (dk ? `。首页可以选“${dk}”单独练` : "")); UI.back();
};

ACT["deck-merge"] = async el => {
  const name = el.dataset.v; const hasQ = (S.customQ || []).some(q => q.deck === name);
  const targets = deckList().filter(d => d.id !== "all" && d.id !== "u:" + name && !(hasQ && (d.id === "daily" || d.id === "core")));
  if (!targets.length){ toast("没有可以并进去的题库"); return; }
  const t = await choose(`把“${name}”并到哪个题库？`, (hasQ ? "这个题库里有面试题，只能并到另一个导入的题库。" : "") + "卡片的复习记录都会保留。", targets.map(d => [d.id, d.label]).concat([["", "取消"]]));
  if (!t) return;
  const to = t === "daily" ? "daily" : t === "core" ? "core" : t.slice(2); const label = (targets.find(d => d.id === t) || {}).label || to;
  for (const c of S.custom) if ((c.deck || "我的卡片") === name) c.deck = to;
  for (const q of (S.customQ || [])) if (q.deck === name) q.deck = to;
  if (S.deckMeta && S.deckMeta[name]){ if (to !== "daily" && to !== "core" && !S.deckMeta[to]) S.deckMeta[to] = S.deckMeta[name]; delete S.deckMeta[name]; }
  if (S.settings.deck === "u:" + name) S.settings.deck = t;
  if (Array.isArray(S.settings.decks)) setDecks(S.settings.decks.map(d => (d === "u:" + name ? t : d)));
  if (S.settings.callDeck === "u:" + name) S.settings.callDeck = to === "daily" || to === "core" ? "core" : t;

ACT["deck-del"] = async el => {

  if (!await sheet(`删掉 ${old.length} 条旧录音？`, "日记文字会保留，只删录音。", "删掉", true)) return;
  for (const e of old){ await IDB.del(e.rec); e.rec = null; }
  save(true); toast("删好了"); UI.render();
};
/* 启动后清理：已经没有日记或面试题对应的录音（以前删日记、删题库时留下的） */
async function cleanAudio(){
  try {
    const keys = await IDB.keys(); const jr = new Set(S.journal.map(e => e.rec).filter(Boolean));
    const qids = new Set(Object.keys(typeof QBY === "object" && QBY ? QBY : {}));
    for (const k of keys){
      if (k.startsWith("jr:") && !jr.has(k)) await IDB.del(k);
      else if (k.startsWith("iv:") && qids.size > 20 && !qids.has(k.slice(3))) await IDB.del(k);
    }
  } catch (e) {}
}

/* ---------- 语法要点：说的时候来不及想，先记住“先问什么”的顺序 ---------- */
const GRAMMAR = [
  {h:"be 动词：什么时候要 is / are / was / were", p:"① 后面是形容词、名词或地点，句子里没有别的动词 → 要 be：It's light.／It's a new phone.／I'm at home.　② 正在做 → be + -ing：My phone was freezing.　③ 被做 → be + 过去分词：The report was printed this morning.　④ 句子里已经有动作动词了（kept、fixed、helped）→ 不要再加 be：My phone kept freezing.，不说 My phone is kept freezing…　另外，主语是复数用 are / were，单数用 is / was。", ex:["The new laptop is light.", "My phone kept freezing.", "My phone was freezing.", "The report was printed this morning."]},
  {h:"两个动词连在一起：help fix、keep ringing", p:"有些动词后面能直接接另一个动词，就像中文的“帮忙调试”。help + 动词原形：I helped fix the website.（help to fix 也对，美国人更常省掉 to）。keep + -ing，意思是“一直……”：kept ringing。want、need、try + to + 动词：I want to learn.　let、make + 人 + 动词原形：Let me think.　讲过去的事，只把第一个动词变成过去式：helped fix、kept ringing。", ex:["I helped fix the website.", "I helped plan the party.", "My phone kept ringing.", "Let me think for a second."]},
  {h:"时态：先问自己“什么时候？”", p:"平时、习惯 → 一般现在时：I play.　已经结束的某一次 → 过去式：I played.　从过去到现在、已经、到现在为止 → 现在完成时：I've played.　此刻正在 → I'm playing.　最近一直在 → I've been playing.　打算好的将来 → I'm going to play.", ex:["I usually go to the gym on Saturdays.", "I went to the gym last Saturday.", "I've played the piano since fourth grade.", "I've been practicing a lot lately."]},
  {h:"-s：什么时候加", p:"① 主语是 he / she / it、一个人或一样东西，而且是一般现在时 → 动词加 -s。② 两个以上的东西 → 名词加 -s。③ I / you / we / they 后面，动词永远不加 -s。④ a / one / every / each 后面用单数。", ex:["My friend plays basketball every week.", "I like all kinds of games.", "They work in the lab.", "I go there every day."]},
  {h:"-ed：过去的事", p:"已经结束的事，动词用过去式：大多数加 -ed（played、tested）；常用的不规则动词要单独记：go → went，take → took，get → got，come → came，buy → bought，do → did，make → made，see → saw。have / has 后面用过去分词：I've played、I've gone。", ex:["I tested the prototype yesterday.", "My dad took me to the park.", "I've already finished it."]},
  {h:"be 动词：形容词、名词、地点前面要有", p:"中文说“天气很冷”“我在家”不用“是”，英语要有 is / am / are / was：It's cold.　I'm tired.　I'm at home.　开口先说 It's 或 I'm，后面基本就对了。", ex:["It's really cold today.", "I'm a little nervous.", "I was at home all day."]},
  {h:"语序：先说“谁 + 做什么”", p:"中文常把时间、地点放前面；英语先说“谁 + 做什么 + 什么”，再往后加和谁、在哪、什么时候。时间也可以放句首，但地点一般放在动词后面。练法就是扩句：先说最短的一句，再一块一块往后加。", ex:["I played basketball with my friend at the park yesterday.", "Yesterday, I played basketball with my friend."]},
  {h:"because 和 so、although 和 but：二选一", p:"中文说“因为……所以……”“虽然……但是……”，英语只用其中一个。口语里最简单：因果只用 so，转折只用 but。", ex:["I'm job hunting, so I stay home a lot.", "I watch soccer, but I don't follow it closely."]}
];

}
async function eneDel(id){ await IDB.del("battle:enemy:" + id); ENE_LIST = ENE_LIST.filter(e => e.id !== id); await eneSave(); }
/* 谁能在哪种大小的局里出现：导入的敌人看它的 size（both 默认 / normal / giant）；
   角色（来切磋的）看它自己的设置：没开“能巨大化”只在普通大小，选了“只在巨大化”只在巨人的局；默认敌人里人形小兵只在普通大小、镇岳像只在巨大化 */
const sizeOk = (size, giant) => (size === "normal" ? !giant : size === "giant" ? giant : true);
const charSizeOk = (rec, giant) => (giant ? !!rec.giantM && rec.sizeMode !== "normal" : !(rec.giantM && rec.sizeMode === "giant"));
const CODE_SIZE = {colossus:"giant"};
/* 一局开始前，把导入的敌人和来切磋的角色读好（图片读取要时间；没读好的那一刻先用原来的敌人） */
async function eneLoadAll(){

/* 做成一个对手：图片姿势、身高、招式；血量按档位 */
function imgEnemy(x, tier, giant, rival){

/* ---------- 练习时记下每张卡的客观表现（第一次说得怎么样、重练说得怎么样、用时） ---------- */
function batRecord(stage){
  if (!RUN || !Array.isArray(RUN.battle) || !stage || !stage.card) return;
  const c = stage.card; const first = stage.firstCmp || stage.cmp;
  const lv2 = stage.firstCmp && stage.cmp && stage.cmp !== stage.firstCmp ? stage.cmp.level : null;
  const spoke = !!String(stage.firstSaid || stage.said || "").trim();
  const it = RUN.items && RUN.items[RUN.i];
  /* 卡片判成“意思对上了”（换了个说法）的，游戏也按意思对算，不当成擦伤 */
  const retried = !!(stage.firstCmp && stage.cmp && stage.cmp !== stage.firstCmp);
  const meanFirst = stage.firstMean != null ? stage.firstMean : (!retried && stage.mean);
  const lvOf = (cmp, meant) => !cmp ? "off" : cmp.exact ? "exact" : meant ? "meaning" : cmp.level;
  const e = {id:c.id, zh:c.zh, en:c.en, alt:c.alt || [], lv1: lvOf(first, meanFirst), lv2: retried ? lvOf(stage.cmp, stage.mean) : lv2, ms: stage.ms || 0, tag:c.tag, spoke, sound: !!(first && first.sound), special: !!(it && it.special)};
  if (stage.misrec && batMisOk()){ e.mis = true; RUN.batMis = (RUN.batMis || 0) + 1; }
  stage.batEntry = e; RUN.battle.push(e);
  if (RUN.game && GAME.st) GAME.onCard(e);
}
/* 暴击的时间（从卡片出来到识别确认你说完），分三段：
   看到提示、想好怎么说 1.8 秒（从中文提示到开口说英语，学习者一般要一两秒）
   + 说出来：每个词 0.45 秒（约每分钟 130 个词，中高级学习者流利时的语速）
   + 识别确认说完了 1 秒（说完以后要等一小段安静）。十个词的句子 7.3 秒，五个词约 5 秒 */
const CRIT_REACT = 1800, CRIT_PER_WORD = 450, CRIT_END = 1000;
function critMs(e){ const n = String(e.en || "").split(/\s+/).filter(Boolean).length; return CRIT_REACT + CRIT_PER_WORD * n + CRIT_END; }
/* 对手反击的伤害：档位底数 × 招式加成（轻击 ×1、重击 ×1.3、技能 ×1.6），四舍五入
   小兵 6 / 8 / 10，小怪 7 / 9 / 11，强化兵 8 / 10 / 13，精英和劲敌 10 / 13 / 16，首领 重击 18、技能 22 */
const COUNTER_BASE = {grunt:6, minor:7, trooper:8, elite:10, boss:14};
const COUNTER_MULT = {light:1, heavy:1.3, skill:1.6};
function counterTier(e){ return e.boss ? "boss" : e.rival ? "elite" : (COUNTER_BASE[e.tier] ? e.tier : "minor"); }
function counterDmg(e, kind){ return Math.round(COUNTER_BASE[counterTier(e)] * (COUNTER_MULT[kind] || 1)); }
/* 舞台上写的名字：正在用的角色的名字（原创小人就写“你”） */
function youName(){ const c = BAT_CHAR && BAT_LIST.find(x => x.id === L.batActive); return c ? c.name : "你"; }
/* “识别错了”：不限次数（识别不准不是用户能控制的）；一轮里点得多，结算时提醒去换识别 */
function batMisOk(){ return true; }
/* 显示答案以后才点“识别错了”：按基本对补上这一击 */
function batMisrec(stage){
  const e = stage && stage.batEntry; if (!e || e.mis) return;
  const before = K.battlePlan([e]); e.mis = true; RUN.batMis = (RUN.batMis || 0) + 1; const after = K.battlePlan([e]);
  if (RUN.game && GAME.st) GAME.onFix(e, after.card - before.card, before.shields > before.broke);
}

/* ---------- 游戏模式：每张卡就是一回合，说完马上出招（不到 1 秒），不影响练习本身 ----------
   依据：把学习内容直接做成游戏玩法（说话就是出招），比“练完再玩”更吸引人、学得更多（Habgood & Ainsworth 2011）。
   规则还是只看客观表现；连击只奖励“连续第一次就说对”，弱点只奖励说对你最常错的那类句子：都和学习的方向一致。 */
const GAME = {
  st:null,

  },
  start(){

    const place = r0 && r0.place ? r0.place : BT.rollPlace(giant);

    A.setChar(BAT_CHAR ? BT.rebuild(BAT_CHAR) : null, BT.metaOf(BAT_CHAR, giant));
    S.game = S.game || {}; if (!S.game.boss){ S.game.boss = {tag:GAME.weakTag(), hp:80, img:GAME.bossImg()}; save(); }
    if (!S.game.boss.img){ S.game.boss.img = GAME.bossImg(); save(); }
    const nCards = RUN.items.filter(it => it.k === "card").length;
    const day = batDayRec(); if (!day.hp){ const ref = K.battleRef(S.battle, today()); day.ref = ref; day.hp = ref ? S.battle[ref].dmg : 0; }
    const r = RUN.gameResume || null; RUN.gameResume = null;
    GAME.st = {A, smalls: r ? r.smalls : Math.max(2, Math.min(5, Math.floor(nCards / 3))), k: r ? Math.max(0, r.k - 1) : 0, combo: r ? r.combo : 0, best: r ? r.best : 0, defeated: r ? r.defeated : 0,
      chain:Promise.resolve(), enemy:null, bossDown: r ? r.bossDown : false, todayBefore:day.dmg, sessionDmg: r ? r.sessionDmg : 0, energy: r ? r.energy : 0, last:[],
      php: r && r.php != null ? r.php : 100, giveups: r ? r.giveups || 0 : 0, eliteN: r ? r.eliteN || 0 : 0, minorN: r ? r.minorN || 0 : 0, giant, place};
    A.onYouHit = d => { const st = GAME.st; if (!st || st.A !== A) return; st.php = Math.max(0, st.php - d); A.setYouHP(st.php, 100); };
    GAME.st.custom = {grunt:[], trooper:[], elite:[], boss:[]}; GAME.st.rivals = []; GAME.st.rivalN = 0; GAME.st.customN = {};
    { const st0 = GAME.st; Promise.all([eneLoadAll(), L.rivals !== false ? rivalsLoad() : Promise.resolve([])]).then(([ens, rv]) => { if (GAME.st !== st0) return;
      for (const x of ens) if (sizeOk(x.info.size, st0.giant)) (st0.custom[x.info.tier] || (st0.custom[x.info.tier] = [])).push(x);
      st0.rivals = rv.filter(x => charSizeOk(x.rec, st0.giant)); }); }
    A.setYouHP(GAME.st.php, 100);
    GAME.next(true);
    if (r && r.hp != null && GAME.st.enemy){ GAME.st.enemy.hp = r.hp; A.setHP(r.hp, true, GAME.st.enemy.max); }
    GAME.score(); GAME.meter();
    if (!L.gameTip){ const g = document.querySelector(".g-top"); if (g) g.insertAdjacentHTML("beforeend", `<div class="panel g-tip"><b>怎么打</b><p class="small" style="margin-top:4px">说完一句，你的角色就出招：完全对、基本对、意思对（换了个说法）都出重击，完全对、而且看到就能开口、正常语速一口气说完（十个词的句子大约 7 秒），还有暴击；只要开口说了，至少也能擦伤对手；一个字没说，对手加一层护盾，还会反击你：小兵打得轻，首领打得最重。重练时说对就能打碎护盾。被识别错了，就点“我说对了，是识别错了”，和识别对了完全一样。每次第一次就说对，攒一格能量；攒满 5 格，下一张是大招卡，说对了就放大招。没看清，点“回放”。</p><button class="btn sm" data-act="g-tip-ok" style="margin-top:6px">知道了</button></div>`); }
  },
  score(){ const st = GAME.st; if (!st) return; const day = batDayRec(); st.A.setScore(`今天 ${st.todayBefore + st.sessionDmg}${day.hp ? ` / 昨天 ${day.hp}` : " 点"}`); },
  /* 连击、能量（5 格满了，下一张就是大招卡）、第几只 */
  meter(){
    const st = GAME.st; const el = document.getElementById("gInfo"); if (!st || !el) return;
    const pips = Array.from({length:5}, (_, i) => `<i class="${i < st.energy ? "on" : ""}"></i>`).join("");
    el.innerHTML = `${st.combo >= 2 ? `连击 ${st.combo}　` : ""}<span class="g-energy" title="能量">${pips}</span>`;
  },
  /* 存下来，退出以后能接着打 */
  snap(){ const st = GAME.st; if (!st) return null; return {k:st.k, hp: st.enemy ? Math.round(st.enemy.hp) : null, combo:st.combo, best:st.best, defeated:st.defeated, smalls:st.smalls, bossDown:st.bossDown, sessionDmg:st.sessionDmg, energy:st.energy, php:st.php, giveups:st.giveups, eliteN:st.eliteN, minorN:st.minorN, giant:st.giant, place:st.place}; },
  /* 首领的形象：原来的 8 只加上导入的首领轮流（“只用我导入的敌人”时只用导入的）；导入的记成 "u:<id>" */
  bossImg(){
    const mine = ENE_LIST.filter(e => e.tier === "boss").map(e => "u:" + e.id), code = BT.ids("boss");
    const l = L.enemyOnly && mine.length ? mine : code.concat(mine); if (!l.length) return null; const n = (S.game && S.game.bossN) || 0; return l[n % l.length];
  },
  /* 现在的首领：先看有没有固定给这种弱点的导入形象，再看轮到的形象；弱点永远按学习数据（S.game.boss.tag） */
  bossEnemy(){
    const st = GAME.st, b = S.game.boss, bosses = (st && st.custom && st.custom.boss) || [];
    const giant = !!(st && st.giant);
    const bound = bosses.find(x => x.info.bind && x.info.bind === b.tag);
    const turn = b.img && b.img.startsWith("u:") ? bosses.find(x => "u:" + x.info.id === b.img) : null;
    const x = bound || turn;
    if (x) return Object.assign(imgEnemy(x, "boss", giant, false), {id:"boss", tag:b.tag, hp:b.hp, max:80, boss:true, img:"u:" + x.info.id});
    let id = b.img && !b.img.startsWith("u:") ? b.img : null; const l = BT.ids("boss");
    if (!id || !sizeOk(CODE_SIZE[id], giant)){ const ok = l.filter(k => sizeOk(CODE_SIZE[k], giant)); const i0 = Math.max(0, l.indexOf(id)); id = ok.find(k => l.indexOf(k) > i0) || ok[0]; }
    return BT.boss(b.tag, b.hp, id);
  },
  /* 出招时让舞台露出来：换卡、出招前，页面滚回顶上 */
  focus(){ const g = document.querySelector(".g-top"); if (!g) return; const r = g.getBoundingClientRect(); if (r.top < -10 || r.top > window.innerHeight * 0.4) window.scrollTo({top:0, behavior:"smooth"}); },
  next(first){
    const st = GAME.st; let e;
    /* 先是人形小怪（小兵 → 强化兵 → 精英，每 4 只里夹一只原创怪物），然后是首领；首领打完了，再来更多小怪 */
    /* 每 4 只里夹一只小怪怪物；到了精英那一档，人形精英和精英怪各一半 */
    /* 导入的敌人：这一档有的话，和原来的轮流出（打开“只用我导入的敌人”就只出导入的）；来切磋的角色：每 3 次精英里有 1 次 */
    const customFor = tier => {
      const l = (st.custom && st.custom[tier]) || []; if (!l.length) return null;
      st.customN[tier] = (st.customN[tier] || 0) + 1; const n = st.customN[tier];
      if (!L.enemyOnly && n % 2 === 1) return null;
      return imgEnemy(l[Math.floor((n - 1) / (L.enemyOnly ? 1 : 2)) % l.length], tier, st.giant, false);
    };
    const rivalFor = () => { if (L.rivals === false || !st.rivals || !st.rivals.length) return null; st.rivalN++; return imgEnemy(st.rivals[(st.rivalN - 1) % st.rivals.length], "elite", st.giant, true); };
    const pick0 = i => {
      const tier = BT.mob(i).tier;
      if (tier === "elite" && L.rivals !== false && st.rivals && st.rivals.length && ((st.eliteSeen = (st.eliteSeen || 0) + 1) % 3 === 0)){ const r = rivalFor(); if (r) return r; }
      return customFor(tier) || pick(i);
    };
    const pick = i => {
      /* 巨大的局：人形小怪是真人大小，放在城市里不对，换成小怪怪物；精英档全用精英怪 */
      if (st.giant && typeof TuokouMonsters !== "undefined"){ const m0 = BT.mob(i); if (m0.tier === "elite"){ st.eliteN = (st.eliteN || 0) + 1; return BT.eliteMon(st.eliteN - 1); } st.minorN = (st.minorN || 0) + 1; return BT.monster(st.minorN - 1); }
      if (i % 4 === 3) return BT.monster(Math.floor(i / 4));
      const m = BT.mob(i);
      if (m.tier === "elite" && typeof TuokouMonsters !== "undefined"){ st.eliteN = (st.eliteN || 0) + 1; if (st.eliteN % 2 === 0) return BT.eliteMon(st.eliteN / 2 - 1); }
      return m;
    };
    if (st.k < st.smalls) e = pick0(st.k);
    else if (!st.bossDown && S.game && S.game.boss) e = GAME.bossEnemy();
    else {
      /* 加赛（打完首领以后）：来切磋的角色先上，每个一次 */

    return first ? Promise.resolve() : st.A.enemyIn();
  },
  onCard(entry){ const st = GAME.st; if (!st) return; GAME.focus(); st.chain = st.chain.then(() => GAME.play(entry)).catch(() => {}); },
  onFix(entry, delta, shield){ const st = GAME.st; if (!st) return; st.chain = st.chain.then(async () => {
    if (!GAME.st || !st.A.root.isConnected) return;
    /* 原来没算“说对”的：补上连击和能量；说得够快就补上暴击 */
    const old = K.battleFirst(Object.assign({}, entry, {mis:false})), wasOk = ["exact", "close", "meaning", "sound"].includes(old);
    if (!wasOk){ st.combo++; st.best = Math.max(st.best, st.combo); if (st.energy < 5){ st.energy++; if (st.energy >= 5) GAME.armSpecial(); } GAME.meter(); }
    /* 暴击只加在打到对手身上的伤害里（和正常打中一样），和昨天比的成绩只算底数 */
    const critBonus = entry.ms > 0 && entry.ms <= critMs(entry) ? 5 : 0; if (critBonus) st.A.pop("暴击！", "crit");
    st.sessionDmg += delta; GAME.score(); delta += critBonus;
    const e = st.enemy, weak = e.boss && entry.tag === e.tag ? 1.5 : 1, dmg = Math.max(1, Math.round(delta * weak));
    GAME.say(`识别错了，按说对算：-${dmg}`); if (weak > 1) st.A.pop("弱点！", "weak");
    st.last = [{kind:"hit", mv:"heavy", dmg, breaks: shield ? 1 : 0, label:`识别错了，按说对算：-${dmg}`, pops:[]}];
    await st.A.move("heavy", dmg, {breaks: shield ? 1 : 0}); await GAME.afterHit();
  }).catch(() => {}); },
  say(t){ const el = document.getElementById("gSay"); if (el) el.textContent = t; },
  async afterHit(){
    const st = GAME.st; if (!st) return; const A = st.A, e = st.enemy;
    e.hp = A.hp; if (e.boss && S.game.boss){ S.game.boss.hp = Math.max(0, Math.round(e.hp)); save(); }
    if (A.hp <= 0 && !st.pendingNext){
      st.last.push({kind:"ko"});
      await A.knockout(); st.defeated++; A.cheer();
      if (e.boss){ st.bossDown = true; S.game.boss = null; S.game.bossWins = (S.game.bossWins || 0) + 1; S.game.bossN = (S.game.bossN || 0) + 1; save(); }
      GAME.say(e.boss ? `打败了首领「${e.name}」！` : `打倒了${e.name}！`);
      /* 先停在胜利画面；开始下一题的时候，新的对手才出来 */
      st.pendingNext = true;
    }
  },
  async play(entry){
    const st = GAME.st; if (!st || !st.A.root.isConnected) return;
    if (st.pendingNext){ st.pendingNext = false; await GAME.next(false); }
    const A = st.A; const plan = K.battlePlan([entry]); const lv1 = K.battleFirst(entry);
    st.sessionDmg += plan.card; GAME.score(); st.last = [];
    const ok1 = ["exact", "close", "meaning", "sound"].includes(lv1);
    if (ok1){ st.combo++; st.best = Math.max(st.best, st.combo); } else st.combo = 0;
    if (entry.spoke || entry.mis) st.giveups = 0;   /* 开口说了任何一句，就从头算 */

    if (entry.special){

        GAME.say(`大招！-${dmg}`); st.last.push({kind:"special", dmg, label:`大招！-${dmg}`});

      }
