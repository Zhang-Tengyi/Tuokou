    }
    const LBL = {exact:"完全对", close:"基本对", meaning:"意思对了，换了个说法", sound:"听起来很接近", graze:"开口了，擦伤"};
    for (const ev of plan.events){
      const e = st.enemy; const weak = e.boss && entry.tag === e.tag ? 1.5 : 1;
      if (ev.k === "shield"){
        const t = "没说出来：对手加了一层护盾，还反击了你一下"; GAME.say(t); A.pop("护盾 +1", "shield"); st.last.push({kind:"shield", label:t}); await A.addShields(1);
        await GAME.counter(); if (!GAME.st) return; continue;
      }
      let mult = weak, label; const pops = [];
      if (ev.k === "break") label = ev.shield ? "补说对了：打碎护盾" : "补说对了";
      else label = entry.mis ? "识别错了，按说对算" : LBL[ev.lv] || "";
      /* 暴击：完全对，而且说得快——反应时间 + 按句子长短的说话时间 + 识别确认的时间（critMs）。点了“识别错了”的也一样 */
      if (ev.k === "hit" && ev.lv === "exact" && entry.ms > 0 && entry.ms <= critMs(entry)){ mult *= 1.5; pops.push(["暴击！", "crit"]); label += "，暴击"; }
      const bonus = ev.k === "hit" && ok1 && st.combo >= 3 ? Math.min(3, st.combo - 2) : 0;
      if (bonus) pops.push([`连击 ×${st.combo}`, "combo"]);
      if (weak > 1) pops.push(["弱点！", "weak"]);
      const dmg = Math.max(1, Math.round((ev.d + bonus) * mult));
      GAME.say(`${label}：-${dmg}`); pops.forEach(([t, c]) => A.pop(t, c));
      const mv = ev.k === "hit" && ["exact", "close", "meaning"].includes(ev.lv) ? "heavy" : "light";   /* 说对了（完全对、基本对、意思对）出重击 */
      st.last.push({kind:"hit", mv, dmg, breaks: ev.shield ? 1 : 0, label:`${label}：-${dmg}`, pops});
      await A.move(mv, dmg, {breaks: ev.shield ? 1 : 0});
      await GAME.afterHit();
    }
    /* 能量：第一次就说对攒一格；满 5 格，下一张变成大招卡（优先挑这一轮前面没说好的那句，隔一会儿再回忆一次） */
    if (ok1 && st.energy < 5){ st.energy++; if (st.energy >= 5) GAME.armSpecial(); }
    GAME.meter();
  },
  /* 对手反击：只有主动放弃（一个字没说）才会。伤害按对手的档位分（小兵最低、首领最高），再按出的招加成 */
  async counter(){
    const st = GAME.st; if (!st) return; const A = st.A, e = st.enemy;
    st.giveups++;
    const kind = st.giveups === 1 ? "light" : st.giveups === 2 ? "heavy" : "skill";   /* 首领也一样：轻击、重击、技能 */
    const dmg = counterDmg(e, kind);
    st.last.push({kind:"counter", mv:kind, label:`对手反击：你 -${dmg}`});
    await A.enemyMove(kind, dmg);
    GAME.say(`对手反击：你 -${dmg}（还剩 ${st.php}）`);
    if (st.php <= 0) await GAME.fail();
  },
  /* 血扣光：这一局失败。停下来，让用户选 */
  async fail(){
    const st = GAME.st; if (!st) return; const A = st.A;
    GAME.say("血扣光了：这一局失败");
    await A.finish(false);
    const day = batDayRec(); day.fails = (day.fails || 0) + 1; save();
    const c = await choose("这一局失败了", "连着好几句没说出来，可能这批句子有点难，或者今天状态不太好。已经练过的卡都照常算。", [["retry", "继续挑战（血回满）"], ["learn", "换成学习模式练完这一轮"], ["stop", "先到这里"]]);
    if (!GAME.st) return;
    if (c === "learn"){ GAME.stop(); RUN.game = false; const g = document.querySelector(".g-top"); if (g) g.remove(); toast("剩下的卡用学习模式练"); return; }
    if (c === "stop"){ RUN.items = RUN.items.slice(0, RUN.i + 1); const rc = document.getElementById("runCount"); if (rc) rc.textContent = `${RUN.i + 1}/${RUN.items.length}`; toast("练完这一张就结束"); }
    st.php = 100; st.giveups = 0; A.setYouHP(100, 100); A.clear(); if (A.cm) A.cm.idle(); GAME.say(c === "stop" ? "练完这一张就结束" : "重新站起来了");
  },
  armSpecial(){
    const done = new Set((RUN.battle || []).filter(x => x.special).map(x => x.id));
    const miss = (RUN.battle || []).filter(x => ["off", "graze"].includes(K.battleFirst(x)) && !done.has(x.id) && CAT.byId[x.id]);
    const nx = RUN.items[RUN.i + 1];
    if (miss.length) RUN.items.splice(RUN.i + 1, 0, {k:"card", id:miss[0].id, special:true, retry:true});
    else if (nx && nx.k === "card") nx.special = true;
    else RUN.items.splice(RUN.i + 1, 0, {k:"card", id:(RUN.battle[RUN.battle.length - 1] || {}).id, special:true, retry:true});
    { const st = GAME.st; if (st) st.A.pop("能量满了！下一张是大招卡", "combo"); }
    const tr = document.getElementById("runCount"); if (tr && RUN.items[RUN.i]) tr.textContent = `${RUN.i + 1}/${RUN.items.length}`;
  },
  /* 回放：没看到的话，再放一遍刚才那一下（只是动画，不再扣血） */
  replay(){
    const st = GAME.st; if (!st || !st.last.length){ toast("还没有可以回放的出招"); return; }
    const steps = st.last.slice(); GAME.focus();
    st.chain = st.chain.then(async () => {
      const A = st.A; if (!A.root.isConnected) return;
      if (st.pendingNext) A.revive();
      for (const x of steps){
        if (x.kind === "ko"){ await A.knockout(); A.cheer(); continue; }
        if (x.kind === "counter"){ GAME.say("回放：" + x.label); const keep = A.onYouHit; A.onYouHit = null; await A.enemyMove(x.mv, 0); A.onYouHit = keep; continue; }
        GAME.say("回放：" + x.label);
        if (x.kind === "shield"){ A.pop("护盾 +1", "shield"); await new Promise(r => setTimeout(r, 500)); continue; }
        const hp0 = A.hp; A.setHP(Math.min(A.max, hp0 + x.dmg), true);
        (x.pops || []).forEach(([t, c]) => A.pop(t, c));
        if (x.kind === "special") await A.special(x.dmg); else await A.move(x.mv || "light", x.dmg);
        A.setHP(hp0, true);
      }
    }).catch(() => {});
  },
  stop(){ if (GAME.st){ GAME.st.A.clear(); GAME.st = null; } }
};

async function batJudge(said, alts){
  const R = BAT_RUN; if (!R) return; const e = R.pick;
  let best = said ? K.compareSaid(e.en, e.alt || [], said) : null;
  for (const a of alts || []){ const c = K.compareSaid(e.en, e.alt || [], a); if (c && (!best || ({off:0, meaning:1, close:2, exact:3})[c.level] > ({off:0, meaning:1, close:2, exact:3})[best.level])) best = c; }
  const ok = best && (best.level === "exact" || best.level === "close");
  if (ok){
    batPanel(`<p class="small">说对了：${esc(e.en)}</p>`);
    const sp = K.battleSpecial(R.card); R.special = sp; R.day.dmg += sp; save();
    const st = $("#btStatus"); if (st) st.textContent = `大招：-${sp}`;
    await R.A.special(sp); R.A.setScore(`今天 ${R.carried + R.card + sp} 点`);
    if (R.enemy){
      R.enemy.hp = R.A.hp; if (R.enemy.boss && S.game && S.game.boss){ S.game.boss.hp = Math.max(0, Math.round(R.A.hp)); save(); }
      if (R.A.hp <= 0){ await R.A.knockout(); R.defeated++; if (R.enemy.boss){ R.bossDown = true; S.game.boss = null; S.game.bossWins = (S.game.bossWins || 0) + 1; save(); } }
    }
    batFinish(); return;
  }
  R.tries++;
  if (R.tries < 2){ batSpecialPanel(`${said ? `我听到的是：“${esc(said)}”。` : "没听清。"}差一点，再说一次。`); return; }
  batPanel(`<div class="panel bt-sp"><p class="small">这次没放出来。正确的说法是：</p><div class="bt-en">${esc(e.en)}</div><div class="row-gap" style="margin-top:8px"><button class="btn sm" data-act="bt-listen">听一遍</button></div></div>`);
  batFinish(true);
}

async function batFinish(keepPanel){

  const p = $("#btPanel"); if (p){ if (keepPanel) p.insertAdjacentHTML("beforeend", html); else p.innerHTML = html; }
  if (won) await R.A.cheer();

async function glowApply(json, rec){
  const poses = BT.rebuild(Object.assign({}, rec, {repl:{}}));
  const m = BT.glowMatch(json, poses); if (!m){ if (rec.glow){ delete rec.glow; delete rec.glowName; delete rec.glowScale; } return null; }

}

CHG["ene-size"] = async el => { const e = ENE_LIST.find(x => x.id === el.dataset.v); if (!e) return; e.size = el.value; await eneSave(); toast(({both:"普通和巨大的局里都会出现", normal:"只在普通大小的局里出现", giant:"只在巨大化的局里出现"})[e.size]); };
CHG["ene-tpl"] = async el => { const e = ENE_LIST.find(x => x.id === el.dataset.v); if (!e) return; e.tpl = el.value; await eneSave(); };
CHG["ene-bind"] = async el => { const e = ENE_LIST.find(x => x.id === el.dataset.v); if (!e) return; e.bind = el.value || null; if (e.bind) ENE_LIST.forEach(x => { if (x !== e && x.bind === e.bind) x.bind = null; }); await eneSave(); UI.render(); };
CHG["ene-only"] = el => { L.enemyOnly = !!el.checked; saveLocal(); };
CHG.rivals = el => { L.rivals = !!el.checked; saveLocal(); };
ACT["ene-ren"] = async el => { const e = ENE_LIST.find(x => x.id === el.dataset.v); if (!e) return; const n = prompt("给这个敌人起个名字", e.name); if (n && n.trim()){ e.name = n.trim().slice(0, 20); await eneSave(); UI.render(); } };
ACT["ene-del"] = async el => { const e = ENE_LIST.find(x => x.id === el.dataset.v); if (!e) return; if (!await sheet(`删除“${e.name}”？`, "删除以后要用的话得重新导入。", "删除", true)) return; await eneDel(e.id); UI.render(); toast("删掉了"); };
ACT["ene-see"] = async el => {
  const e = ENE_LIST.find(x => x.id === el.dataset.v); if (!e || !BAT_MONA) return;
  const rec = await IDB.get("battle:enemy:" + e.id); if (!rec) return;
  const m = imgEnemy({info:e, rec}, e.tier, false, false); BAT_MONA.setEnemy(m); BAT_MONA.setNames(m.name, "你"); BAT_MONA.setHP(m.max, true, m.max);
  const mp = document.getElementById("btMonPrev"); if (mp) mp.scrollIntoView({block:"center", behavior:"smooth"});
};
ACT["mon-pick"] = el => { BAT_MON = el.dataset.v; document.querySelectorAll(".bt-card").forEach(b => b.classList.toggle("on", b.dataset.v === BAT_MON)); batMonShow(); const mp = document.getElementById("btMonPrev"); if (mp) mp.scrollIntoView({block:"center", behavior:"smooth"}); };
ACT["mon-play"] = async el => {
  const A = BAT_MONA; if (!A) return; const k = el.dataset.v;
  if (k === "light" || k === "heavy" || k === "skill"){ A.clear(); await A.enemyMove(k, 0); return; }
  if (A.cm){ if (k === "hit") A.cm.play("hit"); else if (k === "win") A.cm.play("win"); else A.cm.play("lose"); return; }
  if (k === "hit") await A.move("light", 0); else if (k === "win") await A.finish(false); else await A.finish(true);
};
ACT.btp = el => { if (BAT_PREV) BAT_PREV.preview(el.dataset.v); };
CHG["bt-file"] = async el => {
  const f = el.files && el.files[0]; el.value = ""; if (!f) return;
  const note = $("#btNote"); if (note) note.textContent = "正在处理……";
  try {
    const poses = await BT.processImage(f);
    const n = Object.keys(poses).length;
    if (![6, 9, 10].includes(n)) throw new Error("这里要 10、9 或 6 个姿势的姿势表。只有 1 个人物的单人图，可以导入姿势表以后，用来替换或补上其中一个姿势。");
    /* 新角色的模板：用导入那里单独的选项（以前用的是“正在用的角色”的下拉框，一选就把正在用的角色改掉了） */
    const tk = BT.tplOf((document.getElementById("btImpTpl") || {}).value || "brawler"), T = BT.TEMPLATES[tk || "brawler"];
    const lo = tk ? {light:T.light, heavy:T.heavy, skill:T.skill, hover:T.hover} : BT.rigLoadout();
    await batAddChar({v:3, sheet:poses, sheetType:n, loadout:lo, r:T.r, cm:T.cm, repl:{}, beam:{}, at:Date.now()});
    UI.render(); toast("导入好了：找到 6 个姿势，已经去掉了绿色背景，现在正在用它");
  } catch (err){ const n = $("#btNote"); if (n) n.textContent = err.message; }
};
CHG["bt-rep"] = async el => {
  const f = el.files && el.files[0]; el.value = ""; const rec = BAT_CHAR; if (!f || !rec) return;
  const name = ($("#btRepPose") || {}).value || "special";
  try {
    const got = await BT.processImage(f);
    if (Object.keys(got).length !== 1) throw new Error("这里只能放只有 1 个人物的单人图。");
    rec.repl = rec.repl || {}; rec.repl[name] = {pose:got.idle, k:1}; if (rec.beam) delete rec.beam[name];
    await batSaveChar(rec); UI.render(); toast(`替换好了：${BT.POSE_NAMES[name]}`);
  } catch (err){ const n = $("#btNote"); if (n) n.textContent = err.message; }
};
CHG["bt-repsize"] = async el => {
  const rec = BAT_CHAR; const name = ($("#btRepPose") || {}).value; const v = $("#btRepVal"); if (v) v.textContent = el.value + "%";
  if (!rec || !rec.repl || !rec.repl[name]){ toast("先选一张单人图替换这个姿势，再调大小"); return; }
  rec.repl[name].k = Number(el.value) / 100; await batSaveChar(rec); if (BAT_PREV) BAT_PREV.setChar(BT.rebuild(rec), BT.metaOf(rec));
};
ACT["bt-calib"] = async () => {
  if (!BAT_PREV || !BAT_CHAR) return; toast("点一下右边角色那只竖着的手：大招的光线会从那里发出", 4000);
  const r = await BAT_PREV.calibrate(); if (!r) return;
  BAT_CHAR.beam = BAT_CHAR.beam || {}; BAT_CHAR.beam[r.pose] = r.frac; await batSaveChar(BAT_CHAR); toast("设好了。点“大招”看看效果");
};
ACT["bt-del"] = async () => {
  const id = L.batActive; if (!id || id === "rig") return;
  if (!await sheet("删除这个角色？", "删除以后换回默认的原创小人；对战记录不受影响。", "删除", true)) return;
  await batDelChar(id); UI.render(); toast("删掉了，换回了原创小人");
};

/* ---------- 没练完的一轮：切到任何别的页面都先存下来（以前只在点“退出”或 app 切到后台时存） ---------- */
(function(){
  const onRun = () => { const t = UI.top && UI.top(); return !!t && (t.name || t) === "run"; };
  const save1 = () => { try { if (onRun() && RUN && RUN.items && RUN.i < RUN.items.length && typeof saveResume === "function") saveResume(); } catch (e) {} };
  /* 切页面以后：收掉不在屏幕上的舞台；离开了对战相关的页面就清缓存；不用 Whisper、又没有转写任务时，把识别模型放掉（约 80 MB） */
  const tidy = () => setTimeout(() => {
    try { BT.sweepArenas(); const t = UI.top && UI.top(), name = t && (t.name || t); if (name !== "run" && name !== "battle") BT.freeCaches(); } catch (e) {}
    try { if (typeof ASR !== "undefined" && ASR.w && !ASR.cur && !(ASR.q && ASR.q.length) && !(typeof whisperOn === "function" && whisperOn())){ ASR.w.terminate(); ASR.w = null; ASR.loadedId = null; } } catch (e) {}
  }, 0);
  for (const k of ["nav", "replace", "back", "onPop"]){ if (typeof UI[k] !== "function") continue; const f = UI[k]; UI[k] = function(v){ if (k === "back" || k === "onPop" || v !== "run") save1(); const r = f.apply(UI, arguments); tidy(); return r; }; }
  /* 点“开始”或“游戏”时，有没练完的一轮：问继续上次还是重新开始 */
  /* 点了哪个按钮，就用哪种方式接着练（同一批卡） */
  async function startChoice(game){
    if (window.__startChoice === "new" || typeof resumeInfo !== "function" || !resumeInfo()) return false;
    const r = resumeInfo(), was = r.game ? "游戏" : "学习模式";
    const goLabel = game ? (r.game ? "接着打" : "用游戏接着练") : (r.game ? "用学习模式接着练" : "接着练");
    const c = await choose("上次还有一轮没练完", `<p class="small muted">上次练到一半（${was}），还剩 ${r.items.length} 题。${!!r.game !== game ? (game ? "接着练的话，剩下的题用游戏模式练，从第一只敌人开始打。" : "接着练的话，剩下的题用学习模式练，不再打斗。") : ""}</p>`, [["go", goLabel], ["new", "重新开始"]]);
    if (c === "go"){ ACT["resume-go"](null, game); return true; }
    if (c === "new"){ L.resume = null; saveLocal(); return false; }
    return true;
  }
  for (const k of ["start", "start-std", "start-game"]){ if (typeof ACT[k] !== "function") continue; const f = ACT[k]; ACT[k] = async function(el){ if (await startChoice(k === "start-game")) return; return f.apply(this, arguments); }; }
})();

</script>
