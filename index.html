<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#16202B">
<title>脱口</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:ital,wght@0,600;1,600;1,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* 脱口 · 样式。起步灯是唯一的“大动作”，其余保持安静。 */
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#ECEFF3; --surface:#FFFFFF; --surface2:#F4F6F9; --ink:#16202B; --ink2:#36424F; --muted:#5B6774; --line:#D5DBE2;
  --red:#D90F2C; --red-soft:#FBE3E7; --purple:#7A2FDB; --purple-soft:#EEE4FC; --green:#0B8F50; --green-soft:#DCF3E6;
  --amber:#B87800; --amber-soft:#FBEFD3; --cta:#16202B; --cta-ink:#FFFFFF; --focus:#2F6FDE;
  --gantry:#1A222C; --lamp-off:#2E3742; --lamp-on:#FF1F3D;
  --f-ui:system-ui,-apple-system,"Segoe UI","PingFang SC","Noto Sans SC","Noto Sans CJK SC","Microsoft YaHei",Roboto,sans-serif;
  --f-en:"Source Serif 4","Noto Serif",Georgia,"Times New Roman",serif;
  --f-num:"Barlow Semi Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --tabbar-h:64px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1319; --surface:#17202A; --surface2:#1E2834; --ink:#E9EEF3; --ink2:#C3CCD6; --muted:#93A0AE; --line:#2B3746;
    --red:#FF5068; --red-soft:#3A1A22; --purple:#B58AFF; --purple-soft:#2B2140; --green:#3DD68C; --green-soft:#13301F;
    --amber:#FFC24A; --amber-soft:#3A2E12; --cta:#E9EEF3; --cta-ink:#0E1319; --focus:#7FA8FF;
    --gantry:#080B0F; --lamp-off:#232C37; --lamp-on:#FF2D4B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1319; --surface:#17202A; --surface2:#1E2834; --ink:#E9EEF3; --ink2:#C3CCD6; --muted:#93A0AE; --line:#2B3746;
  --red:#FF5068; --red-soft:#3A1A22; --purple:#B58AFF; --purple-soft:#2B2140; --green:#3DD68C; --green-soft:#13301F;
  --amber:#FFC24A; --amber-soft:#3A2E12; --cta:#E9EEF3; --cta-ink:#0E1319; --focus:#7FA8FF;
  --gantry:#080B0F; --lamp-off:#232C37; --lamp-on:#FF2D4B;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.55;
  -webkit-tap-highlight-color:transparent;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
img,svg{max-width:100%}
.hide{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:16px 18px calc(var(--tabbar-h) + 24px)}
.full .wrap{padding-bottom:28px}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.center{text-align:center}
.stack>*+*{margin-top:12px}
.row-gap{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{height:16px}
h1,h2,h3{margin:0;line-height:1.25}
h2{font-size:21px;font-weight:700;letter-spacing:-.01em}
h3{font-size:16px;font-weight:700}
p{margin:0}
a{color:var(--focus)}

/* 数字：计时牌字体 */
.num{font-family:var(--f-num);font-style:italic;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.01em}

/* 顶部 */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 18px}
.wordmark{font-size:40px;font-weight:900;letter-spacing:-.04em;line-height:1}
.streak{display:flex;align-items:baseline;gap:6px;text-align:right}
.streak .num{font-size:34px;line-height:1}
.streak .lbl{font-size:13px;color:var(--muted);line-height:1.2}
.subhead{display:flex;align-items:center;gap:10px;margin:2px 0 16px}
.back{border:0;background:none;padding:6px 8px 6px 0;font-size:15px;color:var(--muted);display:flex;align-items:center;gap:4px}

/* 起步灯 */
.gantry{display:inline-flex;gap:10px;padding:10px 14px;border-radius:999px;background:var(--gantry)}
.gantry i{width:18px;height:18px;border-radius:50%;background:var(--lamp-off);box-shadow:inset 0 -2px 0 rgba(0,0,0,.35);transition:background .08s}
.gantry i.on{background:var(--lamp-on);box-shadow:0 0 10px var(--lamp-on),inset 0 -2px 0 rgba(0,0,0,.2)}
.gantry.big i{width:26px;height:26px}
.gantry.small{gap:7px;padding:7px 10px}
.gantry.small i{width:12px;height:12px}

/* 首页主区 */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:20px 18px 18px;margin-bottom:22px}
.hero .gantry{margin-bottom:16px}
.hero h2{font-size:24px}
.hero .meta{margin-top:6px;color:var(--muted);font-size:14px}
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px;margin:14px 0 12px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 4px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 0 var(--line)}
.countdown{display:flex;align-items:baseline;gap:8px;margin:-6px 0 22px;padding:0 4px}
.countdown .num{font-size:30px;color:var(--amber)}

/* 按钮 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 16px;border-radius:14px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:15.5px;font-weight:600;text-decoration:none;user-select:none}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--cta);color:var(--cta-ink);border-color:var(--cta)}
.btn.block{display:flex;width:100%}
.btn.big{min-height:56px;font-size:17px;border-radius:16px}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:11px}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn svg{width:20px;height:20px;flex:none}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;padding:0}
.icon-btn svg{width:22px;height:22px}

/* 模块列表 */
.feature{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:18px;border-radius:20px;border:0;
  background:var(--gantry);color:#F2F5F8;margin-bottom:12px}
.feature svg{width:30px;height:30px;flex:none}
.feature b{display:block;font-size:17px}
.feature span{display:block;font-size:13.5px;color:#AEB8C3}
.mods{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mod{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);text-align:left}
.mod svg{width:24px;height:24px;color:var(--ink2)}
.mod b{font-size:15.5px}
.mod span{font-size:12.5px;color:var(--muted);line-height:1.35}
.tip{margin:22px 4px 0;padding-left:12px;border-left:3px solid var(--lamp-on);color:var(--ink2);font-size:14.5px}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:14px;background:var(--surface2);border:1px dashed var(--line);margin-bottom:16px;font-size:14px}

/* 通用面板与表单 */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.panel+.panel{margin-top:12px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border:0;border-top:1px solid var(--line);background:none;text-align:left}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .grow b{display:block;font-weight:600}
.li .grow span{display:block;font-size:13px;color:var(--muted)}
.li .end{font-size:13px;color:var(--muted);white-space:nowrap}
.sec-title{font-size:13.5px;color:var(--muted);margin:22px 4px 8px;font-weight:600}
label.fld{display:block;margin-top:12px}
label.fld>span{display:block;font-size:13.5px;color:var(--muted);margin-bottom:6px}
input[type=text],input[type=date],input[type=number],textarea,select{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font-size:16px}
textarea{min-height:110px;resize:vertical;line-height:1.5}
textarea.en,input.en{font-family:var(--f-en);font-size:17px}
input[type=range]{width:100%}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.switch:first-child{border-top:0}
.switch input{width:22px;height:22px}

/* 标签 */
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:12.5px;background:var(--surface2);border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.chip.k{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chips{display:flex;gap:6px;flex-wrap:wrap}

/* 练习页 */
.runbar{display:flex;align-items:center;gap:12px;margin:2px 0 18px}
.runbar .track{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.runbar .track i{display:block;height:100%;background:var(--ink);border-radius:99px;transition:width .25s}
.runbar .num{font-size:15px;color:var(--muted);font-style:normal}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:20px 18px;min-height:220px}
.card .kind{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.zh{font-size:24px;font-weight:600;line-height:1.4;letter-spacing:.01em}
.en{font-family:var(--f-en);font-size:24px;line-height:1.38;font-weight:400}
.en.sm{font-size:19px}
.wrong{font-family:var(--f-en);font-size:22px;line-height:1.4;text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2px}
.verb{font-family:var(--f-en);font-size:34px;line-height:1.1;margin-bottom:12px}
.parts{display:flex;gap:8px;flex-wrap:wrap}
.parts .chip{font-size:15px;padding:6px 12px}
.parts .chip.cue{background:var(--amber-soft);border-color:transparent;color:var(--ink)}
.go-row{display:flex;align-items:center;gap:12px;margin:18px 0 6px}
.go-row .num{font-size:20px;color:var(--muted)}
.answer-zone{margin-top:16px}
.mic{width:84px;height:84px;border-radius:50%;border:0;background:var(--cta);color:var(--cta-ink);display:flex;align-items:center;justify-content:center;margin:6px auto 4px;position:relative}
.mic svg{width:34px;height:34px}
.mic.live::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:3px solid var(--lamp-on);animation:pulse 1.1s ease-out infinite}
@keyframes pulse{from{transform:scale(.92);opacity:1}to{transform:scale(1.18);opacity:0}}
.heard{min-height:26px;text-align:center;font-family:var(--f-en);font-size:18px;color:var(--ink2);margin:6px 0 10px}
.or{display:flex;gap:8px;margin-top:8px}
.or input{flex:1}
.reveal{margin-top:16px;border-top:1px solid var(--line);padding-top:16px}
.say-line{display:flex;align-items:flex-start;gap:10px}
.say-line .en{flex:1}
.alts{margin-top:8px;font-size:14px;color:var(--muted)}
.alts .en{font-size:16px}
.note{margin-top:10px;font-size:14.5px;color:var(--ink2)}
.verdict{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-weight:700}
.verdict.exact{color:var(--green)}
.verdict.close{color:var(--amber)}
.verdict.off{color:var(--red)}
.time-chip{margin-left:auto;font-size:17px;color:var(--muted)}
.time-chip.pb{color:var(--purple);animation:pbflash .6s ease-out 2}
@keyframes pbflash{50%{transform:scale(1.15)}}
.diff{font-family:var(--f-en);font-size:17px;line-height:1.9;background:var(--surface2);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.diff .x{text-decoration:line-through;color:var(--red)}
.diff .m{color:var(--green);border-bottom:2px solid var(--green);padding:0 2px}
.diff .s{color:var(--amber);border-bottom:2px dotted var(--amber)}
.diff .s small{font-family:var(--f-ui);font-size:12px;color:var(--muted)}
.fb{margin:0 0 10px;padding-left:18px;font-size:14.5px;color:var(--ink2)}
.rate{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:16px}
.rate button{min-height:58px;border-radius:14px;border:2px solid transparent;font-weight:700;font-size:15px;line-height:1.2}
.rate small{display:block;font-weight:400;font-size:11.5px;opacity:.8;margin-top:2px}
.rate .again{background:var(--red-soft);color:var(--red)}
.rate .hard{background:var(--amber-soft);color:var(--amber)}
.rate .good{background:var(--purple-soft);color:var(--purple)}
.rate .sug{border-color:currentColor}
.dots{display:flex;gap:12px;justify-content:center;margin:16px 0}
.dots i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line)}
.dots i.on{background:var(--green);border-color:var(--green)}
.blur{filter:blur(7px);transition:filter .2s;user-select:none}
.blur.peek{filter:none}
.step-done{font-family:var(--f-en);font-size:16px;color:var(--muted);margin-top:4px}
.options{display:grid;gap:8px;margin-top:14px}
.options button{text-align:left;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.options button.right{border-color:var(--green);background:var(--green-soft)}
.options button.wrongpick{border-color:var(--red);background:var(--red-soft)}
.listen-hero{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0 4px}
.play{width:92px;height:92px;border-radius:50%;border:0;background:var(--cta);color:var(--cta-ink);display:flex;align-items:center;justify-content:center}
.play svg{width:38px;height:38px}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.check:first-child{border-top:0}
.check input{width:20px;height:20px;margin-top:2px;flex:none}
.timer{font-size:46px;line-height:1;text-align:center;margin:10px 0}
.timer.over{color:var(--red)}
.level{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0}
.level i{display:block;height:100%;width:calc(var(--lvl,0)*100%);background:var(--green);transition:width .08s}
audio{width:100%;margin-top:8px}

/* 总结 */
.summary .big{font-size:56px;line-height:1}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat .num{display:block;font-size:28px;line-height:1.1}
.stat span{font-size:12.5px;color:var(--muted)}

/* 来电模拟（始终是深色） */
.call{position:fixed;inset:0;z-index:50;background:radial-gradient(120% 80% at 50% 0%,#24313F 0%,#0B1016 70%);color:#EEF2F6;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 28px) 22px calc(env(safe-area-inset-bottom,0px) + 28px);overflow-y:auto}
.call .who{text-align:center;margin-top:24px}
.call .avatar{width:96px;height:96px;border-radius:50%;margin:0 auto 14px;background:#2C3A49;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:700}
.call.ringing .avatar{animation:ring 1.4s ease-in-out infinite}
@keyframes ring{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.25)}50%{box-shadow:0 0 0 18px rgba(255,255,255,0)}}
.call .name{font-size:26px;font-weight:700}
.call .status{color:#9FB0C1;margin-top:4px}
.call .clock{font-size:20px;color:#9FB0C1;margin-top:4px}
.call .say{margin:26px auto 0;max-width:420px;text-align:center;min-height:90px}
.call .say .en{font-size:21px;color:#F4F7FA}
.call .say .zh{font-size:15px;color:#9FB0C1;font-weight:400;margin-top:6px}
.call .cheat{margin:14px auto 0;max-width:420px;background:rgba(255,255,255,.07);border-radius:14px;padding:12px 14px;font-size:14.5px;color:#D6DEE6}
.call .controls{margin-top:auto;display:grid;gap:10px;max-width:420px;width:100%;margin-left:auto;margin-right:auto;padding-top:24px}
.call .btn{background:rgba(255,255,255,.1);border-color:transparent;color:#EEF2F6}
.call .btn.primary{background:#EEF2F6;color:#0B1016}
.call .accept-row{display:flex;justify-content:space-around;margin-top:auto;padding-top:40px}
.round{width:76px;height:76px;border-radius:50%;border:0;display:flex;align-items:center;justify-content:center;color:#fff}
.round svg{width:34px;height:34px}
.round.green{background:#19B868}
.round.red{background:#E5304A}
.round-lbl{text-align:center;font-size:13px;color:#9FB0C1;margin-top:8px}
.call .level{background:rgba(255,255,255,.12)}
.call .muted{color:#9FB0C1}

/* 耳机模式 */
.hands-zh{font-size:30px;font-weight:600;line-height:1.35;text-align:center;margin:28px 0 18px;min-height:84px}
.hands-en{font-family:var(--f-en);font-size:26px;text-align:center;min-height:72px;color:var(--ink2)}
.hands-phase{text-align:center;margin-top:10px}

/* 进度 */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px;overflow-x:auto;padding-bottom:4px}
.heat i{width:16px;height:16px;border-radius:4px;background:var(--surface2);border:1px solid var(--line)}
.heat i.l1{background:var(--green-soft);border-color:var(--green-soft)}
.heat i.l2{background:color-mix(in srgb,var(--green) 55%,var(--surface));border-color:transparent}
.heat i.l3{background:var(--green);border-color:var(--green)}
.heat i.fz{border:1.5px dashed var(--amber)}
.heat i.today{outline:2px solid var(--ink);outline-offset:1px}
.bars .bar{display:grid;grid-template-columns:86px 1fr 64px;gap:10px;align-items:center;padding:7px 0}
.bars .bar .t{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bars .bar .t i{display:block;height:100%;background:var(--ink)}
.bars .bar .v{text-align:right;font-size:13.5px}
.up{color:var(--green)} .down{color:var(--red)}
.week{display:flex;align-items:flex-end;gap:8px;height:90px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;color:var(--muted)}
.week div i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:var(--ink);min-height:2px}

/* 写作自查 */
.marked{font-family:var(--f-en);font-size:17px;line-height:1.8;white-space:pre-wrap;background:var(--surface2);border-radius:12px;padding:12px}
.marked mark{background:var(--amber-soft);color:inherit;border-bottom:2px solid var(--amber);padding:0 1px}
.marked mark sup{font-family:var(--f-ui);font-size:10.5px;color:var(--amber);margin-left:1px}
.issues{margin:10px 0 0;padding-left:20px}
.issues li{margin:6px 0;font-size:14.5px}
.ai-out{margin-top:12px}
.ai-out .better{font-family:var(--f-en);font-size:17px;line-height:1.6;margin-top:8px}

/* 底部导航 */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);display:flex;justify-content:space-around}
.tabbar button{flex:1;max-width:140px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 9px;font-size:12px;color:var(--muted);position:relative}
.tabbar svg{width:24px;height:24px}
.tabbar button[aria-current="page"]{color:var(--ink);font-weight:700}
.tabbar button[aria-current="page"]::before{content:"";position:absolute;top:4px;left:calc(50% + 10px);width:7px;height:7px;border-radius:50%;background:var(--lamp-on)}
.full .tabbar{display:none}

/* 提示条、确认框 */
.toast{position:fixed;left:50%;bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom,0px) + 16px);transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-size:14.5px;opacity:0;pointer-events:none;transition:all .25s;z-index:80;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom,0px) + 18px)}
.sheet p{margin:8px 0 16px;color:var(--ink2)}
.sheet .row-gap .btn{flex:1}

@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}

.back svg{width:20px;height:20px;flex:none}
.gantry i.pur{background:var(--purple);box-shadow:0 0 10px var(--purple)}
.full .toast{top:calc(env(safe-area-inset-top,0px) + 12px);bottom:auto;transform:translateX(-50%) translateY(-20px)}
.full .toast.show{transform:translateX(-50%) translateY(0)}

.typing .tabbar{display:none}

.has-ai-only{display:none!important}
.has-ai .has-ai-only{display:inline-flex!important}
code{font-size:12.5px;background:var(--surface2);padding:1px 5px;border-radius:5px;word-break:break-all}
details>summary{cursor:pointer;font-weight:600;color:var(--ink2)}
.call .round{margin:0 auto}
.call .controls>div:last-child{display:flex;justify-content:center}
.li .grow .en{display:block;color:var(--muted)}
.summary h2{font-size:24px}

</style>
</head>

function hash(s){ let h=2166136261>>>0; for (let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619)>>>0; } return h.toString(36); }

function buildCatalog(C, custom){
  const cards = [];

  for (const [id,verb,subj,obj,cue,k,zh,en] of C.T_CARDS){ const a=splitAlts(en); cards.push({id,t:"t",tag:"tense",verb,subj,obj,cue,k,zh,en:a[0],alt:a.slice(1),note:TENSE_NOTE[k]||""}); }
  for (const [id,tag,wrong,en,note] of C.F_CARDS){ const a=splitAlts(en); cards.push({id,t:"f",tag,wrong,en:a[0],alt:a.slice(1),note}); }
  for (const e of C.E_CARDS){
    const steps = e.steps.map(([add,hint,en])=>{ const a=splitAlts(en); return {add,hint,en:a[0],alt:a.slice(1)}; });
    cards.push({id:e.id,t:"e",tag:e.tag,base:e.base,steps,en:steps[steps.length-1].en,alt:steps[steps.length-1].alt,note:"先说“I + 动词”，细节一块一块往后加。"});
  }
  for (const [id,grp,en,zh] of C.L_CARDS) cards.push({id,t:"l",tag:"listen",grp,en,zh});
  for (const c of (custom||[])) cards.push(Object.assign({}, c, {custom:true}));

}

/* ---------- 间隔重复（分盒法） ---------- */
const INTERVALS = [0,1,2,4,7,15,30,60,120];
const MASTERED_BOX = 5;
function srsRate(p, r, tn){
  p = p ? Object.assign({}, p) : {box:0,due:tn,n:0,ok:0,lapses:0};
  if (r === "again"){ p.box = 1; p.due = tn+1; p.lapses = (p.lapses||0)+1; }
  else if (r === "hard"){ p.box = Math.max(1,p.box); p.due = tn + Math.max(1, Math.ceil(INTERVALS[p.box]/2)); }
  else { p.box = p.box===0 ? 2 : Math.min(8, p.box+1); p.due = tn + INTERVALS[p.box]; }
  p.n = (p.n||0)+1; if (r !== "again") p.ok = (p.ok||0)+1; p.last = tn;
  return p;
}

const ORD = {"1st":"first","2nd":"second","3rd":"third","4th":"fourth","5th":"fifth","6th":"sixth","7th":"seventh","8th":"eighth","9th":"ninth","10th":"tenth"};
const NUMW = {0:"zero",1:"one",2:"two",3:"three",4:"four",5:"five",6:"six",7:"seven",8:"eight",9:"nine",10:"ten",11:"eleven",12:"twelve",
  13:"thirteen",14:"fourteen",15:"fifteen",16:"sixteen",17:"seventeen",18:"eighteen",19:"nineteen",20:"twenty",30:"thirty",
  40:"forty",50:"fifty",60:"sixty",70:"seventy",80:"eighty",90:"ninety"};
const FILLER = new Set(["um","uh","erm","er","hmm","mm","ah","uhm"]);
const BE = new Set(["am","is","are","was","were","be","been"]);

function tokens(s, isUser){
  s = String(s||"").toLowerCase().replace(/[’‘`´]/g,"'").replace(/%/g," percent ").replace(/&/g," and ").replace(/(\d),(\d{3})/g,"$1$2");
  const raw = s.match(/[a-z0-9]+(?:'[a-z]+)?/g) || [];
  const out = [];
  for (let w of raw){
    if (isUser && FILLER.has(w)) continue;
    if (CONTR[w]) { out.push(...CONTR[w].split(" ")); continue; }
    if (ORD[w]) { out.push(ORD[w]); continue; }
    if (/^\d+$/.test(w) && NUMW[+w]) { out.push(NUMW[+w]); continue; }
    if (w === "okay") w = "ok";
    if (/'s$/.test(w)) w = w.replace("'", "");
    out.push(w);
  }
  return out;
}

function lcsOps(a, b){
  const n=a.length, m=b.length;
  const dp = []; for (let i=0;i<=n;i++) dp.push(new Uint16Array(m+1));
  for (let i=n-1;i>=0;i--) for (let j=m-1;j>=0;j--) dp[i][j] = a[i]===b[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j], dp[i][j+1]);
  const ops = []; let i=0, j=0;
  while (i<n && j<m){
    if (a[i]===b[j]) { ops.push({op:"eq",a:a[i],b:b[j]}); i++; j++; }
    else if (dp[i+1][j] >= dp[i][j+1]) { ops.push({op:"del",a:a[i]}); i++; }
    else { ops.push({op:"ins",b:b[j]}); j++; }
  }
  while (i<n) ops.push({op:"del",a:a[i++]});
  while (j<m) ops.push({op:"ins",b:b[j++]});
  const out = [];
  for (let k=0;k<ops.length;k++){
    const o=ops[k], nx=ops[k+1];
    if (o.op==="del" && nx && nx.op==="ins") { out.push({op:"sub",a:o.a,b:nx.b}); k++; }
    else if (o.op==="ins" && nx && nx.op==="del") { out.push({op:"sub",a:nx.a,b:o.b}); k++; }
    else out.push(o);
  }
  return {ops: out, lcs: dp[0][0]};
}

const IRR = {be:["was","been"],become:["became","become"],begin:["began","begun"],break:["broke","broken"],bring:["brought","brought"],
  build:["built","built"],buy:["bought","bought"],catch:["caught","caught"],choose:["chose","chosen"],come:["came","come"],cut:["cut","cut"],
  do:["did","done"],drink:["drank","drunk"],drive:["drove","driven"],eat:["ate","eaten"],fall:["fell","fallen"],feel:["felt","felt"],
  find:["found","found"],fly:["flew","flown"],forget:["forgot","forgotten"],get:["got","gotten"],give:["gave","given"],go:["went","gone"],
  grow:["grew","grown"],have:["had","had"],hear:["heard","heard"],hit:["hit","hit"],hold:["held","held"],keep:["kept","kept"],
  know:["knew","known"],lead:["led","led"],leave:["left","left"],lend:["lent","lent"],let:["let","let"],lie:["lay","lain"],
  lose:["lost","lost"],make:["made","made"],meet:["met","met"],pay:["paid","paid"],put:["put","put"],read:["read","read"],
  ride:["rode","ridden"],run:["ran","run"],say:["said","said"],see:["saw","seen"],sell:["sold","sold"],send:["sent","sent"],
  set:["set","set"],sing:["sang","sung"],sit:["sat","sat"],sleep:["slept","slept"],speak:["spoke","spoken"],spend:["spent","spent"],
  stand:["stood","stood"],swim:["swam","swum"],take:["took","taken"],teach:["taught","taught"],tell:["told","told"],
  think:["thought","thought"],understand:["understood","understood"],wake:["woke","woken"],wear:["wore","worn"],win:["won","won"],
  write:["wrote","written"]};
function regPast(v){
  if (/e$/.test(v)) return v+"d";
  if (/[^aeiou]y$/.test(v)) return v.slice(0,-1)+"ied";
  if (/^[^aeiou]*[aeiou][^aeiouwxy]$/.test(v)) return v+v.slice(-1)+"ed";
  return v+"ed";
}
function pastOf(v){ return IRR[v] ? IRR[v][0] : regPast(v); }
function lev(a,b){
  const m=a.length,n=b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({length:n+1},(_,i)=>i);
  for (let i=1;i<=m;i++){ const cur=[i]; for (let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev=cur; }
  return prev[n];
}
function classifySub(a, b){ // a = 参考答案里的词，b = 你说的词
  if (a===b+"s" || a===b+"es" || b===a+"s" || b===a+"es" || (a.endsWith("ies") && b===a.slice(0,-3)+"y") || (b.endsWith("ies") && a===b.slice(0,-3)+"y")) return "s";
  if (pastOf(b)===a || (IRR[b] && IRR[b][1]===a)) return "past";
  if (BE.has(a) && BE.has(b)) return "be";
  if ((a==="have"||a==="has") && BE.has(b)) return "perf";
  if (Math.abs(a.length-b.length)<=2 && a[0]===b[0] && lev(a,b)<=2) return "pron";
  return "word";
}
function compareSaid(target, alts, said){
  const ut = tokens(said, true);
  let best = null;
  for (const c of [target].concat(alts||[])){
    const tt = tokens(c, false);
    const {ops, lcs} = lcsOps(tt, ut);
    const denom = Math.max(tt.length, ut.length);
    const score = denom ? lcs/denom : 1;
    if (!best || score > best.score) best = {text:c, ops, score};
  }
  best.exact = best.score === 1;
  best.level = best.exact ? "exact" : best.score >= 0.8 ? "close" : "off";
  best.notes = feedbackNotes(best.ops);
  return best;
}
function feedbackNotes(ops){
  const notes = [];
  for (const o of ops){
    if (o.op === "sub"){
      const k = classifySub(o.a, o.b);
      if (k === "past") notes.push({k:"tense", msg:`用过去式：${o.b} → ${o.a}`});
      else if (k === "s") notes.push({k:"plural", msg:`注意词尾 -s：${o.b} → ${o.a}`});
      else if (k === "be") notes.push({k:"be", msg:`be 动词用 ${o.a}，不是 ${o.b}`});
      else if (k === "perf") notes.push({k:"tense", msg:`完成时用 have（I've），不是 ${o.b}`});
      else if (k === "pron") notes.push({k:"pron", msg:`听起来像 ${o.b}，目标是 ${o.a}，可能是发音`});
      else notes.push({k:"word", msg:`这里是 ${o.a}（你说的是 ${o.b}）`});
    } else if (o.op === "del"){
      notes.push(BE.has(o.a) ? {k:"be", msg:`漏了 be 动词：${o.a}`} : {k:"miss", msg:`漏了：${o.a}`});
    } else if (o.op === "ins"){
      notes.push(o.b === "to" ? {k:"to", msg:"多了一个 to"} : {k:"extra", msg:`多了：${o.b}`});
    }
  }
  return notes.slice(0,4);
}
/* 只给提示、不给答案：让你自己改一次（研究里叫 prompt，比直接给正确答案更能促进学习） */
function hintNotes(ops){
  const out = []; let prev = "";
  for (const o of ops){
    if (o.op === "eq"){ prev = o.b; continue; }
    if (o.op === "sub"){
      const k = classifySub(o.a, o.b);
      out.push(k === "past" ? `${o.b} 要换成过去式` : k === "s" ? `注意 ${o.b} 的词尾 -s` : k === "be" ? `be 动词 ${o.b} 用得不对` :
        k === "perf" ? `这里要用完成时 have，不是 ${o.b}` : k === "pron" ? `${o.b} 可能没说清楚，注意发音` : `${o.b} 这个词不对`);
      prev = o.b;
    } else if (o.op === "del"){
      out.push(BE.has(o.a) ? (prev ? `${prev} 后面漏了 be 动词` : "开头漏了 be 动词") : (prev ? `${prev} 后面漏了一个词` : "开头漏了一个词"));
    } else if (o.op === "ins"){
      out.push(o.b === "to" ? "多了一个 to" : `${o.b} 是多出来的`);
    }
  }
  return [...new Set(out)].slice(0, 3);
}

function parseImport(text){
  const res = {cards:[], answers:[], keys:[], bad:[]};
  const lines = String(text||"").split(/\r?\n/);
  lines.forEach((line, i) => {
    const s = line.trim();
    if (!s || s.startsWith("#")) return;
    const p = s.split(/\s*[|｜]\s*/);
    const kind = p[0];
    if ((kind==="卡"||kind==="R") && p[1] && p[2]){
      const a = splitAlts(p[2]);
      res.cards.push({t:"r", zh:p[1], en:a[0], alt:a.slice(1), tag:tagKey(p[3]), note:p[4]||""});
    } else if ((kind==="改"||kind==="F") && p[1] && p[2]){
      const a = splitAlts(p[2]);
      res.cards.push({t:"f", wrong:p[1], en:a[0], alt:a.slice(1), tag:tagKey(p[3]), note:p[4]||""});
    } else if ((kind==="听"||kind==="L") && p[1] && p[2]){
      res.cards.push({t:"l", grp:"cs", en:p[1], zh:p[2], tag:"listen"});
    } else if ((kind==="答"||kind==="A") && p[1] && p[2]){

function checkWriting(text){

      const g = r.g ? m[r.g] : m[0];
      if (g == null) { if (m[0]==="") r.re.lastIndex++; continue; }
      const start = m.index + m[0].indexOf(g);
      issues.push({start, end:start+g.length, text:g, tag:r.tag, msg:r.msg(g)});
      if (m[0]==="") r.re.lastIndex++;
    }
  }
  for (const w of text.matchAll(/[A-Za-z]+/g)){
    const fix = MISSPELL[w[0].toLowerCase()];
    if (fix) issues.push({start:w.index, end:w.index+w[0].length, text:w[0], tag:"拼写", msg:`拼写：${w[0]} → ${fix}`});
  }
  const sentRe = /[^.!?。！？\n]+[.!?。！？]*/g; let s;

      const b = /\bbut\b/i.exec(seg);
      if (b) issues.push({start:off+b.index, end:off+b.index+3, text:b[0], tag:"成对词", msg:"although 和 but 只留一个"});
    }
    if (/\bbecause\b/i.test(seg)){
      const so = /,\s*(so)\b/i.exec(seg) || /\b(so)\s+(?:i|we|you|he|she|they|it|my|the|that|this|there|usually)\b/i.exec(seg);
      if (so){ const st = off + so.index + so[0].toLowerCase().indexOf("so"); issues.push({start:st, end:st+2, text:"so", tag:"成对词", msg:"because 和 so 只留一个"}); }
    }
  }
  issues.sort((a,b)=>a.start-b.start || b.end-a.end);
  const seen = new Set(); const out = [];
  for (const it of issues){ const k = it.start+":"+it.msg; if (seen.has(k)) continue; seen.add(k); out.push(it); }
  return out;
}

      out.push({start:st, end:st+m[3].length, text:m[3], tag:"时态", msg:`讲今天的事用过去式：${m[3]} → ${pastOf(base)}（说的是习惯或现在就忽略）`});

function dayDone(days, d){ const x = days[d]; return !!x && ((x.sec||0) >= 60 || (x.cards||0) >= 3); }
function computeStreak(days, todayS){
  const n = dnum(todayS); const todayDone = dayDone(days, todayS);
  let cur = todayDone ? n : n-1, streak = 0, lastFreeze = null; const freezes = [];
  for (let guard=0; guard<3000; guard++){

    if (dayDone(days, nstr(cur-1)) && (lastFreeze===null || lastFreeze-cur >= 7)) { freezes.push(ds); lastFreeze = cur; cur--; continue; }

const SESSION_CFG = {quick:{warm:0,core:8,lis:0,iv:0,maxE:1}, std:{warm:4,core:16,lis:3,iv:1,maxE:2}, deep:{warm:5,core:30,lis:6,iv:2,maxE:3},
  free:{warm:0,core:15,lis:0,iv:0,maxE:3}, listen:{warm:0,core:0,lis:8,iv:0,maxE:0}};
function buildSession(kind, ctx){
  const cfg = ctx.cfg || SESSION_CFG[kind] || SESSION_CFG.std;
  const {cat, prog, todayN} = ctx; const rnd = ctx.rnd || Math.random;
  const filter = ctx.filter || (()=>true);
  const core = cat.cards.filter(c=>c.t!=="l" && filter(c));
  const lis = cat.cards.filter(c=>c.t==="l");
  const isDue = c => !!prog[c.id] && prog[c.id].due <= todayN;
  const isNew = c => !prog[c.id];
  const acc = ctx.acc || {};
  const weak = tag => {
    let w = (TAGS[tag]||TAGS.other).w;
    if (ctx.mode==="interview" && (tag==="interview"||tag==="rescue")) w *= 1.35;
    if (ctx.mode==="daily" && (tag==="chat"||tag==="colloc")) w *= 1.3;
    const a = acc[tag]; const r = a && a[0] >= 5 ? a[1]/a[0] : 0.65;
    return w * (1.25 - r);
  };
  const picked = new Set(); let newLeft = Math.max(0, (ctx.newLimit||12) - (ctx.newUsed||0)); let eCount = 0;
  const take = (arr, k, countNew) => {
    const out = [];
    for (const c of arr){
      if (out.length >= k) break;
      if (picked.has(c.id)) continue;
      if (c.t === "e" && eCount >= cfg.maxE) continue;
      if (isNew(c) && countNew){ if (newLeft <= 0) continue; newLeft--; }
      picked.add(c.id); if (c.t==="e") eCount++; out.push(c);
    }
    return out;
  };
  const beCards = core.filter(c=>c.t==="r" && c.tag==="be");
  const warm = take([...beCards.filter(isDue), ...beCards.filter(isNew), ...shuffle(beCards.filter(c=>!isNew(c)&&!isDue(c)), rnd)], cfg.warm, true);
  const due = core.filter(isDue).sort((a,b)=>(prog[a.id].due-prog[b.id].due) || (weak(b.tag)-weak(a.tag)));
  let main = take(due, cfg.core, true);
  if (main.length < cfg.core){
    const fresh = core.filter(isNew).map((c,i)=>({c, s:weak(c.tag)+(c.custom?0.3:0)-i*0.0004})).sort((a,b)=>b.s-a.s).map(x=>x.c);

    main = main.concat(take(ahead, minCore-main.length, false));

  const L = take(lisPool, cfg.lis, false);

}
function diversify(list){
  const groups = new Map();
  for (const c of list){ const k = c.t+":"+c.tag; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(c); }

    if (idx < 0) idx = 0;
    out.push(rest.splice(idx,1)[0]);

}

function dayRec(d){ d = d || today(); return S.days[d] || (S.days[d] = {sec:0, cards:0, ok:0, ms:0, mn:0}); }
function newUsedToday(){ return S.newToday.d === today() ? S.newToday.n : 0; }
function interviewMode(){
  const d = S.settings.interviewDate; if (!d) return "daily";
  const left = dnum(d) - dnum(today());
  return left >= 0 && left <= 21 ? "interview" : "daily";
}
function ivDaysLeft(){ const d = S.settings.interviewDate; if (!d) return null; const left = dnum(d) - dnum(today()); return left >= 0 ? left : null; }
function rateCard(card, r, ms, opts){
  opts = opts || {};
  const tn = dnum(today());
  let pb = false;
  if (!opts.retry){
    if (!S.cards[card.id]){ if (S.newToday.d !== today()) S.newToday = {d:today(), n:0}; S.newToday.n++; }
    S.cards[card.id] = K.srsRate(S.cards[card.id], r, tn);
    const day = dayRec(); day.cards++; if (r !== "again") day.ok++;
    const tg = S.tags[today()] || (S.tags[today()] = {}); const t = tg[card.tag] || (tg[card.tag] = [0,0]); t[0]++; if (r !== "again") t[1]++;
    if (ms && r !== "again" && ms < 60000){
      day.ms = (day.ms||0) + ms; day.mn = (day.mn||0) + 1;
      const b = S.best[card.id];
      if (!b || ms < b){ pb = !!b; S.best[card.id] = ms; }
    }
  } else { dayRec().cards++; }
  save();
  return {pb};
}

/* ---------- 练习时长 ---------- */
const Act = {
  on:false, keep:false, last:0, timer:null,
  start(keep){ this.on = true; this.keep = !!keep; this.last = Date.now(); clearInterval(this.timer); this.timer = setInterval(()=>this.tick(), 5000); },
  stop(){ this.on = false; this.keep = false; clearInterval(this.timer); this.timer = null; },
  poke(){ this.last = Date.now(); },
  tick(){
    if (!this.on || document.visibilityState === "hidden") return;
    if (this.keep || Date.now() - this.last < 90000){ dayRec().sec += 5; save(); }
  }
};

/* ---------- 朗读 ---------- */
const TTS = {
  ok: "speechSynthesis" in window && typeof SpeechSynthesisUtterance !== "undefined",
  voices: [], keep: new Set(),
  init(){
    if (!this.ok) return;
    const load = () => { try { this.voices = speechSynthesis.getVoices() || []; } catch (e) { this.voices = []; } };
    load(); try { speechSynthesis.addEventListener("voiceschanged", load); } catch (e) { speechSynthesis.onvoiceschanged = load; }
    setTimeout(load, 800); setTimeout(load, 2500);
  },
  norm(l){ return String(l||"").replace("_","-").toLowerCase(); },
  list(lang){ return this.voices.filter(v => this.norm(v.lang).startsWith(lang)); },
  voice(lang){
    const pref = lang === "zh" ? L.zhVoice : L.enVoice;
    const pool = this.list(lang);
    if (pref){ const v = pool.find(v => v.name === pref); if (v) return v; }
    if (lang === "en") return pool.find(v=>this.norm(v.lang)==="en-us" && /google|natural|enhanced|neural/i.test(v.name)) || pool.find(v=>this.norm(v.lang)==="en-us") || pool[0] || null;
    return pool.find(v=>/zh-cn|cmn/.test(this.norm(v.lang))) || pool.find(v=>!/hk|tw/.test(this.norm(v.lang))) || pool[0] || null;
  },
  hasZh(){ return this.list("zh").length > 0; },
  cancel(){ if (this.ok) try { speechSynthesis.cancel(); } catch (e) {} },
  speak(text, o){
    o = o || {};
    const lang = o.lang || "en";
    return new Promise(res => {
      if (!this.ok || !text){ res(false); return; }
      this.cancel();
      const u = new SpeechSynthesisUtterance(text);
      const v = o.voice || this.voice(lang);
      u.lang = lang === "zh" ? "zh-CN" : "en-US";
      if (v){ try { u.voice = v; u.lang = v.lang; } catch (e) {} }
      u.rate = Math.max(0.5, Math.min(1.6, (o.rate || 1) * (lang === "en" ? (L.rate || 0.95) : 1)));
      let done = false;
      const fin = ok => { if (done) return; done = true; clearTimeout(tm); this.keep.delete(u); res(ok); };
      u.onend = () => fin(true); u.onerror = () => fin(false);
      this.keep.add(u);
      const est = 1500 + text.length * (lang === "zh" ? 260 : 85) / u.rate;
      const tm = setTimeout(() => fin(true), est + 4000);
      setTimeout(() => { try { speechSynthesis.speak(u); } catch (e) { fin(false); } }, 60);
    });
  }
};

/* ---------- 语音识别 ---------- */
const SR = {
  Ctor: window.SpeechRecognition || window.webkitSpeechRecognition || null,
  cur: null, local: false, netFail: false, broken: false, fails: 0,
  get ok(){ return !!this.Ctor; },
  usable(){ return this.ok && !MIC.blocked && !this.broken && S.settings.inputMode === "auto" && !(this.netFail && !this.local && !navigator.onLine); },
  async checkLocal(){
    const C = window.SpeechRecognition || this.Ctor;
    if (!C || typeof C.available !== "function") return "none";
    try { const r = await C.available({langs:["en-US"], processLocally:true}); this.local = r === "available"; L.device = L.device || {}; L.device.local = r; saveLocal(); return r; } catch (e) { return "none"; }
  },
  async installLocal(){
    const C = window.SpeechRecognition || this.Ctor;
    if (!C || typeof C.install !== "function") return false;
    try { const ok = await C.install({langs:["en-US"], processLocally:true}); if (ok){ this.local = true; L.device = L.device || {}; L.device.local = "available"; saveLocal(); } return ok; } catch (e) { return false; }
  },
  abort(){ if (this.cur){ this.cur._ours = true; try { this.cur.abort(); } catch (e) {} this.cur = null; } },
  listen(o){
    o = o || {};
    this.abort(); TTS.cancel();
    return new Promise(res => {
      if (!this.Ctor){ res({text:"", error:"unsupported"}); return; }
      let r;
      try { r = new this.Ctor(); } catch (e) { res({text:"", error:"unsupported"}); return; }
      this.cur = r;
      r.lang = "en-US"; r.interimResults = true; r.continuous = false; r.maxAlternatives = 1;
      if (this.local) try { r.processLocally = true; } catch (e) {}
      let finals = "", interim = "", err = null, ended = false;
      const t0 = performance.now(); let tStart = 0;
      r.onspeechstart = () => { if (!tStart) tStart = performance.now(); o.onStart && o.onStart(); };
      r.onresult = e => {
        const fins = []; interim = "";
        for (let i = 0; i < e.results.length; i++){ const tx = String(e.results[i][0].transcript || "").trim(); if (!tx) continue; if (e.results[i].isFinal) fins.push(tx); else interim += (interim ? " " : "") + tx; }
        finals = fins.join(" ");
        if (fins.length > 1){ const longest = fins.reduce((a, b) => b.length > a.length ? b : a); if (fins.every(f => longest.toLowerCase().includes(f.toLowerCase()))) finals = longest; }
        o.onInterim && o.onInterim((finals + " " + interim).trim());
      };
      r.onerror = e => { err = e.error || "error"; if (err === "network") this.netFail = true; if (err === "aborted" && r._ours) err = null; else MIC.note(err); };
      const finish = () => { if (ended) return; ended = true; clearTimeout(guard); if (this.cur === r) this.cur = null; const text = (finals || interim).trim();
        /* 不是我们自己取消的 aborted：手机的识别服务拒绝了。用了本机识别就先关掉重试一次；连续两次就改用键盘语音输入 */
        if (err === "aborted" && !text){
          if (r.processLocally && !o._retry){ this.local = false; L.device = L.device || {}; L.device.local = "failed"; saveLocal(); res(this.listen(Object.assign({}, o, {_retry:true}))); return; }
          this.fails++;
          if (this.fails >= 2){ this.broken = true; L.device = L.device || {}; L.device.srBroken = true; L.device.sr = "no"; saveLocal(); }
        } else if (text) this.fails = 0;
        res({text, error:err, startMs: tStart ? tStart - t0 : 0, broke: this.broken}); };
      r.onend = finish;
      const guard = setTimeout(() => { try { r.stop(); } catch (e) {} setTimeout(finish, 600); }, o.maxMs || 12000);
      try { r.start(); } catch (e) { err = "start"; finish(); }
    });
  },
  stop(){ if (this.cur){ this.cur._ours = true; try { this.cur.stop(); } catch (e) {} } }
};
function srErrorText(err){
  if (MIC.blocked) return "这个版本用不了麦克风，和你的手机设置无关。点输入框，用键盘上的麦克风说";

    "no-speech":"没听到声音，再点一次麦克风", "audio-capture":"麦克风不可用", "unsupported":"这个浏览器不支持自动识别",

/* ---------- 录音 ---------- */
const Rec = {
  stream:null, mr:null, chunks:[], t0:0, ctx:null, raf:0, lvlEl:null,
  get ok(){ return !MIC.blocked && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder); },
  async start(lvlEl){
    this.cancel();
    if (!this.ok) throw new Error("unsupported");
    try { this.stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true}}); } catch (e) { MIC.note(e && e.name); throw e; }
    const types = ["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/ogg;codecs=opus"];
    const mt = types.find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t));
    this.mr = new MediaRecorder(this.stream, mt ? {mimeType:mt} : undefined);
    this.chunks = [];
    this.mr.ondataavailable = e => { if (e.data && e.data.size) this.chunks.push(e.data); };
    this.mr.start(250); this.t0 = Date.now();
    this.lvlEl = lvlEl || null;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC(); const src = this.ctx.createMediaStreamSource(this.stream); const an = this.ctx.createAnalyser(); an.fftSize = 512; src.connect(an);
      const buf = new Uint8Array(an.fftSize);
      const loop = () => { an.getByteTimeDomainData(buf); let s = 0; for (let i = 0; i < buf.length; i++){ const v = (buf[i]-128)/128; s += v*v; }
        const rms = Math.min(1, Math.sqrt(s/buf.length) * 4); if (this.lvlEl && this.lvlEl.isConnected) this.lvlEl.style.setProperty("--lvl", rms.toFixed(2)); this.raf = requestAnimationFrame(loop); };
      loop();
    } catch (e) {}
  },
  stop(){
    return new Promise(res => {
      const mr = this.mr;
      if (!mr){ res(null); return; }
      const ms = Date.now() - this.t0;
      mr.onstop = () => { const blob = new Blob(this.chunks, {type: mr.mimeType || "audio/webm"}); this.release(); res({blob, ms}); };
      try { mr.stop(); } catch (e) { this.release(); res(null); }
    });
  },
  cancel(){ if (this.mr){ try { this.mr.onstop = null; this.mr.stop(); } catch (e) {} } this.release(); },
  release(){
    cancelAnimationFrame(this.raf);
    if (this.stream) this.stream.getTracks().forEach(t => t.stop());
    if (this.ctx) try { this.ctx.close(); } catch (e) {}
    this.stream = null; this.mr = null; this.ctx = null; this.lvlEl = null;
  }
};
const IDB = {
  db:null, mem:new Map(),
  open(){
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      try {
        const r = indexedDB.open("tuokou", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("audio");
        r.onsuccess = () => { this.db = r.result; res(this.db); };
        r.onerror = () => rej(r.error);
      } catch (e) { rej(e); }
    });
  },
  async put(k, v){ try { const db = await this.open(); await new Promise((res, rej) => { const tx = db.transaction("audio","readwrite"); tx.objectStore("audio").put(v, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); } catch (e) { this.mem.set(k, v); } },
  async get(k){ try { const db = await this.open(); return await new Promise((res, rej) => { const q = db.transaction("audio").objectStore("audio").get(k); q.onsuccess = () => res(q.result || this.mem.get(k) || null); q.onerror = () => rej(q.error); }); } catch (e) { return this.mem.get(k) || null; } },
  async del(k){ this.mem.delete(k); try { const db = await this.open(); db.transaction("audio","readwrite").objectStore("audio").delete(k); } catch (e) {} }
};

  async on(){ this.want = true; try { if (navigator.wakeLock) this.lock = await navigator.wakeLock.request("screen"); } catch (e) {} },

const Snd = {
  ctx:null,
  beep(f, d, type, vol){
    if (!S.settings.sound) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = this.ctx || new AC();
      if (this.ctx.state === "suspended") this.ctx.resume();
      const o = this.ctx.createOscillator(), g = this.ctx.createGain(), t = this.ctx.currentTime;
      o.type = type || "sine"; o.frequency.value = f; g.gain.setValueAtTime(vol || 0.06, t); g.gain.exponentialRampToValueAtTime(0.0001, t + (d || 0.08));
      o.connect(g); g.connect(this.ctx.destination); o.start(t); o.stop(t + (d || 0.08) + 0.02);
    } catch (e) {}
  },
  light(){ this.beep(520, 0.05, "sine", 0.03); },
  go(){ this.beep(1046, 0.1, "sine", 0.05); },
  good(){ this.beep(784, 0.08); setTimeout(() => this.beep(1175, 0.11), 80); },
  pb(){ [988, 1319, 1760].forEach((f, i) => setTimeout(() => this.beep(f, 0.09, "triangle", 0.06), i * 85)); },
  bad(){ this.beep(196, 0.16, "square", 0.025); },
  ring(){ [0, 160].forEach(d => setTimeout(() => { this.beep(1318, 0.12, "sine", 0.05); this.beep(1046, 0.12, "sine", 0.04); }, d)); }
};

/* ---------- 云同步（claude.ai 版） ---------- */
const Cloud = {
  db:null, uid:null, on:false, timer:null, last:{},
  async init(){
    try {
      if (!window.claude || typeof window.claude.use !== "function") return;
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (!db || !user) return;
      const uid = await user.id(); if (!uid) return;
      this.db = db; this.uid = uid;
      const base = "data/users/" + uid + "/";
      const snaps = await Promise.all(["state","stats","journal"].map(k => db.doc(base + k).get().catch(() => null)));
      const remote = {};
      snaps.forEach(s => { if (s && s.exists){ const d = s.data(); if (d) Object.assign(remote, JSON.parse(JSON.stringify(d))); } });
      this.on = true;
      if (remote.v === 1 && remote.updatedAt && remote.updatedAt > (S.updatedAt || 0)){
        S = mergeInto(DEF(), remote); rebuildCatalog(); applyTheme(); save(true); UI.refresh(); toast("已从云端读取你的进度");
      } else this.push();
    } catch (e) { console.warn("cloud init", e); }
  },
  schedule(){ if (!this.on) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.push(), 4000); },
  async push(){
    if (!this.db) return;
    const base = "data/users/" + this.uid + "/";
    const parts = {
      state:{v:S.v, createdAt:S.createdAt, updatedAt:S.updatedAt, settings:S.settings, cards:S.cards, best:S.best, custom:S.custom, answers:S.answers, newToday:S.newToday},
      stats:{updatedAt:S.updatedAt, days:S.days, tags:S.tags, calls:S.calls},
      journal:{updatedAt:S.updatedAt, journal:S.journal}
    };
    for (const k of Object.keys(parts)){
      const json = JSON.stringify(parts[k]);
      if (this.last[k] === json) continue;
      try { await this.db.doc(base + k).set(JSON.parse(json)); this.last[k] = json; } catch (e) { console.warn("cloud push", k, e && e.code); }
    }
  }
};

/* ---------- AI 批改（claude.ai 版） ---------- */
const AI = {
  fn:null, dl:null, off:false, ctl:null,
  async init(){
    try {
      if (!window.claude || typeof window.claude.use !== "function") return;
      const [s, d] = await Promise.all([window.claude.use("sample"), window.claude.use("downloads")]);
      this.fn = s || null; this.dl = d || null;
      if (this.fn) document.documentElement.classList.add("has-ai");
      if (this.dl) document.documentElement.classList.add("has-dl");
    } catch (e) {}
  },
  prompt(kind, text, extra){
    return `你是一位耐心的英语口语教练。学生是中文母语者，机械工程硕士已毕业，正在准备美国工程类岗位的电话面试，英语口语大约 A2–B1。
他最常见的错误：漏 be 动词（That cool → That's cool）；时态（讲过去的事用现在时；I'm graduated → I've graduated；用 will 表示习惯）；although…but、because…so 成对使用；多余的 to（spend time to do）；复数 -s；介词；中式搭配。
他的学习方法是：先只看错误和提示，自己改，再看参考改法。所以 hint 里不要直接给出改好的句子。
内容类型：${kind}
${extra ? extra + "\n" : ""}他写的（或说的）内容：
"""
${text.slice(0, 6000)}
"""
只回复一个 JSON 对象，不要别的文字：
{"issues":[{"quote":"原文里有问题的片段，逐字摘抄，尽量短","type":"时态|be 动词|成对词|多余的 to|复数|介词|搭配|语序|拼写|其他","hint":"中文提示：哪里不对、该怎么想，不直接给答案"}],"good":"一句中文：这段做得好的一点","better":"整段的参考改法（英文，尽量保留他的意思和用词，只改错误和明显不自然的地方）","tip":"一句中文：下次最值得注意的一点"}
没有错误时 issues 为空数组。issues 最多 8 个，按重要程度排序。`;
  },
  async review(kind, text, extra, out){
    if (!this.fn || this.off){ toast("这个版本用不了 AI 批改，可以复制给 Claude"); return; }
    text = String(text||"").trim();
    if (text.length < 8){ toast("先写几句英文"); return; }
    if (this.ctl) try { this.ctl.abort(); } catch (e) {}
    const ctl = this.ctl = new AbortController();
    out.innerHTML = `<div class="panel ai-out"><p class="muted">Claude 正在看，通常 10–40 秒……</p><button class="btn sm" data-act="ai-stop">停止</button></div>`;
    try {
      const res = await this.fn.json(this.prompt(kind, text, extra), {modelTier:"default", signal:ctl.signal});
      if (!out.isConnected) return;
      out.innerHTML = renderAI(text, res);
    } catch (e) {
      if (!out.isConnected) return;
      const code = e && e.code;
      if (code === "cancelled"){ out.innerHTML = ""; return; }
      if (["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(code)){
        this.off = true; document.documentElement.classList.remove("has-ai");
        out.innerHTML = `<div class="panel small">AI 批改没有开启。可以点“复制给 Claude”，粘贴到和 Claude 的对话里。</div>`; return;
      }
      const msg = code === "rate_limited" ? "用得太频繁了，过一会儿再试" : code === "invalid_json" ? "这次结果没读出来，再点一次试试" : "这次没成功，检查网络后再试";
      out.innerHTML = `<div class="panel small">${msg}</div>`;
    } finally { if (this.ctl === ctl) this.ctl = null; }
  },
  stop(){ if (this.ctl) try { this.ctl.abort(); } catch (e) {} }
};
function renderAI(text, res){
  const issues = Array.isArray(res && res.issues) ? res.issues.slice(0, 8) : [];
  const marks = [];
  const low = text.toLowerCase();
  issues.forEach((it, i) => { const q = String(it.quote||"").trim(); if (!q) return; const at = low.indexOf(q.toLowerCase()); if (at >= 0) marks.push({start:at, end:at+q.length, n:i+1}); });
  let html = "";
  if (issues.length){
    html += `<div class="marked">${markText(text, marks)}</div><ol class="issues">${issues.map(it => `<li><b>${esc(it.type||"")}</b>　${esc(it.hint||"")}</li>`).join("")}</ol>`;
  } else html += `<p class="verdict exact">没发现明显的错误</p>`;
  if (res && res.good) html += `<p class="note">做得好：${esc(res.good)}</p>`;
  if (res && res.tip) html += `<p class="note">下次注意：${esc(res.tip)}</p>`;
  if (res && res.better) html += `<details style="margin-top:10px"><summary>自己改完再看：参考改法</summary><div class="better">${esc(res.better)}</div></details>`;
  return `<div class="panel ai-out">${html}</div>`;
}
function markText(text, marks){
  marks = marks.slice().sort((a,b) => a.start - b.start);
  let out = "", pos = 0;
  for (const m of marks){ if (m.start < pos) continue; out += esc(text.slice(pos, m.start)) + `<mark>${esc(text.slice(m.start, m.end))}<sup>${m.n}</sup></mark>`; pos = m.end; }
  return out + esc(text.slice(pos));
}

/* ---------- 小工具 ---------- */
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]); }
function fmtSec(ms){ const s = Math.round(ms/1000); return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); }
function fmt1(ms){ return (ms/1000).toFixed(1); }
const sleep = ms => new Promise(r => setTimeout(r, ms));
let toastTimer = null;
function toast(msg){ const t = $("#toast"); if (!t) return; t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2600); }
function sheet(title, text, ok, danger){
  return new Promise(res => {
    const bg = document.createElement("div"); bg.className = "sheet-bg";
    bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><h3>${esc(title)}</h3><p>${esc(text)}</p><div class="row-gap"><button class="btn" data-x="0">取消</button><button class="btn ${danger ? "danger" : "primary"}" data-x="1">${esc(ok)}</button></div></div>`;
    bg.addEventListener("click", e => { const b = e.target.closest("[data-x]"); if (b || e.target === bg){ bg.remove(); res(!!(b && b.dataset.x === "1")); } });
    document.body.appendChild(bg);
  });
}
async function copyText(text){
  try { if (navigator.clipboard && navigator.clipboard.writeText){ await navigator.clipboard.writeText(text); return true; } } catch (e) {}
  try { const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); const ok = document.execCommand("copy"); ta.remove(); return ok; } catch (e) { return false; }
}
async function sendToClaude(text){
  const ok = await copyText(text);
  if (ok){ toast("已复制。打开 Claude 里这个项目的对话，粘贴发送"); return; }
  if (navigator.share && !IN_FRAME){ try { await navigator.share({text}); return; } catch (e) { if (e && e.name === "AbortError") return; } }
  toast("复制没成功，长按文字手动复制");
}
function claudePrompt(kind, text, extra){
  return `请帮我看看这段英文（${kind}）。只标出错误、给提示，不要直接改写；我自己改完再给我参考改法。${extra ? "\n" + extra : ""}\n最后，把值得反复练的句子做成脱口的导入码（格式：卡 | 中文 | 英文 | 类型 | 提示），我导回 app 复习。\n\n${text}`;
}
async function saveFile(name, text){
  if (AI.dl){ try { await AI.dl.save({filename:name, data:text}); return true; } catch (e) { if (e && e.code === "declined") return false; } }
  if (!IN_FRAME){ try { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], {type:"application/json"})); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); return true; } catch (e) {} }
  toast("这里不能直接存文件，请用“复制备份”"); return false;
}
function lamps(n){ return "<i></i>".repeat(n || 5); }
function runLights(el, each, hold, silent){
  each = each || 180; hold = hold || 220;
  return new Promise(res => {
    if (!el || !S.settings.lights || REDUCED){ res(); return; }
    const is = $$("i", el); let k = 0;
    const tick = () => {
      if (!el.isConnected){ res(); return; }
      if (k < is.length){ is[k].classList.add("on"); if (!silent) Snd.light(); k++; setTimeout(tick, each); }
      else setTimeout(() => { is.forEach(i => i.classList.remove("on")); if (!silent) Snd.go(); res(); }, hold);
    };
    tick();
  });
}

"use strict";
const VIEWS = {};
const ACT = {};
const UI = {
  stack: [],
  root: null,
  top(){ return this.stack[this.stack.length-1]; },
  leave(){
    const e = this.top(); const v = e && VIEWS[e.name];
    if (v && v.leave) try { v.leave(e.params); } catch (err) { console.warn(err); }
    TTS.cancel(); SR.abort(); Rec.cancel(); Wake.off(); Act.stop(); AI.stop();
  },
  render(){
    const e = this.top(); const v = VIEWS[e.name] || VIEWS.home;
    document.body.classList.toggle("full", !!v.full);
    this.root.innerHTML = v.render(e.params || {});
    $$(".tabbar button").forEach(b => b.setAttribute("aria-current", b.dataset.v === v.tab ? "page" : "false"));
    window.scrollTo(0, 0);
    if (v.mount) try { v.mount(e.params || {}); } catch (err) { console.error(err); }
  },
  refresh(){ const e = this.top(); const v = e && VIEWS[e.name]; if (v && !v.noRefresh) this.render(); },
  histLen: 1, ignoreUntil: 0,
  syncHist(){
    const want = this.stack.length;
    try {
      if (want > this.histLen){ for (let i = this.histLen; i < want; i++) history.pushState({d:i+1}, ""); }
      else if (want < this.histLen){ this.ignoreUntil = Date.now() + 800; history.go(want - this.histLen); }
    } catch (e) {}
    this.histLen = want;
  },
  nav(name, params){ this.leave(); this.stack.push({name, params:params||{}}); this.syncHist(); this.render(); },
  replace(name, params){ this.leave(); this.stack[this.stack.length-1] = {name, params:params||{}}; this.render(); },
  tab(name){
    this.leave();
    this.stack = name === "home" ? [{name:"home", params:{}}] : [{name:"home", params:{}}, {name, params:{}}];
    this.syncHist(); this.render();
  },
  back(){ if (this.stack.length > 1) history.back(); else this.tab("home"); },
  onPop(){
    if (this.ignoreUntil && Date.now() < this.ignoreUntil){ this.ignoreUntil = 0; return; }
    if (this.stack.length > 1){ this.leave(); this.stack.pop(); this.histLen = Math.max(1, this.histLen - 1); this.render(); }
  }
};
window.addEventListener("popstate", () => UI.onPop());
document.addEventListener("click", e => {

});

function counts(){

  for (const c of CAT.cards){ const p = S.cards[c.id]; if (p && p.due <= tn) due++; }
  const left = Math.max(0, S.settings.newPerDay - newUsedToday());
  const fresh = CAT.cards.filter(c => c.t !== "l" && !S.cards[c.id]).length;
  return {due, newLeft: Math.min(left, fresh)};
}

  const acc = K.tagAgg(S.tags, today(), 0, 14); let w = null;
  for (const [t, v] of Object.entries(acc)) if (v[0] >= 5 && t !== "listen"){ const r = v[1]/v[0]; if (!w || r < w.r) w = {t, r}; }

/* ---------- 练习流程 ---------- */
const RUN = {items:[], i:0, title:"", res:{}, t0:0, stage:null};
VIEWS.run = {
  full:true, noRefresh:true,
  render(){
    return `<div class="wrap"><div class="runbar"><button class="back" data-act="run-exit" aria-label="结束">✕</button><div class="track"><i id="runTrack"></i></div><span class="num" id="runCount"></span></div><div id="stage"></div></div>`;

function showItem(){
  if (RUN.stage && RUN.stage.leave) RUN.stage.leave();

  const it = RUN.items[RUN.i];
  const tr = $("#runTrack"), cn = $("#runCount");
  if (tr) tr.style.width = Math.round(RUN.i / Math.max(1, RUN.items.length) * 100) + "%";

};
function stageEl(){ return $("#stage"); }

/* 卡片：反射卡 / 时态快反 / 找错 / 扩句 */
class CardStage {
  constructor(card, retry){ this.card = card; this.retry = !!retry; this.step = 0; this.phase = "prompt"; this.drill = 0; this.alive = true; this.tries = 0; }
  get isE(){ return this.card.t === "e"; }
  target(){ return this.isE ? this.card.steps[this.step] : this.card; }
  leave(){ this.alive = false; clearInterval(this.clock); SR.abort(); }
  show(){ this.phase = "prompt"; this.said = ""; this.cmp = null; this.ms = 0; this.tries = 0; this.firstCmp = null; this.render(); }
  chips(){ const c = this.card; return `<div class="kind"><span class="chip k">${TYPE_LABEL[c.t]}</span><span class="chip">${esc((TAGS[c.tag]||TAGS.other).label)}</span>${this.retry ? '<span class="chip">再来一次</span>' : ""}${c.custom ? '<span class="chip">我导入的</span>' : ""}</div>`; }
  promptHTML(){
    const c = this.card;
    if (c.t === "r") return `<div class="zh">${esc(c.zh)}</div>`;
    if (c.t === "t") return `<div class="verb">${esc(c.verb)}</div><div class="parts">${c.subj ? `<span class="chip">${esc(c.subj)}</span>` : ""}${c.obj ? `<span class="chip">${esc(c.obj)}</span>` : ""}<span class="chip cue">${esc(c.cue)}</span></div><p class="small muted" style="margin-top:10px">用 ${esc(c.verb)} 说一句完整的话</p>`;
    if (c.t === "f") return `<p class="small muted">你以前写过：</p><div class="wrong">${esc(c.wrong)}</div><p class="small muted" style="margin-top:8px">说出正确的版本</p>`;
    const done = c.steps.slice(0, this.step).map(s => `<div class="step-done">✓ ${esc(s.en)}</div>`).join("");
    const s = c.steps[this.step];
    return `<p class="small muted">从这句开始：</p><div class="en sm">${esc(c.base)}</div>${done}<div class="parts" style="margin-top:12px"><span class="chip cue">＋ ${esc(s.add)}：${esc(s.hint)}</span></div><p class="small muted" style="margin-top:8px">加上去，把整句说一遍</p>`;
  }
  render(){
    const el = stageEl(); if (!el || !this.alive) return;
    if (this.phase === "prompt" || this.phase === "retry"){
      const mic = SR.usable();
      el.innerHTML = `<div class="card">${this.chips()}${this.promptHTML()}${this.retryHTML()}
        <div class="go-row"><div class="gantry small" id="lamps">${lamps()}</div><span class="num" id="clock">0.0</span></div>
        <div class="answer-zone">
          ${mic ? `<button class="mic" id="micBtn" data-act="c-mic" aria-label="点一下开始说">${ICON.mic}</button><div class="heard" id="heard">${this.phase === "retry" ? "按提示改好，再点麦克风说一次" : "灯灭后点麦克风，大声说"}</div>` :
            `<p class="small muted" style="margin:0 0 8px">${MIC.blocked ? "这个版本不能直接用麦克风：点下面的输入框，再点键盘上的麦克风说。" : SR.broken ? "这台手机的自动识别用不了：点下面的输入框，再点键盘上的麦克风说。" : "灯灭后开口说。想让 app 检查，就点输入框，用键盘上的麦克风说。"}</p>`}
          <div class="or"><input type="text" class="en" id="typed" placeholder="${mic ? "或用键盘语音输入、打字" : "点这里，用键盘的麦克风说"}" autocomplete="off" autocapitalize="sentences" spellcheck="false" enterkeyhint="done"><button class="btn sm" data-act="c-check">检查</button></div>
          ${mic ? "" : `<p class="small muted" style="margin-top:6px">说完停 2 秒会自动检查。</p>`}
          <button class="btn ghost block" style="margin-top:6px" data-act="c-reveal">${this.phase === "retry" ? "直接看答案" : "我说完了，看答案"}</button>
        </div></div>`;
      const typed = $("#typed");
      if (typed){
        typed.addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); ACT["c-check"](); } });
        let lastLen = 0, dict = false, tmr = null;
        typed.addEventListener("input", () => {
          if (!this.t0) this.startClock();
          const v = typed.value; if (v.length - lastLen >= 4) dict = true; lastLen = v.length;
          clearTimeout(tmr);
          if (dict && v.trim().split(/\s+/).length >= 2) tmr = setTimeout(() => { if (this.alive && (this.phase === "prompt" || this.phase === "retry") && typed.value.trim()){ SR.abort(); this.finish(typed.value.trim()); } }, 2200);
        });
      }
      this.t0 = 0;
      if (this.phase === "retry") this.startClock();
      else runLights($("#lamps"), 170, 200).then(() => { if (!this.alive || this.phase !== "prompt" || this.t0) return; this.startClock(); });
    } else if (this.phase === "reveal"){
      el.innerHTML = `<div class="card">${this.chips()}${this.revealHTML()}</div>`;
      if (S.settings.autoSpeak) TTS.speak(this.target().en);
    } else if (this.phase === "drill"){
      const t = this.card.en;
      el.innerHTML = `<div class="card"><div class="kind"><span class="chip k">说 3 遍</span></div>
        <p class="muted small">不看答案，大声说 3 遍。想不起来就点一下句子，偷看两秒。</p>
        <div class="en blur" id="drillText" data-act="c-peek" style="margin-top:12px">${esc(t)}</div>
        <div class="dots">${[0,1,2].map(i => `<i class="${i < this.drill ? "on" : ""}"></i>`).join("")}</div>
        ${SR.usable() && this.drill < 3 ? `<button class="mic" data-act="c-drill-mic" aria-label="说一遍">${ICON.mic}</button><div class="heard" id="heard">说一遍，说对了自动打勾</div>` : ""}
        ${this.drill < 3 ? `<button class="btn block" data-act="c-drill-tick">我说了一遍</button>` : `<button class="btn primary block big" data-act="c-drill-done">继续，等会儿再考你一次</button>`}
      </div>`;
    }
  }
  startClock(){
    this.t0 = performance.now(); const ck = $("#clock");

    this.clock = setInterval(() => { if (!this.alive || (this.phase !== "prompt" && this.phase !== "retry")){ clearInterval(this.clock); return; } if (ck && ck.isConnected) ck.textContent = fmt1(performance.now() - this.t0); }, 100);

  elapsed(){ return this.t0 ? performance.now() - this.t0 : 0; }
  async mic(){
    if (this.live){ SR.stop(); return; }

    this.live = true; btn && btn.classList.add("live"); if (heard) heard.textContent = "在听……";
    const r = await SR.listen({onInterim: t => { if (heard && heard.isConnected) heard.textContent = t || "在听……"; }});
    this.live = false; if (!this.alive || (this.phase !== "prompt" && this.phase !== "retry")) return;

  finish(said){
    this.ms = this.elapsed(); clearInterval(this.clock);

    if (cmp && !cmp.exact && this.phase === "prompt" && !this.tries){
      const hints = K.hintNotes(cmp.ops);
      if (hints.length){ this.tries = 1; this.hints = hints; this.firstSaid = this.said; this.firstCmp = cmp; Snd.bad(); vib([25,30,25]); this.phase = "retry"; this.render(); return; }
    }
    this.cmp = cmp || (this.phase === "retry" ? this.firstCmp : null);
    if (cmp){ if (cmp.exact){ Snd.good(); vib(15); } else if (cmp.level === "off"){ Snd.bad(); vib([30,40,30]); } }

  }
  retryHTML(){
    if (this.phase !== "retry") return "";
    return `<div class="panel" style="margin-top:14px;background:var(--amber-soft);border-color:transparent"><b>差一点。按提示自己改，再说一次</b><ul class="fb" style="margin:6px 0 4px">${this.hints.map(h => `<li>${esc(h)}</li>`).join("")}</ul><p class="small muted">你刚才说的：<span class="en" style="font-size:15px">${esc(this.firstSaid)}</span></p></div>`;
  }
  suggest(){
    if (!this.cmp) return "";
    if (this.tries) return this.cmp.exact ? "hard" : "again";
    if (this.cmp.exact) return this.ms && this.ms < 3500 ? "good" : "hard";
    return this.cmp.level === "close" ? "hard" : "again";
  }
  revealHTML(){
    const c = this.card, t = this.target(), cmp = this.cmp;
    let h = `<div class="small muted">${c.t === "r" ? esc(c.zh) : c.t === "t" ? esc(c.zh) : c.t === "f" ? `<s>${esc(c.wrong)}</s>` : esc(t.add + "：" + t.hint)}</div><div class="reveal">`;
    const timeChip = this.ms ? `<span class="time-chip num" id="timeChip">${fmt1(this.ms)} 秒</span>` : "";
    if (cmp){
      const lab = {exact:"完全正确", close:"差一点", off:"和参考答案差得比较多"}[cmp.level];
      h += `<div class="verdict ${cmp.level}">${lab}${this.tries ? "" : timeChip}</div>`;
      if (this.tries && cmp.exact) h += `<p class="small muted" style="margin:-6px 0 10px">按提示自己改对了。改过一次的句子会早一点再出现。</p>`;
      if (!cmp.exact){
        h += `<div class="diff">${diffHTML(cmp.ops)}</div>`;
        if (cmp.notes.length) h += `<ul class="fb">${cmp.notes.map(n => `<li>${esc(n.msg)}</li>`).join("")}</ul>`;
      }
    } else if (timeChip) h += `<div class="verdict" style="color:var(--muted)">对照一下，你说对了吗？${timeChip}</div>`;
    h += `<div class="say-line"><div class="en">${esc(t.en)}</div><button class="icon-btn" data-act="c-speak" aria-label="朗读">${ICON.speak}</button></div>`;
    if (t.alt && t.alt.length) h += `<div class="alts">也可以说：${t.alt.map(a => `<div class="en">${esc(a)}</div>`).join("")}</div>`;
    if (c.t === "t") h += `<div class="note">${esc(c.note)}</div>`;
    else if (c.note && (!this.isE || this.step === c.steps.length-1)) h += `<div class="note">${esc(c.note)}</div>`;
    if (this.isE && this.step < c.steps.length - 1){
      const nx = c.steps[this.step+1];
      h += `<button class="btn primary block big" style="margin-top:16px" data-act="c-next-step">下一步：＋ ${esc(nx.add)}</button>`;
    } else {
      const sg = this.suggest();
      h += `<div class="rate">
        <button class="again ${sg==="again"?"sug":""}" data-act="c-rate" data-v="again">没说出来<small>明天再练</small></button>
        <button class="hard ${sg==="hard"?"sug":""}" data-act="c-rate" data-v="hard">卡了一下<small>过几天再练</small></button>
        <button class="good ${sg==="good"?"sug":""}" data-act="c-rate" data-v="good">秒出<small>隔久一点</small></button></div>`;
    }
    return h + "</div>";
  }
  rate(r){
    const res = rateCard(this.card, r, this.tries ? 0 : this.ms, {retry:this.retry});
    RUN.res[r]++; if (this.ms && !this.tries && r !== "again") RUN.res.ms.push(this.ms);
    if (!this.retry && r === "again") RUN.weak[this.card.tag] = (RUN.weak[this.card.tag]||0) + 1;
    if (res.pb){ RUN.res.pb++; Snd.pb(); vib([15,40,15]); const tc = $("#timeChip"); if (tc){ tc.classList.add("pb"); tc.textContent = fmt1(this.ms) + " 秒，最快一次"; } }
    else if (r === "good"){ Snd.good(); vib(15); }
    if (r === "again" && !this.retry){ this.phase = "drill"; this.drill = 0; this.render(); return; }
    setTimeout(() => { if (this.alive) nextItem(); }, res.pb ? 650 : 120);
  }
}
function diffHTML(ops){
  return ops.map(o => {
    if (o.op === "eq") return esc(o.b);
    if (o.op === "ins") return `<span class="x">${esc(o.b)}</span>`;
    if (o.op === "del") return `<span class="m">${esc(o.a)}</span>`;
    return `<span class="s">${esc(o.b)}<small>→${esc(o.a)}</small></span>`;
  }).join(" ");
}
ACT["c-mic"] = () => RUN.stage && RUN.stage.mic && RUN.stage.mic();
ACT["c-check"] = () => { const s = RUN.stage; if (!(s instanceof CardStage) || (s.phase !== "prompt" && s.phase !== "retry")) return; const v = ($("#typed")||{}).value || ""; if (!v.trim()){ toast("先说出来，或在输入框里输入"); return; } SR.abort(); s.finish(v.trim()); };
ACT["c-reveal"] = () => { const s = RUN.stage; if (!(s instanceof CardStage) || (s.phase !== "prompt" && s.phase !== "retry")) return; SR.abort(); const v = ($("#typed")||{}).value || ""; s.finish(v.trim()); };
ACT["c-speak"] = () => { const s = RUN.stage; s && TTS.speak(s.target().en); };
ACT["c-rate"] = el => { const s = RUN.stage; if (s instanceof CardStage && s.phase === "reveal") s.rate(el.dataset.v); };
ACT["c-next-step"] = () => { const s = RUN.stage; if (!(s instanceof CardStage)) return; s.step++; s.show(); };
ACT["c-peek"] = el => { el.classList.add("peek"); setTimeout(() => el.classList.remove("peek"), 2000); };
ACT["c-drill-tick"] = () => { const s = RUN.stage; if (!(s instanceof CardStage)) return; s.drill = Math.min(3, s.drill + 1); vib(10); s.render(); };
ACT["c-drill-mic"] = async el => {
  const s = RUN.stage; if (!(s instanceof CardStage)) return;
  const heard = $("#heard"); el.classList.add("live"); if (heard) heard.textContent = "在听……";
  const r = await SR.listen({onInterim: t => { if (heard && heard.isConnected) heard.textContent = t; }});
  el.classList.remove("live");
  if (!s.alive) return;
  if (r.broke && !r.text){ s.render(); return; }
  if (!r.text){ if (heard) heard.textContent = r.error ? srErrorText(r.error) : "没听清，再来"; return; }
  const cmp = K.compareSaid(s.card.en, s.card.alt, r.text);
  if (cmp.level !== "off" && cmp.score >= 0.85){ s.drill = Math.min(3, s.drill + 1); Snd.good(); vib(12); s.render(); }
  else if (heard) heard.textContent = "还差一点：" + r.text;
};
ACT["c-drill-done"] = () => {
  const s = RUN.stage; if (!(s instanceof CardStage)) return;
  const at = Math.min(RUN.items.length, RUN.i + 4);
  RUN.items.splice(at, 0, {k:"card", id:s.card.id, retry:true});
  nextItem();
};

/* 听力：新句子先选意思，复习时听后复述 */
class ListenStage {
  constructor(card){
    this.card = card; this.alive = true; this.plays = 0; this.slow = false; this.done = false;
    if (!card) return;
    this.mode = TTS.ok && S.cards[card.id] ? "repeat" : "meaning";
    const pool = K.shuffle(CAT.cards.filter(c => c.t === "l" && c.id !== card.id && c.grp === card.grp)).slice(0, 3);
    this.opts = K.shuffle([card, ...pool]);
  }
  leave(){ this.alive = false; clearTimeout(this.tmr); SR.abort(); }
  show(){ this.render(); setTimeout(() => this.play(false), 250); }
  render(){
    const el = stageEl(); if (!el) return; const c = this.card; const tts = TTS.ok;
    const head = `<div class="kind"><span class="chip k">${this.mode === "repeat" ? "听后复述" : "听力"}</span><span class="chip">${c.grp === "iv" ? "面试官问法" : "日常说法"}</span></div>`;
    const playRow = tts ? `<div class="listen-hero"><button class="play" data-act="l-play" aria-label="再听一遍">${ICON.speak}</button></div>
      <div class="row-gap" style="justify-content:center"><button class="btn sm" data-act="l-play">再听一遍</button><button class="btn sm" data-act="l-slow">慢速听</button></div>` :
      `<p class="note">这台设备没有英文朗读，先看文字练：</p><div class="en">${esc(c.en)}</div>`;
    if (this.mode === "repeat"){
      if (!this.done){
        const mic = SR.usable();
        el.innerHTML = `<div class="card">${head}${playRow}<p class="small muted center" style="margin-top:12px">不看文字，把听到的整句说出来</p>
          ${mic ? `<button class="mic" id="lMic" data-act="l-mic" aria-label="说出来">${ICON.mic}</button><div class="heard" id="heard"></div>` : ""}
          <div class="or"><input type="text" class="en" id="typed" placeholder="${mic ? "或用键盘语音输入、打字" : "点这里，用键盘的麦克风说"}" autocomplete="off" spellcheck="false" enterkeyhint="done"><button class="btn sm" data-act="l-check">检查</button></div>
          <button class="btn ghost block" style="margin-top:6px" data-act="l-giveup">听不出来，看答案</button></div>`;
        const ty = $("#typed");
        if (ty){
          ty.addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); ACT["l-check"](); } });
          let last = 0, dict = false;
          ty.addEventListener("input", () => { const v = ty.value; if (v.length - last >= 4) dict = true; last = v.length; clearTimeout(this.tmr);
            if (dict && v.trim().split(/\s+/).length >= 2) this.tmr = setTimeout(() => { if (this.alive && !this.done && ty.value.trim()) this.repeatCheck(ty.value.trim()); }, 2200); });
        }
      } else {
        const cmp = this.cmp; const lv = cmp ? cmp.level : "off";
        const lab = cmp ? {exact:"一字不差", close:"差一点", off:"漏得比较多"}[lv] : "看一下原句";
        el.innerHTML = `<div class="card">${head}<div class="verdict ${cmp ? lv : ""}">${lab}</div>
          ${cmp && !cmp.exact ? `<div class="diff">${diffHTML(cmp.ops)}</div><p class="small muted">绿色是没听出来（或没说出来）的词。最容易漏的是 did you、want to、I'd 这类读得很轻的小词。</p>` : ""}
          <div class="say-line" style="margin-top:8px"><div class="en">${esc(c.en)}</div><button class="icon-btn" data-act="l-play" aria-label="朗读">${ICON.speak}</button></div>
          <div class="note">${esc(c.zh)}</div>
          <button class="btn primary block big" style="margin-top:14px" data-act="l-next">下一题</button></div>`;
      }
      return;
    }
    el.innerHTML = `<div class="card">${head}${playRow}
      <p class="small muted center" style="margin-top:12px">${this.done ? "" : "听完选意思"}</p>
      <div class="options">${this.opts.map((o,i) => `<button data-act="l-pick" data-v="${i}" class="${this.done ? (o.id === c.id ? "right" : (i === this.picked ? "wrongpick" : "")) : ""}">${esc(o.zh)}</button>`).join("")}</div>
      ${this.done ? `<div class="reveal"><div class="say-line"><div class="en">${esc(c.en)}</div><button class="icon-btn" data-act="l-play" aria-label="朗读">${ICON.speak}</button></div>
        <p class="small muted" style="margin-top:8px">跟着念一遍，注意连读和弱读。下次复习时要不看文字整句说出来。</p>
        <button class="btn primary block big" style="margin-top:14px" data-act="l-next">下一题</button></div>` : ""}
    </div>`;
  }
  play(slow){ if (!this.alive) return; if (!this.done) this.plays++; if (slow) this.slow = true; TTS.speak(this.card.en, {rate: slow ? 0.72 : 1}); }
  pick(i){
    if (this.done || this.mode !== "meaning") return;
    this.done = true; this.picked = i;
    const ok = this.opts[i].id === this.card.id;
    const r = !ok ? "again" : (this.plays <= 1 && !this.slow ? "good" : "hard");
    rateCard(this.card, r, 0, {});
    RUN.res.listenN++; if (ok) RUN.res.listenOk++;
    if (ok){ Snd.good(); vib(15); } else { Snd.bad(); vib([30,40,30]); }
    this.render();
  }
  async mic(){
    if (this.live){ SR.stop(); return; }
    const b = $("#lMic"), h = $("#heard"); this.live = true; b && b.classList.add("live"); if (h) h.textContent = "在听……";
    const r = await SR.listen({onInterim: t => { if (h && h.isConnected) h.textContent = t; }});
    this.live = false; if (!this.alive || this.done) return; b && b.classList.remove("live");
    if (r.broke && !r.text){ toast("这台手机的自动识别用不了，已改用键盘语音输入"); this.render(); return; }
    if (!r.text){ if (h) h.textContent = r.error ? srErrorText(r.error) : "没听清，再点一次"; return; }
    this.repeatCheck(r.text);
  }
  repeatCheck(said){
    if (this.done) return; clearTimeout(this.tmr);
    this.cmp = said ? K.compareSaid(this.card.en, [], said) : null; this.done = true;
    const lv = this.cmp ? this.cmp.level : "off";
    const r = lv === "exact" ? (this.plays <= 2 && !this.slow ? "good" : "hard") : lv === "close" ? "hard" : "again";
    rateCard(this.card, r, 0, {}); RUN.res.listenN++; if (lv !== "off") RUN.res.listenOk++;
    if (lv === "exact"){ Snd.good(); vib(15); } else if (lv === "off"){ Snd.bad(); vib([30,40,30]); }
    this.render(); if (S.settings.autoSpeak && lv !== "exact") TTS.speak(this.card.en);
  }
}
ACT["l-play"] = () => RUN.stage instanceof ListenStage && RUN.stage.play(false);
ACT["l-slow"] = () => RUN.stage instanceof ListenStage && RUN.stage.play(true);
ACT["l-pick"] = el => RUN.stage instanceof ListenStage && RUN.stage.pick(+el.dataset.v);
ACT["l-next"] = () => nextItem();
ACT["l-mic"] = () => RUN.stage instanceof ListenStage && RUN.stage.mic();
ACT["l-check"] = () => { const s = RUN.stage; if (!(s instanceof ListenStage) || s.done) return; const v = (($("#typed")||{}).value || "").trim(); if (!v){ toast("先把听到的说出来"); return; } SR.abort(); s.repeatCheck(v); };
ACT["l-giveup"] = () => { const s = RUN.stage; if (!(s instanceof ListenStage) || s.done) return; SR.abort(); s.repeatCheck(""); };

function buildCall(n){
  const C = CONTENT.CALL; const name = pick(C.names);
  const segs = [{kind:"open", say:pick(C.open).replace("{n}", name), zh:"开场：确认现在方便通话", hint:C.openReply}];

  const mid = K.shuffle(CONTENT.QUESTIONS.filter(q => q.grp === "core" && q.id !== "Q1" && q.id !== "Q8"))
    .sort((a, b) => used(a) - used(b) + ((b.id === "Q2" || b.id === "Q6") - (a.id === "Q2" || a.id === "Q6")) * 0.5);
  const qs = [QBY.Q1, ...mid.slice(0, n >= 5 ? 2 : 1)];
  if (n >= 5) qs.push(pick(CONTENT.QUESTIONS.filter(q => q.grp === "screen" && q.id !== "Q14")));
  qs.push(QBY.Q8);
  qs.forEach((q, i) => {
    segs.push({kind:"q", qid:q.id, say:(i === 0 ? pick(C.start) : pick(C.next)) + " " + pick(q.v), zh:q.zh});
    if ((q.id === "Q2" || q.id === "Q3") && q.follow.length && Math.random() < 0.6) segs.push({kind:"f", qid:q.id, say:pick(q.follow), zh:"追问"});
