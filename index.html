<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#16202B">
<title>脱口</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:ital,wght@0,600;1,600;1,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* 脱口 · 样式。起步灯是唯一的“大动作”，其余保持安静。 */
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#ECEFF3; --surface:#FFFFFF; --surface2:#F4F6F9; --ink:#16202B; --ink2:#36424F; --muted:#5B6774; --line:#D5DBE2;
  --red:#D90F2C; --red-soft:#FBE3E7; --purple:#7A2FDB; --purple-soft:#EEE4FC; --green:#0B8F50; --green-soft:#DCF3E6;
  --amber:#B87800; --amber-soft:#FBEFD3; --cta:#16202B; --cta-ink:#FFFFFF; --focus:#2F6FDE;
  --gantry:#1A222C; --lamp-off:#2E3742; --lamp-on:#FF1F3D;
  --f-ui:system-ui,-apple-system,"Segoe UI","PingFang SC","Noto Sans SC","Noto Sans CJK SC","Microsoft YaHei",Roboto,sans-serif;
  --f-en:"Source Serif 4","Noto Serif",Georgia,"Times New Roman",serif;
  --f-num:"Barlow Semi Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --tabbar-h:64px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1319; --surface:#17202A; --surface2:#1E2834; --ink:#E9EEF3; --ink2:#C3CCD6; --muted:#93A0AE; --line:#2B3746;
    --red:#FF5068; --red-soft:#3A1A22; --purple:#B58AFF; --purple-soft:#2B2140; --green:#3DD68C; --green-soft:#13301F;
    --amber:#FFC24A; --amber-soft:#3A2E12; --cta:#E9EEF3; --cta-ink:#0E1319; --focus:#7FA8FF;
    --gantry:#080B0F; --lamp-off:#232C37; --lamp-on:#FF2D4B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1319; --surface:#17202A; --surface2:#1E2834; --ink:#E9EEF3; --ink2:#C3CCD6; --muted:#93A0AE; --line:#2B3746;
  --red:#FF5068; --red-soft:#3A1A22; --purple:#B58AFF; --purple-soft:#2B2140; --green:#3DD68C; --green-soft:#13301F;
  --amber:#FFC24A; --amber-soft:#3A2E12; --cta:#E9EEF3; --cta-ink:#0E1319; --focus:#7FA8FF;
  --gantry:#080B0F; --lamp-off:#232C37; --lamp-on:#FF2D4B;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.55;
  -webkit-tap-highlight-color:transparent;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
img,svg{max-width:100%}
.hide{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:16px 18px calc(var(--tabbar-h) + 24px)}
.full .wrap{padding-bottom:28px}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.center{text-align:center}
.stack>*+*{margin-top:12px}
.row-gap{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{height:16px}
h1,h2,h3{margin:0;line-height:1.25}
h2{font-size:21px;font-weight:700;letter-spacing:-.01em}
h3{font-size:16px;font-weight:700}
p{margin:0}
a{color:var(--focus)}

/* 数字：计时牌字体 */
.num{font-family:var(--f-num);font-style:italic;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.01em}

/* 顶部 */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 18px}
.wordmark{font-size:40px;font-weight:900;letter-spacing:-.04em;line-height:1}
.streak{display:flex;align-items:baseline;gap:6px;text-align:right}
.streak .num{font-size:34px;line-height:1}
.streak .lbl{font-size:13px;color:var(--muted);line-height:1.2}
.subhead{display:flex;align-items:center;gap:10px;margin:2px 0 16px}
.back{border:0;background:none;padding:6px 8px 6px 0;font-size:15px;color:var(--muted);display:flex;align-items:center;gap:4px}

/* 起步灯 */
.gantry{display:inline-flex;gap:10px;padding:10px 14px;border-radius:999px;background:var(--gantry)}
.gantry i{width:18px;height:18px;border-radius:50%;background:var(--lamp-off);box-shadow:inset 0 -2px 0 rgba(0,0,0,.35);transition:background .08s}
.gantry i.on{background:var(--lamp-on);box-shadow:0 0 10px var(--lamp-on),inset 0 -2px 0 rgba(0,0,0,.2)}
.gantry.big i{width:26px;height:26px}
.gantry.small{gap:7px;padding:7px 10px}
.gantry.small i{width:12px;height:12px}

/* 首页主区 */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:20px 18px 18px;margin-bottom:22px}
.hero .gantry{margin-bottom:16px}
.hero h2{font-size:24px}
.hero .meta{margin-top:6px;color:var(--muted);font-size:14px}
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px;margin:14px 0 12px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 4px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 0 var(--line)}
.countdown{display:flex;align-items:baseline;gap:8px;margin:-6px 0 22px;padding:0 4px}
.countdown .num{font-size:30px;color:var(--amber)}

/* 按钮 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 16px;border-radius:14px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:15.5px;font-weight:600;text-decoration:none;user-select:none}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--cta);color:var(--cta-ink);border-color:var(--cta)}
.btn.block{display:flex;width:100%}
.btn.big{min-height:56px;font-size:17px;border-radius:16px}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:11px}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn svg{width:20px;height:20px;flex:none}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;padding:0}
.icon-btn svg{width:22px;height:22px}

/* 模块列表 */
.feature{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:18px;border-radius:20px;border:0;
  background:var(--gantry);color:#F2F5F8;margin-bottom:12px}
.feature svg{width:30px;height:30px;flex:none}
.feature b{display:block;font-size:17px}
.feature span{display:block;font-size:13.5px;color:#AEB8C3}
.mods{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mod{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);text-align:left}
.mod svg{width:24px;height:24px;color:var(--ink2)}
.mod b{font-size:15.5px}
.mod span{font-size:12.5px;color:var(--muted);line-height:1.35}
.tip{margin:22px 4px 0;padding-left:12px;border-left:3px solid var(--lamp-on);color:var(--ink2);font-size:14.5px}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:14px;background:var(--surface2);border:1px dashed var(--line);margin-bottom:16px;font-size:14px}

/* 通用面板与表单 */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.panel+.panel{margin-top:12px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border:0;border-top:1px solid var(--line);background:none;text-align:left}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .grow b{display:block;font-weight:600}
.li .grow span{display:block;font-size:13px;color:var(--muted)}
.li .end{font-size:13px;color:var(--muted);white-space:nowrap}
.sec-title{font-size:13.5px;color:var(--muted);margin:22px 4px 8px;font-weight:600}
label.fld{display:block;margin-top:12px}
label.fld>span{display:block;font-size:13.5px;color:var(--muted);margin-bottom:6px}
input[type=text],input[type=date],input[type=number],textarea,select{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font-size:16px}
textarea{min-height:110px;resize:vertical;line-height:1.5}
textarea.en,input.en{font-family:var(--f-en);font-size:17px}
input[type=range]{width:100%}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.switch:first-child{border-top:0}
.switch input{width:22px;height:22px}

/* 标签 */
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:12.5px;background:var(--surface2);border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.chip.k{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chips{display:flex;gap:6px;flex-wrap:wrap}

/* 练习页 */
.runbar{display:flex;align-items:center;gap:12px;margin:2px 0 18px}
.runbar .track{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.runbar .track i{display:block;height:100%;background:var(--ink);border-radius:99px;transition:width .25s}
.runbar .num{font-size:15px;color:var(--muted);font-style:normal}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:20px 18px;min-height:220px}
.card .kind{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.zh{font-size:24px;font-weight:600;line-height:1.4;letter-spacing:.01em}
.en{font-family:var(--f-en);font-size:24px;line-height:1.38;font-weight:400}
.en.sm{font-size:19px}
.wrong{font-family:var(--f-en);font-size:22px;line-height:1.4;text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2px}
.verb{font-family:var(--f-en);font-size:34px;line-height:1.1;margin-bottom:12px}
.parts{display:flex;gap:8px;flex-wrap:wrap}
.parts .chip{font-size:15px;padding:6px 12px}
.parts .chip.cue{background:var(--amber-soft);border-color:transparent;color:var(--ink)}
.go-row{display:flex;align-items:center;gap:12px;margin:18px 0 6px}
.go-row .num{font-size:20px;color:var(--muted)}
.answer-zone{margin-top:16px}
.mic{width:84px;height:84px;border-radius:50%;border:0;background:var(--cta);color:var(--cta-ink);display:flex;align-items:center;justify-content:center;margin:6px auto 4px;position:relative}
.mic svg{width:34px;height:34px}
.mic.live::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:3px solid var(--lamp-on);animation:pulse 1.1s ease-out infinite}
@keyframes pulse{from{transform:scale(.92);opacity:1}to{transform:scale(1.18);opacity:0}}
.heard{min-height:26px;text-align:center;font-family:var(--f-en);font-size:18px;color:var(--ink2);margin:6px 0 10px}
.or{display:flex;gap:8px;margin-top:8px}
.or input{flex:1}
.reveal{margin-top:16px;border-top:1px solid var(--line);padding-top:16px}
.say-line{display:flex;align-items:flex-start;gap:10px}
.say-line .en{flex:1}
.alts{margin-top:8px;font-size:14px;color:var(--muted)}
.alts .en{font-size:16px}
.note{margin-top:10px;font-size:14.5px;color:var(--ink2)}
.verdict{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-weight:700}
.verdict.exact{color:var(--green)}
.verdict.close{color:var(--amber)}
.verdict.off{color:var(--red)}
.time-chip{margin-left:auto;font-size:17px;color:var(--muted)}
.time-chip.pb{color:var(--purple);animation:pbflash .6s ease-out 2}
@keyframes pbflash{50%{transform:scale(1.15)}}
.diff{font-family:var(--f-en);font-size:17px;line-height:1.9;background:var(--surface2);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.diff .x{text-decoration:line-through;color:var(--red)}
.diff .m{color:var(--green);border-bottom:2px solid var(--green);padding:0 2px}
.diff .s{color:var(--amber);border-bottom:2px dotted var(--amber)}
.diff .s small{font-family:var(--f-ui);font-size:12px;color:var(--muted)}
.fb{margin:0 0 10px;padding-left:18px;font-size:14.5px;color:var(--ink2)}
.rate{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:16px}
.rate button{min-height:58px;border-radius:14px;border:2px solid transparent;font-weight:700;font-size:15px;line-height:1.2}
.rate small{display:block;font-weight:400;font-size:11.5px;opacity:.8;margin-top:2px}
.rate .again{background:var(--red-soft);color:var(--red)}
.rate .hard{background:var(--amber-soft);color:var(--amber)}
.rate .good{background:var(--purple-soft);color:var(--purple)}
.rate .sug{border-color:currentColor}
.dots{display:flex;gap:12px;justify-content:center;margin:16px 0}
.dots i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line)}
.dots i.on{background:var(--green);border-color:var(--green)}
.blur{filter:blur(7px);transition:filter .2s;user-select:none}
.blur.peek{filter:none}
.step-done{font-family:var(--f-en);font-size:16px;color:var(--muted);margin-top:4px}
.options{display:grid;gap:8px;margin-top:14px}
.options button{text-align:left;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.options button.right{border-color:var(--green);background:var(--green-soft)}
.options button.wrongpick{border-color:var(--red);background:var(--red-soft)}
.listen-hero{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0 4px}
.play{width:92px;height:92px;border-radius:50%;border:0;background:var(--cta);color:var(--cta-ink);display:flex;align-items:center;justify-content:center}
.play svg{width:38px;height:38px}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.check:first-child{border-top:0}
.check input{width:20px;height:20px;margin-top:2px;flex:none}
.timer{font-size:46px;line-height:1;text-align:center;margin:10px 0}
.timer.over{color:var(--red)}
.level{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0}
.level i{display:block;height:100%;width:calc(var(--lvl,0)*100%);background:var(--green);transition:width .08s}
audio{width:100%;margin-top:8px}

/* 总结 */
.summary .big{font-size:56px;line-height:1}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat .num{display:block;font-size:28px;line-height:1.1}
.stat span{font-size:12.5px;color:var(--muted)}

/* 来电模拟（始终是深色） */
.call{position:fixed;inset:0;z-index:50;background:radial-gradient(120% 80% at 50% 0%,#24313F 0%,#0B1016 70%);color:#EEF2F6;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 28px) 22px calc(env(safe-area-inset-bottom,0px) + 28px);overflow-y:auto}
.call .who{text-align:center;margin-top:24px}
.call .avatar{width:96px;height:96px;border-radius:50%;margin:0 auto 14px;background:#2C3A49;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:700}
.call.ringing .avatar{animation:ring 1.4s ease-in-out infinite}
@keyframes ring{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.25)}50%{box-shadow:0 0 0 18px rgba(255,255,255,0)}}
.call .name{font-size:26px;font-weight:700}
.call .status{color:#9FB0C1;margin-top:4px}
.call .clock{font-size:20px;color:#9FB0C1;margin-top:4px}
.call .say{margin:26px auto 0;max-width:420px;text-align:center;min-height:90px}
.call .say .en{font-size:21px;color:#F4F7FA}
.call .say .zh{font-size:15px;color:#9FB0C1;font-weight:400;margin-top:6px}
.call .cheat{margin:14px auto 0;max-width:420px;background:rgba(255,255,255,.07);border-radius:14px;padding:12px 14px;font-size:14.5px;color:#D6DEE6}
.call .controls{margin-top:auto;display:grid;gap:10px;max-width:420px;width:100%;margin-left:auto;margin-right:auto;padding-top:24px}
.call .btn{background:rgba(255,255,255,.1);border-color:transparent;color:#EEF2F6}
.call .btn.primary{background:#EEF2F6;color:#0B1016}
.call .accept-row{display:flex;justify-content:space-around;margin-top:auto;padding-top:40px}
.round{width:76px;height:76px;border-radius:50%;border:0;display:flex;align-items:center;justify-content:center;color:#fff}
.round svg{width:34px;height:34px}
.round.green{background:#19B868}
.round.red{background:#E5304A}
.round-lbl{text-align:center;font-size:13px;color:#9FB0C1;margin-top:8px}
.call .level{background:rgba(255,255,255,.12)}
.call .muted{color:#9FB0C1}

/* 耳机模式 */
.hands-zh{font-size:30px;font-weight:600;line-height:1.35;text-align:center;margin:28px 0 18px;min-height:84px}
.hands-en{font-family:var(--f-en);font-size:26px;text-align:center;min-height:72px;color:var(--ink2)}
.hands-phase{text-align:center;margin-top:10px}

/* 进度 */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px;overflow-x:auto;padding-bottom:4px}
.heat i{width:16px;height:16px;border-radius:4px;background:var(--surface2);border:1px solid var(--line)}
.heat i.l1{background:var(--green-soft);border-color:var(--green-soft)}
.heat i.l2{background:color-mix(in srgb,var(--green) 55%,var(--surface));border-color:transparent}
.heat i.l3{background:var(--green);border-color:var(--green)}
.heat i.fz{border:1.5px dashed var(--amber)}
.heat i.today{outline:2px solid var(--ink);outline-offset:1px}
.bars .bar{display:grid;grid-template-columns:86px 1fr 64px;gap:10px;align-items:center;padding:7px 0}
.bars .bar .t{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bars .bar .t i{display:block;height:100%;background:var(--ink)}
.bars .bar .v{text-align:right;font-size:13.5px}
.up{color:var(--green)} .down{color:var(--red)}
.week{display:flex;align-items:flex-end;gap:8px;height:90px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;color:var(--muted)}
.week div i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:var(--ink);min-height:2px}

/* 写作自查 */
.marked{font-family:var(--f-en);font-size:17px;line-height:1.8;white-space:pre-wrap;background:var(--surface2);border-radius:12px;padding:12px}
.marked mark{background:var(--amber-soft);color:inherit;border-bottom:2px solid var(--amber);padding:0 1px}
.marked mark sup{font-family:var(--f-ui);font-size:10.5px;color:var(--amber);margin-left:1px}
.issues{margin:10px 0 0;padding-left:20px}
.issues li{margin:6px 0;font-size:14.5px}
.ai-out{margin-top:12px}
.ai-out .better{font-family:var(--f-en);font-size:17px;line-height:1.6;margin-top:8px}

/* 底部导航 */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);display:flex;justify-content:space-around}
.tabbar button{flex:1;max-width:140px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 9px;font-size:12px;color:var(--muted);position:relative}
.tabbar svg{width:24px;height:24px}
.tabbar button[aria-current="page"]{color:var(--ink);font-weight:700}

.full .tabbar{display:none}

/* 提示条、确认框 */
.toast{position:fixed;left:50%;bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom,0px) + 16px);transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-size:14.5px;opacity:0;pointer-events:none;transition:all .25s;z-index:80;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom,0px) + 18px)}
.sheet p{margin:8px 0 16px;color:var(--ink2)}
.sheet .row-gap .btn{flex:1}

@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}

.back svg{width:20px;height:20px;flex:none}
.gantry i.pur{background:var(--purple);box-shadow:0 0 10px var(--purple)}
.full .toast{top:calc(env(safe-area-inset-top,0px) + 12px);bottom:auto;transform:translateX(-50%) translateY(-20px)}
.full .toast.show{transform:translateX(-50%) translateY(0)}

.typing .tabbar{display:none}

.seg.mini{margin:2px 0 12px}
.seg.mini button{padding:6px 4px;font-size:13px}

.deck-pick{display:flex;align-items:center;gap:10px;margin:12px 0 0}

.mods > :last-child:nth-child(odd){grid-column:span 2}

.verdict.meaning{color:var(--green)}

.w{border-bottom:1px dotted var(--line);cursor:pointer}

.say-btns{display:flex;flex-direction:column;gap:6px;align-items:center;flex:none}
.slow-btn{min-height:30px;padding:4px 8px;font-size:12.5px}

.say-b{gap:4px}

.rd-list{margin-top:6px}
.rd-s{padding:8px 10px;border-radius:10px;margin:4px 0;line-height:1.6;cursor:pointer;transition:background .2s}
.rd-s.cur{background:var(--amber-soft);font-weight:600}
.rd-s.done{color:var(--muted)}
.rd-hide .rd-s{filter:blur(6px)}

.plan-row{align-items:center;gap:10px}

.ckg{background:var(--amber-soft);border-radius:5px;padding:0 2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}

.gline.opt .gtag{background:rgba(224,161,0,.18);color:#9a6700}
mark.must{background:transparent;color:inherit;border-bottom:2px solid #d92d20}
mark.opt{background:transparent;color:inherit;border-bottom:2px dashed #e0a100}
@media (prefers-color-scheme: dark){ .gline.must .gtag{color:#ff8a7a} .gline.opt .gtag{color:#f5c451} }

.pl-tools{display:flex;gap:16px;margin-top:4px}

.linkbtn.danger{color:#c4321f}

.has-ai-only{display:none!important}

.call .controls>div:last-child{display:flex;justify-content:center}
.li .grow .en{display:block;color:var(--muted)}
.summary h2{font-size:24px}

  {id:"g03",title:"新同事闲聊",zh:"自我介绍、适应得怎样、爱好、约打球",who:"Coworker",turns:[
    {say:"Hey, you must be the new engineer. I'm Jake.",zh:"嘿，你就是新来的工程师吧，我叫 Jake。",reply:["Hi Jake, nice to meet you. I just started this week."]},
    {say:"Welcome! How are you liking it so far?",zh:"欢迎！目前感觉怎么样？",reply:["So far so good. Everyone's been really nice.","I like it so far. There's a lot to learn."]},
    {say:"Where did you move from?",zh:"你从哪儿搬过来的？",reply:["I moved here from the East Coast.","I moved from out of state."]},
    {say:"Nice. Do you do anything for fun outside of work?",zh:"工作之外有什么爱好吗？",reply:["I like hiking and playing video games. How about you?","I'm really into sports."]},
    {say:"No way, me too! We should go together sometime.",zh:"真的？我也打！哪天一起去练习场吧。",reply:["That sounds great. Just let me know when.","I'd love that. Are you free this weekend?"]},
    {say:"Definitely. Anyway, let me know if you need anything.",zh:"一定。有什么需要随时找我。",reply:["Thanks, I really appreciate it.","Thanks, that's really nice of you."]}]},
  {id:"g04",title:"开会提问",zh:"提问、确认时间、找对的人、答应跟进",who:"Manager",turns:[
    {say:"Okay, that's the plan for the test rig. Any questions so far?",zh:"测试台的计划就这样。目前有问题吗？",reply:["Yes, quick question. When do we need the first prototype?","Can I ask a quick question?"]},

    {say:"That would be Maria. She owns the data acquisition setup.",zh:"找 Maria，数据采集那套是她负责的。",reply:["Great, I'll reach out to her today.","Thanks. I'll set up a time with her."]},
    {say:"Sounds good. Can you send a quick update by Friday?",zh:"周五前能发个简短的进展吗？",reply:["Sure, I'll send it by Friday.","No problem. I'll send an update by Friday."]},

  {id:"g05",title:"打电话问租房",zh:"还在不在、房租、水电、车位、约看房",who:"Leasing agent",turns:[
    {say:"Thanks for calling Oak Park Apartments. How can I help you?",zh:"这里是 Oak Park 公寓，有什么可以帮您？",reply:["Hi, I'm calling about the one-bedroom. Is it still available?"]},
    {say:"Yes, it is. It's two thousand four hundred a month.",zh:"还在。每月 2400。",reply:["Are utilities included?","Okay. Does that include utilities?"]},
    {say:"Water and trash are included, but electricity isn't.",zh:"包水和垃圾费，不包电。",reply:["Got it. Is there parking?","Okay. Is parking included?"]},
    {say:"Yes, one parking spot comes with the unit.",zh:"带一个车位。",reply:["Great. When can I come see it?","Perfect. Could I schedule a viewing?"]},
    {say:"We have openings Thursday afternoon or Saturday morning.",zh:"周四下午或者周六上午可以。",reply:["Saturday morning works for me.","Thursday afternoon would be great."]},
    {say:"Perfect. Can I get your name and phone number?",zh:"能留一下名字和电话吗？",reply:["Sure. My name is Sam. Let me spell it for you.","Sure. It's Sam, S-A-M."],tip:"换成你自己的名字和电话"}]},
  {id:"g06",title:"银行开户",zh:"开户、证件、地址证明、月费、借记卡",who:"Banker",turns:[
    {say:"Hi, what brings you in today?",zh:"您好，今天来办什么业务？",reply:["I'd like to open a checking account."]},
    {say:"Sure. Do you have a photo ID with you?",zh:"带了有照片的证件吗？",reply:["Yes, here's my passport."]},
    {say:"Great. And do you have proof of address, like a lease or a utility bill?",zh:"有地址证明吗，比如租约或水电账单？",reply:["Yes, here's my lease.","I have my lease on my phone. Is that okay?"]},
    {say:"This account has a twelve-dollar monthly fee, but we waive it if you set up direct deposit.",zh:"这个账户每月 12 美元，设置工资直接存入就免。",reply:["Okay. Can I set up direct deposit later?","Got it. How do I set up direct deposit?"]},
    {say:"Of course. Would you like a debit card with that?",zh:"需要办一张借记卡吗？",reply:["Yes, please.","Yes, that would be great."]}]},
  {id:"g07",title:"车行看车",zh:"说需求、试驾、问价、问其他费用",who:"Salesperson",turns:[
    {say:"Hi there! Are you looking for anything in particular?",zh:"你好，有想看的车吗？",reply:["Yes, I'm looking for a used sedan, something reliable.","I'm just looking for now, thanks."]},
    {say:"This one has about thirty thousand miles. Want to take it for a test drive?",zh:"这辆大约三万英里。要不要试驾？",reply:["Sure, I'd love to.","Yes, I'd like to test drive it."]},
    {say:"So, what do you think?",zh:"觉得怎么样？",reply:["I like it. What's your best price?","It drives well. How much is it?"]},
    {say:"We could do eighteen nine for you.",zh:"给你 18,900。",reply:["Are there any other fees on top of that?","Does that include all the fees?"]},
    {say:"Just tax, title, and registration.",zh:"只有税、产权和上牌的费用。",reply:["Okay. Can I get that in writing?","Got it. I want to look around a bit before I decide."]}]},

  for (const e of C.E_CARDS){
    const steps = e.steps.map(([add,hint,en])=>{ const a=splitAlts(en); return {add,hint,en:a[0],alt:a.slice(1)}; });
    cards.push({id:e.id,t:"e",tag:e.tag,base:e.base,steps,en:steps[steps.length-1].en,alt:steps[steps.length-1].alt,note:"先说“I + 动词”，细节一块一块往后加。"});
  }
  for (const [id,grp,en,zh] of C.L_CARDS) cards.push({id,t:"l",tag:"listen",grp,en,zh});
  for (const c of cards) c.deck = "core";
  for (const [id,tag,zh,en,note] of (C.D_CARDS||[])){ const a=splitAlts(en); cards.push({id,t:"r",tag,zh,en:a[0],alt:a.slice(1),note,deck:"daily"}); }
  for (const [id,grp,en,zh] of (C.DL_CARDS||[])) cards.push({id,t:"l",tag:"listen",grp,en,zh,deck:"daily"});
  for (const c of (custom||[])) cards.push(Object.assign({}, c, {custom:true, deck:c.deck || "我的卡片"}));
  /* 其他正确说法：内置补充 + 你自己点“我的说法也对”加的 */
  const extra = C.ALT_EXTRA || {}; myAlts = myAlts || {};
  for (const c of cards){
    const add = splitAlts(extra[c.id] || "").concat(myAlts[c.id] || []);
    if (!add.length) continue;
    const seen = new Set([c.en].concat(c.alt || []).map(x => tokens(x).join(" ")));
    const fresh = add.filter(x => { const k = tokens(x).join(" "); if (!k || seen.has(k)) return false; seen.add(k); return true; });
    c.alt = (c.alt || []).concat(fresh);
    if (c.t === "e" && c.steps){ const last = c.steps[c.steps.length-1]; last.alt = (last.alt || []).concat(fresh); }
  }
  const byId = {}; for (const c of cards) byId[c.id] = c;
  return {cards, byId};
}

function srsRate(p, r, tn){
  p = p ? Object.assign({}, p) : {box:0,due:tn,n:0,ok:0,lapses:0};
  if (r === "again"){ p.box = 1; p.due = tn+1; p.lapses = (p.lapses||0)+1; }
  else if (r === "hard"){ p.box = Math.max(1,p.box); p.due = tn + Math.max(1, Math.ceil(INTERVALS[p.box]/2)); }
  else { p.box = p.box===0 ? 2 : Math.min(8, p.box+1); p.due = tn + INTERVALS[p.box]; }
  p.n = (p.n||0)+1; if (r !== "again") p.ok = (p.ok||0)+1; p.last = tn;
  return p;
}

function tokens(s, isUser){
  s = String(s||"").toLowerCase().replace(/[’‘`´]/g,"'").replace(/%/g," percent ").replace(/&/g," and ").replace(/(\d),(\d{3})/g,"$1$2");
  const raw = s.match(/[a-z0-9]+(?:'[a-z]+)?/g) || [];
  const out = [];
  for (let w of raw){
    if (isUser && FILLER.has(w)) continue;
    if (CONTR[w]) { out.push(...CONTR[w].split(" ")); continue; }
    if (ORD[w]) { out.push(ORD[w]); continue; }
    if (/^\d+$/.test(w) && NUMW[+w]) { out.push(NUMW[+w]); continue; }

function lcsOps(a, b){
  const n=a.length, m=b.length;
  const dp = []; for (let i=0;i<=n;i++) dp.push(new Uint16Array(m+1));
  for (let i=n-1;i>=0;i--) for (let j=m-1;j>=0;j--) dp[i][j] = a[i]===b[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j], dp[i][j+1]);
  const ops = []; let i=0, j=0;
  while (i<n && j<m){
    if (a[i]===b[j]) { ops.push({op:"eq",a:a[i],b:b[j]}); i++; j++; }
    else if (dp[i+1][j] >= dp[i][j+1]) { ops.push({op:"del",a:a[i]}); i++; }
    else { ops.push({op:"ins",b:b[j]}); j++; }
  }
  while (i<n) ops.push({op:"del",a:a[i++]});
  while (j<m) ops.push({op:"ins",b:b[j++]});
  const out = [];
  for (let k=0;k<ops.length;k++){
    const o=ops[k], nx=ops[k+1];
    if (o.op==="del" && nx && nx.op==="ins") { out.push({op:"sub",a:o.a,b:nx.b}); k++; }
    else if (o.op==="ins" && nx && nx.op==="del") { out.push({op:"sub",a:nx.a,b:o.b}); k++; }
    else out.push(o);
  }
  return {ops: out, lcs: dp[0][0]};
}

const CK_PRON = new Set(["it","them","him","her","me","us","this","that","everything","something","things"]);
function findChunks(words, lex){
  const out = []; const ws = words.map(w => String(w).toLowerCase().replace(/’/g, "'"));
  for (let i = 0; i < ws.length; ){
    let hit = null, end = 0;
    for (const e of lex){ if (i + e.t.length > ws.length) continue; let ok = true; for (let k = 0; k < e.t.length; k++) if (!ckTok(e.t[k], ws[i + k])){ ok = false; break; } if (ok){ hit = e; end = i + e.t.length - 1; break; } }
    if (!hit) for (const e of lex){
      if (e.t.length !== 2 || !CK_SEP.has(e.t[1]) || !ckTok(e.t[0], ws[i])) continue;
      const tog = e.t[1] === "together";
      for (let g = 1; g <= (tog ? 3 : 1); g++){ const j = i + g + 1; if (j >= ws.length) break; if ((tog || CK_PRON.has(ws[i + 1])) && ws[j] === e.t[1]){ hit = e; end = j; break; } }
      if (hit) break;
    }
    if (hit){ out.push({s:i, e:end, p:hit.p, zh:hit.zh}); i = end + 1; } else i++;
  }
  return out;
}
/* 分句：3.3、0.2 这样的小数不当句号 */
function splitSentences(text){
  const s = String(text || "").replace(/\s+/g, " ").trim(); if (!s) return [];
  return s.replace(/(\d)\.(\d)/g, "$1\u2024$2").split(/(?<=[.!?]["”’)]?)\s+/).map(x => x.replace(/\u2024/g, ".").trim()).filter(x => x.length > 1);
}
/* 每句挑一条最相关的发音提示（重音、语调、断句、词尾辅音、难发的音） */
function pronTip(text){
  const s = String(text || "").trim(); const words = s.split(/\s+/).filter(Boolean);
  if (/\?\s*$/.test(s) && /^(do|does|did|is|are|was|were|can|could|would|will|have|has|should|may|am)\b/i.test(s)) return "一般疑问句：句尾音调往上扬 ↗";
  if (/\?\s*$/.test(s) && /^(what|where|when|who|why|how|which)\b/i.test(s)) return "特殊疑问句：句尾音调往下降 ↘，不要上扬";
  if (/\bcan't\b/i.test(s)) return "can't 要重读、拉长；can 在句子里一般轻读成 kən";
  if (/\b\w+(sts|sks|xt|ked|ped|sed|ched|shed|nds|lds|nts)\b/i.test(s)) return "词尾辅音要发出来，但中间别加“特、斯”这样的元音";
  if (words.length >= 9) return "长句按意群断开（打开“断句”能看到斜杠），每一块一口气说完，块和块之间才停";
  if (/\b(th(?!e\b)[a-z]*)\b/i.test(s)) return "th：舌尖轻轻放在上下牙之间送气，不要发成 s、z 或 d";
  if (/v/i.test(s)) return "v：上齿轻碰下唇再出声；w 要先把嘴唇撮圆";
  return "重要的词（名词、动词、形容词）拉长、音调起伏；a、the、to、of 轻轻带过";
}
/* 口语里该查的错：去掉标点、大小写、拼写这类只跟书写有关的 */
function speechFlags(text){ return checkWriting(text).filter(i => i.tag !== "书写" && i.tag !== "拼写"); }

/* 只给提示、不给答案：让你自己改一次（研究里叫 prompt，比直接给正确答案更能促进学习） */
function hintNotes(ops){
  const out = []; let prev = "", prev2 = "";
  for (const o of ops){
    if (o.op === "eq"){ prev2 = prev; prev = o.b; continue; }
    if (o.op === "sub"){
      const k = classifySub(o.a, o.b);
      out.push(k === "past" ? pastRule(o.a, o.b, prev, prev2).hint : k === "s" ? sRule(o.a, o.b, prev, prev2).hint : k === "be" ? `be 动词 ${o.b} 用得不对` :
        k === "perf" ? `这里要用完成时 have，不是 ${o.b}` : k === "pron" ? `${o.b} 可能没说清楚，注意发音` : `${o.b} 这个词不对`);
      prev = o.b;
    } else if (o.op === "del"){
      out.push(BE.has(o.a) ? (prev ? `${prev} 后面漏了 be 动词（is / am / are / was）` : "开头漏了 be 动词（is / am / are）") :
        (o.a === "not" && AUX.has(prev)) ? `${prev} 后面漏了 not（缩写的 n't 可能读得太轻）` : (prev ? `${prev} 后面漏了一个词` : "开头漏了一个词"));
    } else if (o.op === "ins"){
      out.push(o.b === "to" ? "多了一个 to" : `${o.b} 是多出来的`);
    }
  }
  return [...new Set(out)].slice(0, 3);
}

/* 顽固句分块练：按标点或连接词切成 2–3 块，一块一块加长 */
const BOUND = new Set(["and","but","so","because","that","to","with","at","in","on","for","when","where","during","about","from","by","since","as","after","before"]);
function chunkSentence(en){
  en = String(en || "").trim();
  const parts = en.split(/(?<=[,.;?!])\s+/).filter(Boolean);
  for (let i = 0; i < parts.length - 1; i++){ if (parts[i].split(/\s+/).length < 2){ parts.splice(i, 2, parts[i] + " " + parts[i+1]); i--; } }
  if (parts.length >= 2){ while (parts.length > 3){ const i = parts.length - 2; parts.splice(i, 2, parts[i] + " " + parts[i+1]); } return parts; }
  const w = en.split(/\s+/);
  if (w.length <= 6) return [en];
  const mid = Math.floor(w.length / 2); let best = mid, bd = 99;
  for (let i = 2; i < w.length - 2; i++){ if (BOUND.has(w[i].toLowerCase().replace(/[^a-z']/g, "")) && Math.abs(i - mid) < bd){ bd = Math.abs(i - mid); best = i; } }
  return [w.slice(0, best).join(" "), w.slice(best).join(" ")];
}

/* ---------- 导入码 ---------- */
function parseImport(text){
  const res = {cards:[], answers:[], keys:[], questions:[], follow:[], alts:[], plan:[], meta:{date:"", who:[], replace:[]}, bad:[]};
  const ROLE = {"开场":"first","核心":"core","初筛":"screen","提问":"ask","基本":"core","行为":"core","电话":"screen","技术":"tech","概念":"concept","first":"first","core":"core","screen":"screen","ask":"ask","tech":"tech","concept":"concept"};
  let deck = "我的卡片";
  String(text||"").split(/\r?\n/).forEach((line, i) => {
    const s = line.trim();
    if (!s || s.startsWith("#")) return;
    const p = s.split(/\s*[|｜]\s*/);
    const kind = p[0];
    if ((kind==="题库"||kind==="组"||kind==="DECK") && p[1]){ deck = p[1].slice(0, 40); if (/^(日常生活|daily)$/i.test(deck.trim())) deck = "daily"; else if (/^(通用|通用（诊断报告）|core)$/i.test(deck.trim())) deck = "core"; if (p[2] && /替换|replace/i.test(p[2]) && !res.meta.replace.includes(deck)) res.meta.replace.push(deck); return; }
    if (kind==="面试日期" && /^\d{4}-\d{2}-\d{2}$/.test(p[1]||"")){ res.meta.date = p[1]; return; }
    if (kind==="面试官" && p[1]){ res.meta.who.push({deck, name:p[1], company:p[2]||""}); return; }
    if ((kind==="卡"||kind==="R") && p[1] && p[2]){ const a = splitAlts(p[2]); res.cards.push({t:"r", zh:p[1], en:a[0], alt:a.slice(1), tag:tagKey(p[3]), note:p[4]||"", deck}); }
    else if ((kind==="词"||kind==="W") && p[1] && p[2] && p[3]){ const a = splitAlts(p[3]); res.cards.push({t:"w", word:p[1].trim(), mean:p[2].trim(), en:a[0], alt:a.slice(1), zh:(p[4]||"").trim(), tag:"vocab", note:p[5]||"", deck}); }
    else if ((kind==="改"||kind==="F") && p[1] && p[2]){ const a = splitAlts(p[2]); res.cards.push({t:"f", wrong:p[1], en:a[0], alt:a.slice(1), tag:tagKey(p[3]), note:p[4]||"", deck}); }
    else if ((kind==="听"||kind==="L") && p[1] && p[2]){ res.cards.push({t:"l", grp:"cs", en:p[1], zh:p[2], tag:"listen", deck}); }
    else if ((kind==="问"||kind==="Q") && p[1] && p[2]){
      const id = p[1].toUpperCase().replace(/[^A-Z0-9_-]/g, "");
      if (!id || /^Q\d+$/.test(id)){ res.bad.push(i+1); return; }
      res.questions.push({id, deck, v:splitAlts(p[2]), zh:p[3]||"", sec:Math.max(10, Math.min(180, parseInt(p[4],10) || 60)), role:ROLE[(p[5]||"").trim()] || "core", tip:p.slice(6).join(" | ")});
    }
    else if ((kind==="追问"||kind==="FU") && p[1] && p[2]){ res.follow.push({qid:p[1].toUpperCase(), text:p[2].trim(), ans:p.slice(3).join(" | ").trim()}); }
    else if ((kind==="计划"||kind==="PLAN") && /^(替换|replace)$/i.test(String(p[1] || "").trim())){ res.planReplace = true; }
    else if ((kind==="计划"||kind==="PLAN") && p[1] && p[3]){ if (/^\d{4}-\d{2}-\d{2}$/.test(p[1].trim())) res.plan.push({date:p[1].trim(), cue:(p[2]||"").trim(), text:p[3].trim(), act:(p[4]||"").trim()}); else res.bad.push(line); }
    else if ((kind==="也对"||kind==="OK") && p[1] && p[2]){ res.alts.push({id:p[1].trim(), text:p.slice(2).join(" | ")}); }
    else if ((kind==="答"||kind==="A") && p[1] && p[2]){ res.answers.push({qid:p[1].toUpperCase(), text:p.slice(2).join(" | ")}); }
    else if ((kind==="要点"||kind==="K") && p[1] && p[2]){ res.keys.push({qid:p[1].toUpperCase(), keys:p.slice(2).join("；").split(/[；;、\n]/).map(x=>x.trim()).filter(Boolean)}); }
    else res.bad.push(i+1);
  });
  for (const c of res.cards) c.id = "c" + hash(c.t + "|" + tokens(c.en).join(" "));
  return res;
}

/* 一天从凌晨几点开始算（默认 4 点）：熬夜时，凌晨的练习和日记还算前一天 */
function today(){ const h = (S && S.settings && +S.settings.dayStart) || 0; return dstr(new Date(Date.now() - h * 3600e3)); }

function newUsedToday(){ return S.newToday.d === today() ? S.newToday.n : 0; }
function interviewMode(){
  const d = S.settings.interviewDate; if (!d) return "daily";
  const left = dnum(d) - dnum(today());

}
function ivDaysLeft(){ const d = S.settings.interviewDate; if (!d) return null; const left = dnum(d) - dnum(today()); return left >= 0 ? left : null; }
function rateCard(card, r, ms, opts){
  opts = opts || {};
  { const hd = today(); S.hist = S.hist || {}; const hl = S.hist[hd] || (S.hist[hd] = []); hl.push({id:card.id, r, said:String(opts.said || "").slice(0, 200), ts:Date.now()}); if (hl.length > 400) hl.splice(0, hl.length - 400); }
  const tn = dnum(today());

  if (!opts.retry){
    if (!S.cards[card.id]){ if (S.newToday.d !== today()) S.newToday = {d:today(), n:0}; S.newToday.n++; }
    S.cards[card.id] = K.srsRate(S.cards[card.id], r, tn);
    const day = dayRec(); day.cards++; if (r !== "again") day.ok++;
    const tg = S.tags[today()] || (S.tags[today()] = {}); const t = tg[card.tag] || (tg[card.tag] = [0,0]); t[0]++; if (r !== "again") t[1]++;

      day.ms = (day.ms||0) + ms; day.mn = (day.mn||0) + 1;
      const b = S.best[card.id];

const TTS = {

    if (!this.ok) return;

    load(); try { speechSynthesis.addEventListener("voiceschanged", load); } catch (e) { speechSynthesis.onvoiceschanged = load; }
    setTimeout(load, 800); setTimeout(load, 2500);
  },
  norm(l){ return String(l||"").replace("_","-").toLowerCase(); },
  list(lang){ return this.voices.filter(v => this.norm(v.lang).startsWith(lang)); },
  voice(lang){
    const pref = lang === "zh" ? L.zhVoice : L.enVoice;
    const pool = this.list(lang);
    if (pref){ const v = pool.find(v => v.name === pref); if (v) return v; }
    if (lang === "en") return pool.find(v=>this.norm(v.lang)==="en-us" && /google|natural|enhanced|neural/i.test(v.name)) || pool.find(v=>this.norm(v.lang)==="en-us") || pool[0] || null;
    return pool.find(v=>/zh-cn|cmn/.test(this.norm(v.lang))) || pool.find(v=>!/hk|tw/.test(this.norm(v.lang))) || pool[0] || null;
  },
  hasZh(){ return this.list("zh").length > 0; },
  /* 听力换着用不同的声音（多个说话人比只听一个声音更有助于听懂不同的人） */
  mixVoice(){
    if (!L.voiceMix) return null;
    let pool = this.voices.filter(v => this.norm(v.lang).startsWith("en"));
    if (!L.accentMix){ const us = pool.filter(v => this.norm(v.lang) === "en-us"); if (us.length) pool = us; }

  cancel(){ if (this.ok) try { speechSynthesis.cancel(); } catch (e) {} },
  speak(text, o){
    o = o || {};

      /* 只在确实有东西在读时才取消。安卓 Chrome 上，刚“取消”完马上读，下一句容易被吞掉；手机空着的时候就别去取消它 */

      const v = o.voice || this.voice(lang);

      if (v){ try { u.voice = v; u.lang = v.lang; } catch (e) {} }

      /* 只记录、不去动朗读服务：开始出声了就清零；到了预计时间还没开始也没结束，算一次“没出声” */
      u.onstart = () => { started = true; this.miss = 0; };

const Player = {

    if (this.key === key && this.a){ if (this.a.paused){ pauseAllAudio(this.a); TTS.cancel(); this.a.play().catch(() => {}); this.label("暂停"); } else { this.a.pause(); this.label("播放"); } return; }

  label(t){ if (this.btn && this.btn.isConnected) this.btn.textContent = t; },

${(S.settings.profile || "").trim() ? "关于他：" + S.settings.profile.trim() + "\n" : ""}中文母语者最常见的错误：漏 be 动词（That cool → That's cool）；时态（讲过去的事用现在时；I'm graduated → I've graduated；用 will 表示习惯）；although…but、because…so 成对使用；多余的 to（spend time to do）；复数 -s；介词；中式搭配。
他的学习方法是：先只看错误和提示，自己改，再看参考改法。所以 hint 里不要直接给出改好的句子。
内容类型：${kind}
${extra ? extra + "\n" : ""}他写的（或说的）内容：
"""
${text.slice(0, 6000)}
"""
只回复一个 JSON 对象，不要别的文字：
{"issues":[{"quote":"原文里有问题的片段，逐字摘抄，尽量短","type":"时态|be 动词|成对词|多余的 to|复数|介词|搭配|语序|拼写|其他","hint":"中文提示：哪里不对、该怎么想，不直接给答案"}],"good":"一句中文：这段做得好的一点","better":"整段的参考改法（英文，尽量保留他的意思和用词，只改错误和明显不自然的地方）","tip":"一句中文：下次最值得注意的一点"}
没有错误时 issues 为空数组。issues 最多 8 个，按重要程度排序。`;
  },
  async review(kind, text, extra, out){
    if (!this.fn || this.off){ toast("这个版本用不了 AI 批改，可以复制给 Claude"); return; }
    text = String(text||"").trim();
    if (text.length < 8){ toast("先写几句英文"); return; }
    if (this.ctl) try { this.ctl.abort(); } catch (e) {}
    const ctl = this.ctl = new AbortController();
    out.innerHTML = `<div class="panel ai-out"><p class="muted">Claude 正在看，通常 10–40 秒……</p><button class="btn sm" data-act="ai-stop">停止</button></div>`;
    try {
      const res = await this.fn.json(this.prompt(kind, text, extra), {modelTier:"default", signal:ctl.signal});
      if (!out.isConnected) return;
      out.innerHTML = renderAI(text, res);
    } catch (e) {

      if (code === "cancelled"){ out.innerHTML = ""; return; }
      if (["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(code)){

      }
      const msg = code === "rate_limited" ? "用得太频繁了，过一会儿再试" : code === "invalid_json" ? "这次结果没读出来，再点一次试试" : "这次没成功，检查网络后再试";
      out.innerHTML = `<div class="panel small">${msg}</div>`;
    } finally { if (this.ctl === ctl) this.ctl = null; }
  },
  stop(){ if (this.ctl) try { this.ctl.abort(); } catch (e) {} }
};
function renderAI(text, res){
  const issues = Array.isArray(res && res.issues) ? res.issues.slice(0, 8) : [];
  const marks = [];
  const low = text.toLowerCase();
  issues.forEach((it, i) => { const q = String(it.quote||"").trim(); if (!q) return; const at = low.indexOf(q.toLowerCase()); if (at >= 0) marks.push({start:at, end:at+q.length, n:i+1}); });
  let html = "";
  if (issues.length){
    html += `<div class="marked">${markText(text, marks)}</div><ol class="issues">${issues.map(it => `<li><b>${esc(it.type||"")}</b>　${esc(it.hint||"")}</li>`).join("")}</ol>`;
  } else html += `<p class="verdict exact">没发现明显的错误</p>`;
  if (res && res.good) html += `<p class="note">做得好：${esc(res.good)}</p>`;
  if (res && res.tip) html += `<p class="note">下次注意：${esc(res.tip)}</p>`;
  if (res && res.better) html += `<details style="margin-top:10px"><summary>自己改完再看：参考改法</summary><div class="better">${esc(res.better)}</div></details>`;
  return `<div class="panel ai-out">${html}</div>`;
}
function markText(text, marks){
  marks = marks.slice().sort((a,b) => a.start - b.start);
  let out = "", pos = 0;
  for (const m of marks){ if (m.start < pos) continue; out += esc(text.slice(pos, m.start)) + `<mark>${esc(text.slice(m.start, m.end))}<sup>${m.n}</sup></mark>`; pos = m.end; }
  return out + esc(text.slice(pos));
}

"use strict";
const VIEWS = {};
const ACT = {};
const UI = {
  stack: [],
  root: null,
  top(){ return this.stack[this.stack.length-1]; },
  leave(){
    const e = this.top(); const v = e && VIEWS[e.name];
    if (v && v.leave) try { v.leave(e.params); } catch (err) { console.warn(err); }
    TTS.cancel(); SR.abort(); Rec.cancel(); Wake.off(); Act.stop(); AI.stop(); Player.stop();
  },
  render(){
    const e = this.top(); const v = VIEWS[e.name] || VIEWS.home;
    document.body.classList.toggle("full", !!v.full);
    this.root.innerHTML = v.render(e.params || {});
    $$(".tabbar button").forEach(b => b.setAttribute("aria-current", b.dataset.v === v.tab ? "page" : "false"));
    window.scrollTo(0, 0);
    if (v.mount) try { v.mount(e.params || {}); } catch (err) { console.error(err); }
  },
  refresh(){ const e = this.top(); const v = e && VIEWS[e.name]; if (v && !v.noRefresh) this.render(); },
  histLen: 1, ignoreUntil: 0,
  syncHist(){
    const want = this.stack.length;
    try {
      if (want > this.histLen){ for (let i = this.histLen; i < want; i++) history.pushState({d:i+1}, ""); }
      else if (want < this.histLen){ this.ignoreUntil = Date.now() + 800; history.go(want - this.histLen); }
    } catch (e) {}
    this.histLen = want;
  },
  nav(name, params){ this.leave(); this.stack.push({name, params:params||{}}); this.syncHist(); this.render(); },
  replace(name, params){ this.leave(); this.stack[this.stack.length-1] = {name, params:params||{}}; this.render(); },
  tab(name){
    this.leave();
    this.stack = name === "home" ? [{name:"home", params:{}}] : [{name:"home", params:{}}, {name, params:{}}];
    this.syncHist(); this.render();
  },
  back(){ if (this.stack.length > 1) history.back(); else this.tab("home"); },
  onPop(){
    if (this.ignoreUntil && Date.now() < this.ignoreUntil){ this.ignoreUntil = 0; return; }
    if (this.stack.length > 1){ this.leave(); this.stack.pop(); this.histLen = Math.max(1, this.histLen - 1); this.render(); }
  }
};

  const left = Math.max(0, S.settings.newPerDay - newUsedToday());
  const fresh = CAT.cards.filter(c => c.t !== "l" && !S.cards[c.id] && pred(c)).length;
  return {due, newLeft: Math.min(left, fresh)};
}

function showItem(){

/* 3 / 10 / 20 分钟是真的限时：时间到了就收尾，剩下的题留到下次 */
function nextItem(){

  showItem();
}
/* 到时间了：不偷偷接着练，停下来让你自己选 */
function showTimeUp(){
  const el = stageEl(); if (!el){ showItem(); return; }
  if (RUN.stage && RUN.stage.leave) RUN.stage.leave(); RUN.stage = null; TTS.cancel();
  const later = RUN.items.slice(RUN.i), retries = later.filter(x => x.retry).length, mins = Math.round(RUN.limitMs / 60000);
  el.innerHTML = `<div class="card"><h3>${mins} 分钟到了</h3><p class="muted small" style="margin-top:6px">后面还有 ${later.length} 题${retries ? `，其中 ${retries} 题是刚才没说出来、要再练一次的` : ""}。剩下的不会丢，会留到下次。</p>
    ${retries ? `<button class="btn primary block" style="margin-top:12px" data-act="tu-finish">把没说出来的 ${retries} 题练完再结束</button>` : ""}

    <button class="btn block ghost" style="margin-top:8px" data-act="tu-more">再练 5 分钟</button></div>`;
}

}
function srUnbreak(){ if (!SR.broken) return false; SR.broken = false; SR.fails = 0; L.device = L.device || {}; L.device.srBroken = false; saveLocal(); return true; }
ACT["input-mode"] = el => {
  const v = el.dataset.v;
  if (v === "auto"){ S.settings.inputMode = "auto"; if (srUnbreak()) toast("改成麦克风识别了。还是识别不了的话，再切回键盘语音输入"); }

/* 卡片：反射卡 / 时态快反 / 找错 / 扩句 */
/* 语法检查：红色是一定要改的；黄色是美国人口语里也常这么说、改不改都行的 */
const GRAM_OPT = new Set(["地道说法", "口语"]);
function gramCheck(said, shown){
  const all = K.checkWriting(said).filter(i => i.tag !== "书写").sort((a, b) => a.start - b.start);
  const must = [], opt = []; for (const i of all) (GRAM_OPT.has(i.tag) ? opt : must).push(i);
  let html = "", pos = 0;
  for (const i of all){ if (i.start < pos) continue; html += esc(said.slice(pos, i.start)) + `<mark class="${GRAM_OPT.has(i.tag) ? "opt" : "must"}">${esc(said.slice(i.start, i.end))}</mark>`; pos = i.end; }
  html += esc(said.slice(pos));
  const fresh = x => !shown || !shown.has(x.msg);
  return {html, must: must.filter(fresh), opt: opt.filter(fresh)};
}
function gramBoxHTML(gc){
  return `<div class="gram-box">${gc.must.map(i => `<div class="gline must"><span class="gtag">一定要改</span>“${esc(i.text)}”：${esc(i.msg)}</div>`).join("")}${gc.opt.map(i => `<div class="gline opt"><span class="gtag">改不改都行</span>“${esc(i.text)}”：${esc(i.msg)}</div>`).join("")}</div>`;
}

  drillSteps(){

/* 听力：新句子先选意思，复习时听后复述 */
class ListenStage {
  constructor(card){

    this.opts = K.shuffle([card, ...pool]);
  }
  leave(){ this.alive = false; clearTimeout(this.tmr); SR.abort(); }
  show(){ this.render(); setTimeout(() => this.play(false), 250); }
  render(){
    const el = stageEl(); if (!el) return; const c = this.card; const tts = TTS.ok;

      `<p class="note">这台设备没有英文朗读，先看文字练：</p><div class="en">${wordsHTML(c.en)}</div>`;
    if (this.mode === "repeat"){
      if (!this.done){
        const mic = SR.usable();
        el.innerHTML = `<div class="card">${head}${playRow}<p class="small muted center" style="margin-top:12px">不看文字，把听到的整句说出来</p>${inputToggleHTML()}

          <div class="or"><input type="text" class="en" id="typed" placeholder="${L.quiet ? "打字回答，同时在心里默念或做口型" : mic ? "或用键盘语音输入、打字" : "点这里，用键盘的麦克风说"}" enterkeyhint="done"><button class="btn sm" data-act="l-check">检查</button></div>

        const ty = $("#typed");

          let last = 0, dict = false, small = 0;
          ty.addEventListener("input", () => { const v = ty.value; const d = v.length - last; if (d >= 4) dict = true; if (d > 0 && d <= 2) small++; last = v.length; clearTimeout(this.tmr);
            if (autoCheckOK(dict, small) && v.trim().split(/\s+/).length >= 2) this.tmr = setTimeout(() => { if (this.alive && !this.done && ty.value.trim()) this.repeatCheck(ty.value.trim()); }, 2200); });
        }
      } else {
        const cmp = this.cmp; const lv = cmp ? cmp.level : "off";

        el.innerHTML = `<div class="card">${head}<div class="verdict ${cmp ? lv : ""}">${lab}</div>${this.saidRaw ? `<p class="small muted">你说的：<span class="en" style="font-size:15px">${esc(this.saidRaw)}</span></p>` : ""}
          ${cmp && !cmp.exact ? `<div class="diff">${diffHTML(cmp.ops)}</div><p class="small muted">绿色是没听出来（或没说出来）的词。最容易漏的是 did you、want to、I'd 这类读得很轻的小词。</p>` : ""}
          <div class="say-line" style="margin-top:8px"><div class="en">${wordsHTML(c.en)}</div><button class="icon-btn" data-act="l-play" aria-label="朗读">${ICON.speak}</button></div>

      }

  pick(i){
    if (this.done || this.mode !== "meaning") return;

    const r = await SR.listen({onInterim: t => { if (h && h.isConnected) h.textContent = t; }});
    this.live = false; if (!this.alive || this.done) return; b && b.classList.remove("live");
    if (r.broke && !r.text){ toast("这台手机的自动识别用不了，已改用键盘语音输入"); this.render(); return; }
    if (!r.text){ if (h) h.textContent = r.error ? srErrorText(r.error) : "没听清，再点一次"; return; }
    this.repeatCheck(r.text);
  }
  repeatCheck(said){
    if (this.done) return; clearTimeout(this.tmr);
    this.cmp = said ? K.compareSaid(this.card.en, [], said) : null; this.done = true; this.saidRaw = said || "";
    const lv = this.cmp ? this.cmp.level : "off";
    const r = lv === "exact" ? (this.plays <= 2 && !this.slow ? "good" : "hard") : lv === "close" ? "hard" : "again";
    rateCard(this.card, r, 0, {said:this.saidRaw}); RUN.res.listenN++; if (lv !== "off") RUN.res.listenOk++;
    if (lv === "exact"){ Snd.good(); vib(15); } else if (lv === "off"){ Snd.bad(); vib([30,40,30]); }
    this.render(); if (canAutoSpeak() && lv !== "exact") TTS.speak(this.card.en);
  }
}

/* 面试一题（练习里、单题彩排共用） */
class IvStage {
  constructor(q, o){ this.q = q; this.o = o || {}; this.alive = true; this.phase = "ask"; this.round = 0; this.plays = 0; this.peek = false;
    if (q) this.variant = q.v[Math.floor(Math.random() * q.v.length)]; this.voice = TTS.mixVoice(); }

  leave(){ this.alive = false; clearInterval(this.clock); Rec.cancel(); if (this.url) URL.revokeObjectURL(this.url); }
  show(){ this.render(); if (this.phase === "ask") setTimeout(() => this.play(), 300); }
  keysHTML(){ const a = S.answers[this.q.id]; return S.settings.cheat && a && a.keys && a.keys.length ? `<div class="panel" style="margin-top:12px"><div class="small muted">我的小抄</div><ul class="issues">${a.keys.map(k => `<li>${esc(k)}</li>`).join("")}</ul></div>` : ""; }

        ${this.recOn ? `<div class="level" id="lvl"><i></i></div>` : `<p class="small muted">${esc(this.recErr || "这次不录音")}：照样大声说，说完点结束。</p>`}
        <button class="btn primary block big" style="margin-top:16px" data-act="iv-stop">我答完了</button>
        <div style="text-align:left">${this.keysHTML()}</div></div>`;
    } else {
      const a = S.answers[q.id]; const nextT = this.targets[this.round+1];
      const checks = ["第一句直接回答了问题（先给结论）","讲经历用了过去式（I designed / I tested…）","没有 although…but、because…so","说了一个具体例子或数字","在目标时间以内"];
      el.innerHTML = `<div class="card"><div class="kind"><span class="chip k">复盘</span>${this.ms ? `<span class="num" style="margin-left:auto;font-size:18px">${fmtSec(this.ms)}</span>` : ""}</div>

    TTS.cancel(); this.phase = "answer"; this.recOn = false; this.recErr = "";

    if (!this.alive){ Rec.cancel(); return; }
    this.render(); if (this.recOn) Rec.lvlEl = $("#lvl");
    this.t0 = Date.now(); const ck = $("#ivClock"); const tgt = this.targets[this.round] * 1000;
    clearInterval(this.clock);
    this.clock = setInterval(() => { const ms = Date.now() - this.t0; if (ck && ck.isConnected){ ck.textContent = fmtSec(ms); ck.classList.toggle("over", ms > tgt); } }, 250);
  }
  async stop(){
    clearInterval(this.clock); this.ms = Date.now() - this.t0;
    if (this.recOn){ const r = await Rec.stop(); if (r && r.blob && r.blob.size){ if (this.url) URL.revokeObjectURL(this.url); this.url = URL.createObjectURL(r.blob); this.blob = r.blob; } }
    if (!this.alive) return;

  done(){
    const a = ans(this.q.id); a.practiced = (a.practiced||0) + 1; a.lastAt = Date.now();

    if (this.blob) IDB.put("iv:" + this.q.id, this.blob);
    save(); RUN.res.iv++;
    if (this.o.inRun) nextItem(); else UI.back();
  }
}

  if (mod === "basic") return all.filter(q => ["first","core","ask"].includes(qRole(q)));

  const used = q => (S.answers[q.id] && S.answers[q.id].practiced) || 0;
  const take = (arr, k) => K.shuffle(arr).sort((a, b) => ((a.deck ? 0 : 1) - (b.deck ? 0 : 1)) || used(a) - used(b)).slice(0, k);

    concept: `Hi, I'm ${name}. I'm going to ask you a few quick technical questions. Just tell me what you know.`}[mod];

/* 用你导入的题库打电话：面试官名字和公司也用你的 */
function buildDeckCall(n, qs, deck){
  const C = CONTENT.CALL; const meta = (S.deckMeta || {})[deck] || {};
  const name = meta.name ? meta.name.split(/\s+/)[0] : pick(C.names);
  const open = meta.company ? `Hi, this is ${name} from ${meta.company}. Is now still a good time to talk?` : pick(C.open).replace("{n}", name);
  const segs = [{kind:"open", say:open, zh:"开场：确认现在方便通话", hint:C.openReply}];
  const used = q => (S.answers[q.id] && S.answers[q.id].practiced) || 0;
  const first = qs.find(q => q.role === "first") || qs[0];
  const ask = qs.find(q => q.role === "ask");
  const core = K.shuffle(qs.filter(q => q !== first && q !== ask && q.role !== "screen")).sort((a, b) => used(a) - used(b));
  const screen = K.shuffle(qs.filter(q => q.role === "screen"));
  const order = [first, ...core.slice(0, n >= 5 ? 2 : 1), ...screen.slice(0, n >= 5 ? 2 : 1), ask || QBY.Q8];
  order.forEach((q, i) => {
    segs.push({kind:"q", qid:q.id, say:(i === 0 ? pick(C.start) : pick(C.next)) + " " + pick(q.v), zh:q.zh});
    if (q.role === "core" && q.follow && q.follow.length && Math.random() < 0.5) segs.push({kind:"f", qid:q.id, say:pick(q.follow), zh:"追问"});
  });
  segs.push({kind:"close", say:C.qReply + " " + C.close, zh:"回应你的问题，然后结束通话", hint:C.closeReply});
  return {name, segs};
}
function buildCall(n){
  const cd = S.settings.callDeck;
  if (cd && cd.startsWith("u:") && callSets().some(s => s.id === cd)){ const deck = cd.slice(2); return buildDeckCall(n, (S.customQ || []).filter(q => q.deck === deck), deck); }
  const C = CONTENT.CALL; const name = pick(C.names);
  const segs = [{kind:"open", say:pick(C.open).replace("{n}", name), zh:"开场：确认现在方便通话", hint:C.openReply}];
  const used = q => (S.answers[q.id] && S.answers[q.id].practiced) || 0;
  const mid = K.shuffle(CONTENT.QUESTIONS.filter(q => q.grp === "core" && q.id !== "Q1" && q.id !== "Q8"))
    .sort((a, b) => used(a) - used(b) + ((b.id === "Q2" || b.id === "Q6") - (a.id === "Q2" || a.id === "Q6")) * 0.5);
  const qs = [QBY.Q1, ...mid.slice(0, n >= 5 ? 2 : 1)];
  if (n >= 5) qs.push(pick(CONTENT.QUESTIONS.filter(q => q.grp === "screen" && q.id !== "Q14")));
  qs.push(QBY.Q8);
  qs.forEach((q, i) => {
    segs.push({kind:"q", qid:q.id, say:(i === 0 ? pick(C.start) : pick(C.next)) + " " + pick(q.v), zh:q.zh});
    if ((q.id === "Q2" || q.id === "Q3") && q.follow.length && Math.random() < 0.6) segs.push({kind:"f", qid:q.id, say:pick(q.follow), zh:"追问"});
  });
  segs.push({kind:"close", say:C.qReply + " " + C.close, zh:"回应你的问题，然后结束通话", hint:C.closeReply});
  return {name, segs};
}

const HF = {st:null};
/* 耳机模式听哪些：跟首页题库一样 / 今天练过的 / 学过的单词 / 某一个题库 */
function hfSources(){
  const out = [["deck", "跟首页选的题库一样"], ["today", "今天练过的（没说出来的先放）"]];
  if (CAT.cards.some(c => c.t === "w" && S.cards[c.id])) out.push(["w", "只听学过的单词"]);
  for (const d of deckList()) if (d.id !== "all") out.push(["d:" + d.id, "只听：" + d.label]);
  return out;
}
function handsList(src){
  src = src || L.hfSrc || "deck";
  if (!hfSources().some(x => x[0] === src)) src = "deck";
  const ok = c => (c.t === "r" || c.t === "t" || c.t === "w") && c.zh && c.en;
  if (src === "today"){
    const h = (S.hist || {})[today()] || []; const rank = {again:2, hard:1, good:0}; const worst = {};
    for (const e of h) if (!worst[e.id] || rank[e.r] > rank[worst[e.id]]) worst[e.id] = e.r;
    return Object.keys(worst).map(id => CAT.byId[id]).filter(c => c && ok(c)).sort((a, b) => rank[worst[b.id]] - rank[worst[a.id]]).slice(0, 40);
  }
  const tn = dnum(today());
  const dp = src === "w" ? (c => c.t === "w" && !!S.cards[c.id]) : src.startsWith("d:") ? deckPred(src.slice(2)) : deckPred(curDeck());
  const pool = CAT.cards.filter(c => ok(c) && dp(c));
  const p = c => S.cards[c.id];
  /* 优先放该复习的；其余按“耳机里多久没听过”排，不会每次都是同一批 */
  const seenAt = c => ((L.hfSeen || {})[c.id] || 0);
  const due = pool.filter(c => p(c) && p(c).due <= tn).sort((a, b) => p(a).due - p(b).due || seenAt(a) - seenAt(b));
  const learning = pool.filter(c => p(c) && p(c).due > tn && p(c).box < K.MASTERED_BOX).sort((a, b) => seenAt(a) - seenAt(b) || p(a).due - p(b).due);
  let fresh = pool.filter(c => !p(c) && c.t !== "w").sort((a, b) => seenAt(a) - seenAt(b));
  if (interviewMode() === "interview") fresh = fresh.filter(c => ["interview","rescue"].includes(c.tag)).concat(fresh.filter(c => !["interview","rescue"].includes(c.tag)));
  const out = [], seen = new Set();
  for (const c of [...due, ...learning, ...K.diversify(fresh)]){ if (out.length >= 40) break; if (!seen.has(c.id)){ seen.add(c.id); out.push(c); } }
  return out;
}

function hfCountdown(ms, tok){
  const ls = $$("#hfLamps i"); ls.forEach(i => i.classList.add("on"));

  return new Promise(res => { let k = 0; const t = setInterval(() => { if (!hfAlive(tok)){ clearInterval(t); res(); return; } if (k < ls.length){ ls[k].classList.remove("on"); k++; } if (k >= ls.length){ clearInterval(t); res(); } }, step); });
}
async function hfLoop(tok){

  r.keys = r.keys.filter(a => { if (known.has(a.qid)) return true; r.bad.push("要点 " + a.qid); return false; });

ACT["imp-apply"] = () => {
  const r = IMP; if (!r) return;
  for (const d of (r.meta.replace || [])){
    const keepC = new Set(r.cards.filter(c => c.deck === d).map(c => c.id)), keepQ = new Set(r.questions.filter(q => q.deck === d).map(q => q.id));
    for (const c of S.custom) if (c.deck === d && !keepC.has(c.id)){ delete S.cards[c.id]; delete S.best[c.id]; }
    S.custom = S.custom.filter(c => c.deck !== d || keepC.has(c.id));
    S.customQ = (S.customQ || []).filter(q => q.deck !== d || keepQ.has(q.id));
  }
  for (const c of r.cards){ const i = S.custom.findIndex(x => x.id === c.id); const clean = {id:c.id, t:c.t, tag:c.tag, en:c.en, alt:c.alt || [], note:c.note || "", zh:c.zh || "", wrong:c.wrong || "", grp:c.grp || "", word:c.word || "", mean:c.mean || "", deck:c.deck || "我的卡片"}; if (i >= 0) S.custom[i] = clean; else S.custom.push(clean); }
  S.customQ = S.customQ || [];
  for (const q of r.questions){ const i = S.customQ.findIndex(x => x.id === q.id); const clean = {id:q.id, deck:q.deck, grp:"custom", role:q.role, v:q.v, zh:q.zh, sec:q.sec, tip:q.tip, tpl:"", follow: i >= 0 ? (S.customQ[i].follow || []) : []}; if (i >= 0) S.customQ[i] = clean; else S.customQ.push(clean); }
  rebuildQ();
  S.followAns = S.followAns || {};
  for (const f of r.follow){ const q = S.customQ.find(x => x.id === f.qid); if (q && !q.follow.includes(f.text)) q.follow.push(f.text); if (f.ans) S.followAns[f.qid + "|" + f.text] = f.ans; }
  S.refAns = S.refAns || {};
  for (const a of r.answers){ const prev = (S.refAns[a.qid] || "").trim(); S.refAns[a.qid] = a.text; const x = ans(a.qid); const mine = (x.text || "").trim();
    if (!mine || mine === prev || x.fromRef){ x.text = a.text; x.fromRef = true; x.updated = Date.now(); } }
  for (const k of r.keys){ const x = ans(k.qid); x.keys = k.keys; }
  S.plan = S.plan || []; if (r.planReplace) S.plan = S.plan.filter(x => x.done);
  for (const x of r.plan){ if (!S.plan.some(y => y.date === x.date && y.text === x.text)) S.plan.push({id:"p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), date:x.date, cue:x.cue, text:x.text, act:x.act, done:false, ts:Date.now()}); }

    const have = r.cards.filter(c => c.t === "w" && c.word).map(c => tk(c.word));
    S.wantWords = S.wantWords.filter(x => { const a = tk(x.w); return !have.some(b => a.every(t => b.includes(t)) || b.every(t => a.includes(t))); });
  }
  S.myAlts = S.myAlts || {}; for (const a of r.alts){ S.myAlts[a.id] = Array.from(new Set([...(S.myAlts[a.id] || []), a.text])).slice(-6); }
  if (r.alts.length && S.pending && S.pending.length){ const ok = new Set(r.alts.map(a => a.id + "|" + K.tokens(a.text).join(" "))); S.pending = S.pending.filter(p => !ok.has(p.cid + "|" + K.tokens(p.said).join(" "))); }
  if (r.meta.date) S.settings.interviewDate = r.meta.date;
  S.deckMeta = S.deckMeta || {}; for (const w of r.meta.who) S.deckMeta[w.deck] = {name:w.name, company:w.company};
  if (r.questions.length) S.settings.callDeck = "u:" + r.questions[0].deck;
  rebuildCatalog(); save(true); IMP = null;
  const dk = Array.from(new Set(r.cards.map(c => c.deck).concat(r.questions.map(q => q.deck))))[0];
  toast(`导入好了：卡片 ${r.cards.length}，面试题 ${r.questions.length}` + (dk ? `。首页可以选“${dk}”单独练` : "")); UI.back();

/* 把一个导入的题库并到别的题库：卡片的复习记录都保留（卡片编号不变，只是换了所属题库） */
ACT["deck-merge"] = async el => {
  const name = el.dataset.v; const hasQ = (S.customQ || []).some(q => q.deck === name);
  const targets = deckList().filter(d => d.id !== "all" && d.id !== "u:" + name && !(hasQ && (d.id === "daily" || d.id === "core")));
  if (!targets.length){ toast("没有可以并进去的题库"); return; }
  const t = await choose(`把“${name}”并到哪个题库？`, (hasQ ? "这个题库里有面试题，只能并到另一个导入的题库。" : "") + "卡片的复习记录都会保留。", targets.map(d => [d.id, d.label]).concat([["", "取消"]]));
  if (!t) return;
  const to = t === "daily" ? "daily" : t === "core" ? "core" : t.slice(2); const label = (targets.find(d => d.id === t) || {}).label || to;
  for (const c of S.custom) if ((c.deck || "我的卡片") === name) c.deck = to;
  for (const q of (S.customQ || [])) if (q.deck === name) q.deck = to;
  if (S.deckMeta && S.deckMeta[name]){ if (to !== "daily" && to !== "core" && !S.deckMeta[to]) S.deckMeta[to] = S.deckMeta[name]; delete S.deckMeta[name]; }
  if (S.settings.deck === "u:" + name) S.settings.deck = t;
  if (S.settings.callDeck === "u:" + name) S.settings.callDeck = to === "daily" || to === "core" ? "core" : t;
  rebuildQ(); rebuildCatalog(); save(true); toast(`并好了：现在都在“${label}”里`); UI.render();
};
ACT["deck-del"] = async el => {
  const name = el.dataset.v;
  if (!await sheet(`删除“${name}”？`, "这个题库的卡片、面试题和对应的回答都会删掉，复习记录也一起删。", "删除", true)) return;
  const ids = new Set(S.custom.filter(c => (c.deck || "我的卡片") === name).map(c => c.id));
  S.custom = S.custom.filter(c => !ids.has(c.id)); ids.forEach(id => { delete S.cards[id]; delete S.best[id]; });
  const qids = (S.customQ || []).filter(q => q.deck === name).map(q => q.id);
  S.customQ = (S.customQ || []).filter(q => q.deck !== name); qids.forEach(id => delete S.answers[id]);
  if (S.deckMeta) delete S.deckMeta[name];
  if (S.settings.deck === "u:" + name) S.settings.deck = "all";
  if (S.settings.callDeck === "u:" + name) S.settings.callDeck = "core";
  rebuildQ(); rebuildCatalog(); save(true); toast("删掉了"); UI.render();
};

  const body = list.map((x, i) => `${i + 1}. ${x.w}${x.ctx ? `（我在这句话里看到的：${x.ctx}）` : ""}`).join("\n");
  return `下面是我在脱口里想学的词和搭配。请给我做成单词卡导入码，第一行写“题库 | 单词”，然后每个一行：\n词 | 单词或搭配 | 中文意思 | 一个我面试或生活里会说的英文例句 | 例句的中文 |\n\n${body}`;
}

ACT["st-clean30"] = async () => {
  const cut = Date.now() - 30 * 864e5;
  const old = S.journal.filter(e => e.rec && (Date.parse(e.date) || 0) < cut);
  if (!old.length){ toast("没有 30 天前的录音"); return; }
  if (!await sheet(`删掉 ${old.length} 条旧录音？`, "日记文字会保留，只删录音。", "删掉", true)) return;
  for (const e of old){ await IDB.del(e.rec); e.rec = null; }
  save(true); toast("删好了"); UI.render();
};
/* 启动后清理：已经没有日记或面试题对应的录音（以前删日记、删题库时留下的） */
async function cleanAudio(){
  try {
    const keys = await IDB.keys(); const jr = new Set(S.journal.map(e => e.rec).filter(Boolean));
    const qids = new Set(Object.keys(typeof QBY === "object" && QBY ? QBY : {}));
    for (const k of keys){
      if (k.startsWith("jr:") && !jr.has(k)) await IDB.del(k);
      else if (k.startsWith("iv:") && qids.size > 20 && !qids.has(k.slice(3))) await IDB.del(k);
    }
  } catch (e) {}
}

/* ---------- 语法要点：说的时候来不及想，先记住“先问什么”的顺序 ---------- */
const GRAMMAR = [
  {h:"be 动词：什么时候要 is / are / was / were", p:"① 后面是形容词、名词或地点，句子里没有别的动词 → 要 be：It's light.／It's a new phone.／I'm at home.　② 正在做 → be + -ing：My phone was freezing.　③ 被做 → be + 过去分词：The report was printed this morning.　④ 句子里已经有动作动词了（kept、fixed、helped）→ 不要再加 be：My phone kept freezing.，不说 My phone is kept freezing…　另外，主语是复数用 are / were，单数用 is / was。", ex:["The new laptop is light.", "My phone kept freezing.", "My phone was freezing.", "The report was printed this morning."]},
  {h:"两个动词连在一起：help fix、keep ringing", p:"有些动词后面能直接接另一个动词，就像中文的“帮忙调试”。help + 动词原形：I helped fix the website.（help to fix 也对，美国人更常省掉 to）。keep + -ing，意思是“一直……”：kept ringing。want、need、try + to + 动词：I want to learn.　let、make + 人 + 动词原形：Let me think.　讲过去的事，只把第一个动词变成过去式：helped fix、kept ringing。", ex:["I helped fix the website.", "I helped plan the party.", "My phone kept ringing.", "Let me think for a second."]},
  {h:"时态：先问自己“什么时候？”", p:"平时、习惯 → 一般现在时：I play.　已经结束的某一次 → 过去式：I played.　从过去到现在、已经、到现在为止 → 现在完成时：I've played.　此刻正在 → I'm playing.　最近一直在 → I've been playing.　打算好的将来 → I'm going to play.", ex:["I usually go to the gym on Saturdays.", "I went to the gym last Saturday.", "I've played the piano since fourth grade.", "I've been practicing a lot lately."]},
  {h:"-s：什么时候加", p:"① 主语是 he / she / it、一个人或一样东西，而且是一般现在时 → 动词加 -s。② 两个以上的东西 → 名词加 -s。③ I / you / we / they 后面，动词永远不加 -s。④ a / one / every / each 后面用单数。", ex:["My friend plays basketball every week.", "I like all kinds of games.", "They work in the lab.", "I go there every day."]},
  {h:"-ed：过去的事", p:"已经结束的事，动词用过去式：大多数加 -ed（played、tested）；常用的不规则动词要单独记：go → went，take → took，get → got，come → came，buy → bought，do → did，make → made，see → saw。have / has 后面用过去分词：I've played、I've gone。", ex:["I tested the prototype yesterday.", "My dad took me to the park.", "I've already finished it."]},
  {h:"be 动词：形容词、名词、地点前面要有", p:"中文说“天气很冷”“我在家”不用“是”，英语要有 is / am / are / was：It's cold.　I'm tired.　I'm at home.　开口先说 It's 或 I'm，后面基本就对了。", ex:["It's really cold today.", "I'm a little nervous.", "I was at home all day."]},
  {h:"语序：先说“谁 + 做什么”", p:"中文常把时间、地点放前面；英语先说“谁 + 做什么 + 什么”，再往后加和谁、在哪、什么时候。时间也可以放句首，但地点一般放在动词后面。练法就是扩句：先说最短的一句，再一块一块往后加。", ex:["I played basketball with my friend at the park yesterday.", "Yesterday, I played basketball with my friend."]},
  {h:"because 和 so、although 和 but：二选一", p:"中文说“因为……所以……”“虽然……但是……”，英语只用其中一个。口语里最简单：因果只用 so，转折只用 but。", ex:["I'm job hunting, so I stay home a lot.", "I watch soccer, but I don't follow it closely."]}

    const doneToday = all.filter(x => x.date === d && x.done);
    let body = "";
    if (tab === "today") body = (G.today.length ? `<div class="list">${G.today.map(x => planRowHTML(x, true)).join("")}</div>` : `<p class="small muted">${doneToday.length ? "今天的计划都做完了 ✓" : "今天还没有计划。"}</p>`)
      + (doneToday.length ? `<details style="margin-top:10px"><summary class="small">今天已完成 ${doneToday.length} 项</summary><div class="list" style="margin-top:6px">${doneToday.map(x => planRowHTML(x, true)).join("")}</div></details>` : "");
    if (tab === "next") body = G.next.length ? byDate(G.next) : `<p class="small muted">还没有以后的计划。</p>`;
    if (tab === "late") body = G.late.length ? `<div class="row-gap" style="margin-bottom:6px"><button class="btn sm" data-act="pl-late-today">全部挪到今天</button><button class="btn sm ghost" data-act="pl-late-del">全部删除</button></div>${byDate(G.late, true)}` : `<p class="small muted">没有拖下来没做的计划。</p>`;
    if (tab === "done") body = G.done.length ? byDate(G.done, true) : `<p class="small muted">最近 30 天还没有完成的计划。</p>`;
    const ed = PLAN_EDIT ? (S.plan || []).find(x => x.id === PLAN_EDIT) : null;
    const form = `<div class="panel" id="plForm" style="margin-top:14px"><h3>${ed ? "修改这一项" : "加一项"}</h3>
        <label class="fld"><span>哪天</span><input type="date" id="plDate" value="${esc(ed ? ed.date : d)}"></label>
        <label class="fld"><span>什么时候：每天一定会碰到的时刻，或者具体时间</span><input type="text" id="plCue" value="${esc(ed ? ed.cue || "" : "")}" placeholder="比如：晚饭后、睡前、20:00"></label>
        <div class="chips" style="margin-top:6px">${["早上起床后","午饭后","晚饭后","睡前"].map(c => `<button class="chip" data-act="pl-cue" data-v="${c}">${c}</button>`).join("")}</div>
        <label class="fld"><span>做什么</span><input type="text" id="plText" value="${esc(ed ? ed.text : "")}" placeholder="比如：模拟一场电话初筛"></label>
        <label class="fld"><span>链接到哪个练习（可选，链接了做完会自动打勾）</span><select id="plAct">${PLAN_ACTS.concat(ed && ed.act && !PLAN_ACTS.some(a => a[0] === ed.act) ? [[ed.act, planActLabel(ed.act)]] : []).map(([v, l]) => `<option value="${esc(v)}" ${ed && ed.act === v ? "selected" : ""}>${esc(l)}</option>`).join("")}</select></label>
        <div class="row-gap" style="margin-top:10px"><button class="btn primary" data-act="pl-add">${ed ? "保存修改" : "加上"}</button><button class="btn ghost" data-act="pl-cancel">取消</button></div></div>`;
    return `<div class="wrap">${backBtn()}<h2>我的计划</h2>
      <div class="seg" style="margin-top:10px">${tabs.map(([k, l]) => `<button data-act="pl-tab" data-v="${k}" aria-pressed="${tab === k}">${l}${G[k].length ? `<span class="seg-n">${G[k].length}</span>` : ""}</button>`).join("")}</div>
      <div style="margin-top:12px">${body}</div>
      ${PLAN_FORM || ed ? form : `<button class="btn block" style="margin-top:14px" data-act="pl-open">＋ 加一项</button>`}
      <div class="panel" style="margin-top:14px"><b>让 Claude 帮你整理</b><p class="small muted" style="margin-top:4px">计划多了、重复了，就复制给 Claude。它会给你一段第一行写着“计划 | 替换”的导入码：导入以后，所有没做完的计划都换成新的，做完的记录留着。</p><button class="btn block" style="margin-top:8px" data-act="pl-claude">复制所有计划给 Claude</button></div>
      <p class="small muted" style="margin-top:10px">每一项写成“什么时候 → 做什么”，比只写日期更容易做到。写了具体时间（比如 20:00）的，点“提醒我”可以加到本机日历、Google 日历，或者复制下来放进任何提醒 app。</p>
      <h3 style="margin-top:20px">每天固定的练习时间</h3>
      <p class="muted small" style="margin:6px 0 14px">写成“如果……就……”的计划，比只说“我要每天练”更容易坚持。选一个你每天一定会碰到的时刻。</p>
      <div class="panel"><div class="small muted">如果……</div><div class="chips" style="margin-top:8px">${PLAN_OPTS.map(o => `<button class="chip ${o === cur ? "k" : ""}" data-act="plan-pick" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div>
        <label class="fld"><span>或者自己写</span><input type="text" id="planText" value="${esc(PLAN_OPTS.includes(cur) ? "" : cur)}" placeholder="比如：洗完澡以后"></label>
        <p style="margin-top:12px">……我就打开脱口，至少练 3 分钟。</p></div>
      <button class="btn primary big block" style="margin-top:14px" data-act="plan-save">保存</button>
      ${cur ? `<button class="btn ghost block" style="margin-top:6px" data-act="plan-clear">不定计划</button>` : ""}</div>`;
  }
};
ACT["plan-pick"] = el => { const t = $("#planText"); if (t) t.value = ""; $$('[data-act="plan-pick"]').forEach(b => b.classList.remove("k")); el.classList.add("k"); PLAN_PICK = el.dataset.v; };
ACT["plan-save"] = () => { const t = (($("#planText")||{}).value || "").trim(); const v = t || PLAN_PICK || S.settings.planWhen; if (!v){ toast("选一个时刻，或者自己写一个"); return; } S.settings.planWhen = v; PLAN_PICK = null; save(); toast("记下了"); UI.render(); };
ACT["plan-clear"] = () => { S.settings.planWhen = ""; save(); UI.render(); };

/* ---------- 首次引导 ---------- */
VIEWS.onboard = {
  full:true,
  render(){
    return `<div class="wrap" style="padding-top:32px"><div class="gantry big" id="obLamps">${lamps()}</div>
      <div class="wordmark" style="margin-top:22px;font-size:60px">脱口</div>
      <p style="font-size:18px;margin-top:10px">把“知道”的英语，练成“脱口而出”。</p>
      <div class="panel" style="margin-top:22px"><h3>每道题这样练</h3><ol class="issues"><li>看中文提示</li><li>灯灭，马上开口说英文</li><li>对答案，给自己打分</li><li>app 按你说得怎么样，安排下次什么时候再练</li></ol></div>
      <label class="fld"><span>电话面试是哪天？可以先空着</span><input type="date" id="obDate" value="${esc(S.settings.interviewDate)}"></label>
      <div class="fld" style="margin-top:12px"><span class="small muted">每天什么时候练？选一个每天都会碰到的时刻</span><div class="chips" style="margin-top:8px">${PLAN_OPTS.map(o => `<button class="chip" data-act="ob-plan" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div></div>
      <button class="btn primary big block" style="margin-top:18px" data-act="ob-go">先测一下手机能不能朗读和识别</button>
      <button class="btn ghost block" style="margin-top:6px" data-act="ob-skip">跳过，直接开始</button></div>`;
  },
  mount(){ setTimeout(() => runLights($("#obLamps"), 260, 500, true), 300); }
};
function obSave(){ const d = $("#obDate"); if (d && d.value) S.settings.interviewDate = d.value; if (PLAN_PICK) S.settings.planWhen = PLAN_PICK; PLAN_PICK = null; S.settings.onboarded = true; save(true); }
ACT["ob-plan"] = el => { $$('[data-act="ob-plan"]').forEach(b => b.classList.remove("k")); el.classList.add("k"); PLAN_PICK = el.dataset.v; };
ACT["ob-go"] = () => { obSave(); UI.stack = [{name:"home", params:{}}]; UI.nav("device", {from:"ob"}); };
ACT["ob-skip"] = () => { obSave(); UI.tab("home"); };

/* ---------- 启动 ---------- */
function boot(){
  UI.root = $("#app");
  applyTheme(); TTS.init(); MIC.init(); if (L.device && L.device.srBroken) SR.broken = true;
  UI.stack = [{name: S.settings.onboarded ? "home" : "onboard", params:{}}];
  try { history.replaceState({d:1}, ""); } catch (e) {}
  UI.render();
  if (L.device && L.device.local === "available") SR.local = true;
  setTimeout(() => { Cloud.init(); AI.init(); }, 0);
  if (BUILD.pwa && "serviceWorker" in navigator && (location.protocol === "https:" || /^(localhost|127\.0\.0\.1)$/.test(location.hostname))) navigator.serviceWorker.register("./sw.js").catch(() => {});
  if (BUILD.pwa && "serviceWorker" in navigator){ let had = !!navigator.serviceWorker.controller; navigator.serviceWorker.addEventListener("controllerchange", () => { if (had) toast("已更新到新版本，下次打开生效"); had = true; }); }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  setTimeout(cleanAudio, 4000);
  let day = today();
  setInterval(() => { if (today() !== day){ day = today(); const t = UI.top(); if (t && t.name === "home") UI.refresh(); } }, 60000);
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();

</script>
</body>
</html>
